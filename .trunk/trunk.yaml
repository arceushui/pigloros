# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # Large Rust diffs can exceed Trunk's 10-minute default while rustfmt is
    # formatting out-of-line modules. The workflow still bounds the full job.
    - name: rustfmt
      run_timeout: 20m
    # Custom policy: coverage(off) test-only; no ```ignore doctest fences.
    # #[ignore] is left to nextest --run-ignored all (CI still runs them).
    - name: rust-test-policy
      files: [rust]
      commands:
        - name: lint
          run: python3 ${workspace}/.trunk/rust-test-policy.py ${target}
          output: regex
          parse_regex: "(?P<path>.*):(?P<line>-?\\d+):(?P<col>-?\\d+): \\[(?P<severity>[^\\]]*)\\] (?P<message>.+) \\((?P<code>[^\\)]*)\\)"
          success_codes: [0, 1]
          read_output_from: stdout
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - taplo@0.10.0
    - yamllint@1.38.0
    - rustfmt@1.97.1
    - rust-test-policy
actions:
  enabled:
    - trunk-upgrade-available
  # Trunk's git-hook actions rewrite core.hooksPath to a Trunk cache directory.
  # The versioned .githooks/pre-commit is the repository hook (enable it with
  # `git config core.hooksPath .githooks`); it runs `trunk check` itself.
  disabled:
    - trunk-announce
    - trunk-fmt-pre-commit
    - trunk-check-pre-commit
    - trunk-check-pre-push
