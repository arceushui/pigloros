# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  definitions:
    # Custom policy: coverage(off) test-only; no ```ignore doctest fences.
    # #[ignore] is left to cargo test -- --include-ignored (CI still runs them).
    - name: rust-test-policy
      files: [rust]
      commands:
        - name: lint
          run: python3 ${workspace}/.trunk/rust-test-policy.py ${target}
          output: regex
          parse_regex: "(?P<path>.*):(?P<line>-?\\d+):(?P<col>-?\\d+): \\[(?P<severity>[^\\]]*)\\] (?P<message>.+) \\((?P<code>[^\\)]*)\\)"
          success_codes: [0, 1]
          read_output_from: stdout
  enabled:
    - actionlint@1.7.12
    - git-diff-check
    - taplo@0.10.0
    - yamllint@1.38.0
    - rustfmt@1.97.1
    - rust-test-policy
actions:
  enabled:
    - trunk-announce
    # Format on commit; full check (incl. rust-test-policy) on commit + push.
    - trunk-fmt-pre-commit
    - trunk-check-pre-commit
    - trunk-check-pre-push
    - trunk-upgrade-available
