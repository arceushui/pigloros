[[gates]]
name = "new-production-rust-code"
# The #444 evidence guest's driver binary lives outside `src/`; it is gated
# like every other binary.
include = ["**/src/**/*.rs", "apps/pos-sandboxd/conformance/**/*.rs"]
exclude = ["crates/pos-owner-bridge-windows/**"]
fail-under-lines = 99
fail-under-regions = 99
