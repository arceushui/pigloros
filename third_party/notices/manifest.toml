# Provenance of the third-party notice texts that no Cargo.lock describes (#545).
#
# Every text under this directory is an exact upstream file, or an exact line
# range of one, fetched from the commit recorded below. `sha256` is the digest
# of the complete upstream file. An excerpt also gives the 1-based inclusive
# `lines` it keeps and `excerpt_sha256`, the digest of the committed text.
#
# `python3 scripts/third_party_notices.py verify-upstream` re-fetches every
# file, checks that each tag and submodule still resolves to the recorded
# commit, and compares the digests and the committed bytes. Never edit a text
# by hand: bump the version in one reviewed change and re-fetch every file.

schema = 1

