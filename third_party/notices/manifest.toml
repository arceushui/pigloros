# Rust std's crates.io dependencies, which std links into the Rust guests on
# wasm32-unknown-unknown. `rust-std-report` runs cargo-about on the toolchain's
# rust-src `library/std` with the features the Rust release builds std with
# (bootstrap's defaults: `panic-unwind` from rust.std-features and `backtrace`
# from rust.backtrace), after checking that both files below equal the ones at
# the `rust` component's commit. Each crate in that graph must also ship as a
# wasm32-unknown-unknown rlib in the toolchain sysroot.
[rust_std]
component = "rust"
features = ["backtrace", "panic-unwind"]
lockfile = "library/Cargo.lock"
lockfile_sha256 = "02120dd57c4c5fd70c81fd92472681c8de5cc2dd78258276da37bb2253666061"
std_manifest = "library/std/Cargo.toml"
std_manifest_sha256 = "ff5272b18cb16a9e67256a1045dc35d9d08ae38916a218f684a2ae2f4360f078"

