# pos-sandboxd host requirement (ADR-069 R14 N12).
#
# With the kernel default of 0, loading `sit`, `ipip`, `ip_gre`, `ip6_tunnel`
# or `ip_vti` gives every new network namespace down fallback tunnel devices
# (`sit0`, `tunl0`, `gre0`, `ip6tnl0`, `ip_vti0` and others). A sandbox unit's
# PrivateNetwork=true namespace must hold only `lo`, so the provider's unit
# network check would refuse every attempt. The provider reads this sysctl at
# startup and keeps admission closed unless it is at least 1.
#
# Install as /etc/sysctl.d/60-piglor-sandbox.conf (or the packaging
# equivalent) so that systemd-sysctl applies it before the provider starts.
net.core.fb_tunnels_only_for_init_net = 1
