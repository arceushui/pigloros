# The isolated fuzzing workspace is governed by Proposed ADR-063:
# https://redmine.piglor.com/projects/pigloros/wiki/ADR-063_Isolated_Fuzzing_and_Layered_Rust_Quality_Gates
# Implementation proceeded while Proposed under explicit user authorization.
[package]
name = "pigloros-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
ciborium = "0.2"
libfuzzer-sys = "0.4"
piglor-gateway = { path = "../apps/piglor-gateway" }
pos-core = { path = "../crates/pos-core" }
serde_json = "1"

[[bin]]
name = "event_decode"
path = "fuzz_targets/event_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_requests"
path = "fuzz_targets/gateway_requests.rs"
test = false
doc = false
bench = false
