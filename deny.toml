# cargo-deny — dependency policy (crates / licenses / advisories / sources).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Does NOT ban Rust source attributes like #[ignore] or coverage(off).
# coverage(off) / ```ignore: Trunk rust-test-policy.
# #[ignore]: cargo test -- --include-ignored (CI still runs them).

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
yanked = "deny"
# RUSTSEC-2026-0344 (ruzstd < 0.9.1, decompression bomb): reached only through
# bevy_image 0.19.1 (`ruzstd ^0.8`) for the zstd-compressed lookup tables Bevy
# ships to apps/piglor-world-client. As of 2026-10-13 no released Bevy depends on
# a fixed ruzstd (Redmine #629). Remove (here and in .cargo/audit.toml) once
# Cargo.lock resolves ruzstd >= 0.9.1.
# RUSTSEC-2026-0370 (zvariant), RUSTSEC-2026-0371 (zbus_names) and
# RUSTSEC-2026-0372 (zvariant_derive), dated 2026-10-16, are informational
# "unmaintained" advisories (no vulnerability): zvariant moved into zbus 6 as
# `zbus::wire`.
# Reached only through apps/pos-sandboxd (zbus 5.19, zbus_systemd 0.26200,
# which still requires zbus ^5.3). Remove (here and in .cargo/audit.toml) once
# pos-sandboxd is on zbus 6 (Redmine #686).
ignore = [
  "RUSTSEC-2026-0344",
  "RUSTSEC-2026-0370",
  "RUSTSEC-2026-0371",
  "RUSTSEC-2026-0372",
]

[licenses]
version = 2
confidence-threshold = 0.8
# Unused allow-list entries are fine (forward-looking allowlist).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Workspace pins often use `"1"` / `"0.2"` — treat as warn, not hard fail.
wildcards = "warn"
highlight = "all"
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
