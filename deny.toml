# cargo-deny — dependency policy (crates / licenses / advisories / sources).
# Docs: https://embarkstudios.github.io/cargo-deny/
#
# Does NOT ban Rust source attributes like #[ignore] or coverage(off).
# coverage(off) / ```ignore: Trunk rust-test-policy.
# #[ignore]: cargo test -- --include-ignored (CI still runs them).

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
# Unused allow-list entries are fine (forward-looking allowlist).
unused-allowed-license = "allow"
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
]
exceptions = []

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
# Workspace pins often use `"1"` / `"0.2"` — treat as warn, not hard fail.
wildcards = "warn"
highlight = "all"
deny = [
  { crate = "openssl", use-instead = "rustls" },
  { crate = "openssl-sys", use-instead = "rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
