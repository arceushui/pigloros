[package]
name = "pos-plugin-release"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true, features = ["alloc"] }
# HTTPS release sources (ADR-061 amendment revision 1): exact pins with the
# accepted features only. The ring provider is set on each transport's own TLS
# configuration, never as a process-wide default.
rustls = { version = "=0.23.46", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
ureq = { version = "=3.4.2", default-features = false, features = ["rustls"] }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
  "fs",
  "process",
  "std",
] }

[dev-dependencies]
# The capturing logger of the transport log-disclosure test.
log = "=0.4.34"

[lints]
workspace = true
