[package]
name = "pos-owner-bridge"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes `FakeSurface`, the fixture signer and the deterministic ports that
# drive full enrollment and unlock flows without a WebView. This feature is
# intentionally off in deployable dependency graphs.
test-support = ["dep:p256"]

[dependencies]
getrandom = { workspace = true }
p256 = { workspace = true, optional = true }
pos-owner-bridge-codec = { path = "../pos-owner-bridge-codec" }
sha2 = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Accepted ADR-110 E16: safe descriptor-relative filesystem operations and euid.
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
pos-crypto = { path = "../pos-crypto" }

[lints]
workspace = true

[[test]]
name = "encryptor_lock_public"
path = "tests/encryptor_lock_public.rs"
required-features = ["test-support"]

[[test]]
name = "nonce_ledger_read_public"
path = "tests/nonce_ledger_read_public.rs"
required-features = ["test-support"]

[[test]]
name = "nonce_ledger_replace_public"
path = "tests/nonce_ledger_replace_public.rs"
required-features = ["test-support"]

[[test]]
name = "store_file_identity_public"
path = "tests/store_file_identity_public.rs"
required-features = ["test-support"]

[[test]]
name = "protocol"
path = "tests/protocol/main.rs"
required-features = ["test-support"]

[[test]]
name = "listener_serving"
path = "tests/listener_serving.rs"
required-features = ["test-support"]
