file = "src/ffi/process.rs"
line = 22
function = "inspect"
operation = "OpenProcess(PROCESS_QUERY_LIMITED_INFORMATION)"
invariant = "Fixed query-only access, disabled inheritance, nonzero PID; no caller pointer."
hosted_test = "current_process_identity_matches_independent_os_observations"

