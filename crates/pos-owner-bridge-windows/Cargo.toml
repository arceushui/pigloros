[package]
name = "pos-owner-bridge-windows"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows-only WebView2 owner-bridge shim (ADR-110)"

# This crate intentionally does not inherit workspace lints. ADR-110 permits
# unsafe only here; the source policy checker proves the four narrow deviations
# below and rejects unsafe code everywhere else in the workspace.
[lints.rust]
unsafe_code = "allow"
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  "cfg(coverage)",
] }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
