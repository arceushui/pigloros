[package]
name = "pos-owner-bridge-windows"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Windows-only WebView2 owner-bridge shim (ADR-110)"

[features]
test-support = []

[target.'cfg(windows)'.dev-dependencies]
pos-crypto = { path = "../pos-crypto" }
pos-owner-bridge = { path = "../pos-owner-bridge", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
pos-owner-bridge = { path = "../pos-owner-bridge" }
pos-owner-bridge-codec = { path = "../pos-owner-bridge-codec" }
sha2.workspace = true
webview2-com.workspace = true
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

# This crate intentionally does not inherit workspace lints. ADR-110 permits
# unsafe only here; the source policy checker proves the four narrow deviations
# below and rejects unsafe code everywhere else in the workspace.
[lints.rust]
unsafe_code = "allow"
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  "cfg(coverage)",
] }
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
