[package]
name = "pos-plugin-supervisor"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes the shared test fixtures and builds the `pos-plugin-worker-probe`
# fault-injection worker and the `pos-plugin-worker-argv-probe` argument
# recorder, for tests only. Never enable in deployable builds;
# the probe is not a Component worker. Enforced by
# scripts/check_test_support_features.py in CI. It also compiles the pass harness
# (`tests/support`), which commits to the optional in-memory store dependency.
test-support = [
  "pos-crypto/test-support",
  "pos-core/test-support",
  "pos-runtime/test-support",
  "dep:pos-store",
]

[dependencies]
# Safe `set_fds_cloexec_threadsafe`: marks every descriptor the supervisor
# process inherited (for example a build tool's jobserver pipe) close-on-exec
# before each launch. Closing or flagging a raw descriptor needs `unsafe`,
# which this workspace forbids; the crate is MIT and depends only on `libc`
# and `cfg-if`.
close_fds = "=0.3.2"
pos-core = { path = "../pos-core" }
pos-crypto = { path = "../pos-crypto" }
# `ContentValidationV1` appears in the invocation receipt.
pos-plugin-release = { path = "../pos-plugin-release" }
pos-runtime = { path = "../pos-runtime" }
# The pass harness (feature `test-support`) commits to the in-memory store. The default features
# stay off to keep this declaration minimal; `pos-runtime` already depends on `pos-store` with
# them, so the resolved graph is unchanged.
pos-store = { path = "../pos-store", default-features = false, optional = true }
# `process` provides prlimit, PR_SET_PDEATHSIG and getppid as safe calls. The
# worker lists its open descriptors through `/proc/self/fd` with the `fs`
# feature, which the workspace dependency already enables. `stdio` is used only
# by the test probe, to close its stdout while it keeps running.
rustix = { workspace = true, features = ["process", "stdio"] }
thiserror = { workspace = true }
ulid = { workspace = true }

[dev-dependencies]
# The pass-level tests need an open erasure gate.
pos-core = { path = "../pos-core", features = ["test-support"] }
# Supervisor tests build negotiated releases without a release closure.
pos-crypto = { path = "../pos-crypto", features = ["test-support"] }
# The pass-level tests admit scheduled passes through the local host.
pos-runtime = { path = "../pos-runtime", features = ["test-support"] }

# The host pass seam vectors run on the shared signed-release test world (ADR-061 revision 7,
# #579 and #584).
[target.'cfg(target_os = "linux")'.dev-dependencies]
pos-plugin-publisher = { path = "../pos-plugin-publisher", features = [
  "test-support",
] }

[[bin]]
name = "pos-plugin-worker-probe"
path = "tests/support/worker_probe.rs"
required-features = ["test-support"]

# Records the arguments it was launched with, for the mode token tests.
[[bin]]
name = "pos-plugin-worker-argv-probe"
path = "tests/support/argv_probe.rs"
required-features = ["test-support"]

[[test]]
name = "supervisor_public"
required-features = ["test-support"]

[[test]]
name = "community_pass"
required-features = ["test-support"]

[[test]]
name = "community_wiring_public"
required-features = ["test-support"]

[[test]]
name = "community_host_public"
required-features = ["test-support"]

# cargo-shear classifies everything under `tests/` as test code, so it sees the pass harness only
# through the feature-gated `#[path]` module in `src/lib.rs`: the root file `tests/support/mod.rs`
# looks unlinked. That is intended: the harness is a library module that other crates reach
# through the `test-support` feature, and it lives under `tests/support` to stay outside the
# production-coverage glob (`**/src/**/*.rs`). The optional `pos-store` is used by the
# integration tests, so it needs no ignore entry.
[package.metadata.cargo-shear]
ignored-paths = ["tests/support/mod.rs"]

[lints]
workspace = true
