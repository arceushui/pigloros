[package]
name = "pos-store"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Backend features — sqlite is on by default; disable with --no-default-features
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:pos-conformance"]
# Exposes recipient-export acceptance fixtures only. Never enable this in a
# deployable dependency graph; CI enforces that policy.
test-support = ["sqlite", "pos-core/test-support"]

[dependencies]
# The Memory and SQLite counterfactual adapters mint ADR-064 commit evidence;
# scripts/check_counterfactual_adapter_seal.py allows only this crate to enable
# `counterfactual-adapter`.
pos-core = { path = "../pos-core", features = ["counterfactual-adapter"] }
pos-crypto = { path = "../pos-crypto" }
ciborium = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Linux-only: recipient-key custody uses openat2/renameat2 semantics (libc, rustix);
# the trust policy registry reads conformance snapshots (pos-conformance).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }
pos-conformance = { path = "../pos-conformance", optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
pos-core = { path = "../pos-core", features = ["test-support"] }
tempfile = "3"

[[bench]]
name = "memory_erasure"
harness = false

[[test]]
name = "recipient_export_publication_faults_public"
required-features = ["test-support"]

[lints]
workspace = true
