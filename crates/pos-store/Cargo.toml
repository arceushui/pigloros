[package]
name = "pos-store"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Backend features — sqlite is on by default; disable with --no-default-features
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:pos-conformance", "dep:blake3"]

[dependencies]
blake3 = { workspace = true, optional = true }
pos-conformance = { path = "../pos-conformance", optional = true }
pos-core = { path = "../pos-core" }
pos-crypto = { path = "../pos-crypto" }
ciborium = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }
rand = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
pos-core = { path = "../pos-core", features = ["test-support"] }
tempfile = "3"

[[bench]]
name = "memory_erasure"
harness = false

[lints]
workspace = true
