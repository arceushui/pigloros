[package]
name = "pos-store"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Backend features — sqlite is on by default; disable with --no-default-features
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:pos-conformance"]

[dependencies]
pos-core = { path = "../pos-core" }
pos-crypto = { path = "../pos-crypto" }
ciborium = { workspace = true }
blake3 = { workspace = true }
ulid = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true, optional = true }
rand = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

# Linux-only: recipient-key custody uses openat2/renameat2 semantics (libc, rustix);
# the trust policy registry reads conformance snapshots (pos-conformance).
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }
rustix = { workspace = true }
pos-conformance = { path = "../pos-conformance", optional = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
pos-core = { path = "../pos-core", features = ["test-support"] }
tempfile = "3"

[[bench]]
name = "memory_erasure"
harness = false

[lints]
workspace = true
