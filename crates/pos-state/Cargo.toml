[package]
name = "pos-state"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Read-only inspection of otherwise inaccessible State after test poisoning.
# Never enable in deployable builds.
test-support = []

[dependencies]
blake3 = { workspace = true }
pos-core = { path = "../pos-core" }
serde_json = { workspace = true }

[dev-dependencies]
pos-core = { path = "../pos-core", features = ["test-support"] }
proptest = { workspace = true }

[lints]
workspace = true
