[package]
name = "pos-conformance"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
ciborium = { workspace = true }
ed25519-dalek = { workspace = true }
pos-core = { path = "../pos-core" }
pos-crypto = { path = "../pos-crypto" }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
pos-crypto = { path = "../pos-crypto", features = ["test-support"] }
pos-reference = { path = "../pos-reference" }

# The Plugin fixture trust test (R8-F2a) rebuilds the release closures of the generated composites.
# This widens the ADR's dependency statement: no existing dependency builds a verified closure.
[target.'cfg(target_os = "linux")'.dev-dependencies]
pos-plugin-release = { path = "../pos-plugin-release" }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
  "std",
  "fs",
  "process",
] }

[target.'cfg(target_os = "linux")'.build-dependencies]
rustix = { version = "1.1.4", default-features = false, features = [
  "std",
  "fs",
] }

[lints]
workspace = true
