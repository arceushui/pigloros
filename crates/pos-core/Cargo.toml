[package]
name = "pos-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables explicitly named containment fixtures for downstream test targets.
# This feature is intentionally off in production dependency graphs.
test-support = []
# Mints `CounterfactualAdapterSealV1`, which builds ADR-064 counterfactual
# commit evidence. Only `pos-store` (the Memory and SQLite adapters) may enable
# it outside dev-dependencies; scripts/check_counterfactual_adapter_seal.py
# enforces that in CI.
counterfactual-adapter = []

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
ciborium = { workspace = true }
ulid = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
