[package]
name = "pos-core"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables explicitly named containment fixtures for downstream test targets.
# This feature is intentionally off in production dependency graphs.
test-support = []
# Mints `CounterfactualAdapterSealV1`, which builds ADR-064 counterfactual
# commit evidence. Only `pos-store` (the Memory and SQLite adapters) may enable
# it outside dev-dependencies; scripts/check_counterfactual_adapter_seal.py
# enforces that in CI.
counterfactual-adapter = []
# Exposes `FixtureEvaluationInstantV1` and `FixtureWallSourceV1`, a Plugin trust
# wall source that returns one fixture-supplied instant (ADR-061 revision 8). Only
# the Plugin-conformance adapter may enable it, in `[dependencies]`;
# scripts/check_fixture_instant_confinement.py enforces that in CI.
fixture-instant = []
# Mints `AuthorityTrustRootSealV1`, which builds the authenticated-principal
# results and registry snapshots the authority evaluator trusts (ADR-129 A5.9,
# #1374). Only the trusted composition roots (`piglor-gateway`, `pos-store`,
# `pos-experiment`, and `pos-runtime` through `local-admission-host`) may enable
# it outside dev-dependencies; scripts/check_authority_trust_root_seal.py
# enforces that in CI.
authority-trust-root = []

[dependencies]
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = "0.11"
ciborium = { workspace = true }
ulid = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
sha2 = { workspace = true }

[[test]]
name = "authority_public"
required-features = ["authority-trust-root"]

[[test]]
name = "community_authority_catalogue_public"
required-features = ["authority-trust-root"]

[[test]]
name = "fork_ancestry_public"
required-features = ["test-support"]

[[test]]
name = "knowledge_public"
required-features = ["authority-trust-root"]

[[test]]
name = "local_cut_world_closure_public"
required-features = ["test-support"]

[[test]]
name = "trusted_clock_public"
required-features = ["authority-trust-root"]

[[test]]
name = "world_key_evidence_public"
required-features = ["test-support"]

[lints]
workspace = true
