[package]
name = "pos-runtime"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables downstream fixture registration and verifier-seam tests only.
# Never enable in deployable builds; fixtures do not establish installed authority.
# Enforced by scripts/check_test_support_features.py in CI.
test-support = ["local-admission-host"]
# Exposes the process-wide local scheduled-admission host to the local
# experiment composition root. Keeps the host out of deployable Plugin,
# Driver, and provider graphs; it is not an in-process security boundary.
local-admission-host = []

[dependencies]
blake3 = { workspace = true }
pos-core = { path = "../pos-core" }
pos-store = { path = "../pos-store" }
pos-state = { path = "../pos-state" }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
ulid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pos-conformance = { path = "../pos-conformance" }

[dev-dependencies]
ciborium = { workspace = true }
pos-core = { path = "../pos-core", features = ["test-support"] }
pos-crypto = { path = "../pos-crypto" }
rusqlite = { workspace = true }
tempfile = { workspace = true }

# The counterfactual coordinator tests reuse the pos-time graph and frontier
# derivation. pos-time depends on this crate, so this is a dev-only cycle;
# pos-time links pos-conformance, which builds only on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
pos-time = { path = "../pos-time" }

[[test]]
name = "event_type_ownership"
required-features = ["test-support"]

[[test]]
name = "human_admission"
required-features = ["test-support"]

[[test]]
name = "output_admission_public"
required-features = ["test-support"]

[[test]]
name = "participant_knowledge"
required-features = ["test-support"]

[[test]]
name = "plugin_composition"
required-features = ["test-support"]

[[test]]
name = "protected_consent"
required-features = ["test-support"]

[[test]]
name = "recovery_evidence"
required-features = ["test-support"]

[[test]]
name = "scheduled_admission"
required-features = ["test-support"]

[[test]]
name = "subscription_consent"
required-features = ["test-support"]

[[test]]
name = "non_linux_profile"
required-features = ["test-support"]

[lints]
workspace = true
