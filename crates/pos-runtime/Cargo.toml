[package]
name = "pos-runtime"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables downstream fixture registration and verifier-seam tests only.
# Never enable in deployable builds; fixtures do not establish installed authority.
# Enforced by scripts/check_test_support_features.py in CI.
test-support = ["local-admission-host", "pos-core/test-support"]
# Exposes the process-wide local scheduled-admission host to the local
# experiment composition root. Keeps the host out of deployable Plugin,
# Driver, and provider graphs; it is not an in-process security boundary.
local-admission-host = []

[dependencies]
blake3 = { workspace = true }
pos-core = { path = "../pos-core" }
pos-crypto = { path = "../pos-crypto" }
pos-store = { path = "../pos-store" }
pos-state = { path = "../pos-state" }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }
ulid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
pos-conformance = { path = "../pos-conformance" }
# The execution-time trust gate yields `ContentValidationV1` and reads release closures
# through `ReleaseSourceV1`.
pos-plugin-release = { path = "../pos-plugin-release" }
# The install entry wraps the signed installer (ADR-061 revision 7 decision 9). The `test-support`
# dev-dependency entry below stays alongside this normal one.
pos-plugin-publisher = { path = "../pos-plugin-publisher" }

[dev-dependencies]
ciborium = { workspace = true }
# The rigged test store mints a foreign receipt with the adapter seal.
pos-core = { path = "../pos-core", features = [
  "test-support",
  "counterfactual-adapter",
] }
# Negotiation tests build execution projections without a release closure.
pos-crypto = { path = "../pos-crypto", features = ["test-support"] }
rusqlite = { workspace = true }
tempfile = { workspace = true }

# The counterfactual coordinator tests reuse the pos-time graph and frontier
# derivation. pos-time depends on this crate, so this is a dev-only cycle;
# pos-time links pos-conformance, which builds only on Linux.
[target.'cfg(target_os = "linux")'.dev-dependencies]
pos-time = { path = "../pos-time" }
# The gate vectors run on the shared signed-release test world (ADR-061 revision 7, #579).
pos-plugin-publisher = { path = "../pos-plugin-publisher", features = [
  "test-support",
] }

[[test]]
name = "community_gate_public"
required-features = ["test-support"]

