[package]
name = "pos-runtime"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables downstream fixture registration and deterministic verifier seam tests only.
test-support = []

[dependencies]
blake3 = { workspace = true }
pos-core = { path = "../pos-core" }
pos-conformance = { path = "../pos-conformance" }
pos-store = { path = "../pos-store" }
pos-state = { path = "../pos-state" }
serde_json = { workspace = true }
thiserror = { workspace = true }
indexmap = { workspace = true }

[dev-dependencies]
pos-core = { path = "../pos-core", features = ["test-support"] }

[[test]]
name = "output_admission_public"
required-features = ["test-support"]

[[test]]
name = "participant_knowledge"
required-features = ["test-support"]

[[test]]
name = "plugin_composition"
required-features = ["test-support"]

[[test]]
name = "protected_consent"
required-features = ["test-support"]

[[test]]
name = "recovery_evidence"
required-features = ["test-support"]

[lints]
workspace = true
