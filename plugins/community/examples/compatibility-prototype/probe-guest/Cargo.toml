# Steerable probe guest of the ADR-061 compatibility prototype (#652).
#
# Not a workspace member: it builds only for wasm32-unknown-unknown, through
# `build-fixtures.sh`, with the pinned toolchain below, exactly like
# `../rust-guest`. Its observation bytes select a host-visible fault; see
# `src/lib.rs`. Keep this manifest, `Cargo.lock` and `rust-toolchain.toml` in
# step with `../rust-guest` (dependencies, versions and release profile).
[package]
name = "pigloros-compatibility-probe"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The workspace's BLAKE3 release, for the host's V1 `output-digest`.
blake3 = { version = "=1.8.7", default-features = false }
# Runtime support only: the bindings come from the pinned wit-bindgen CLI.
wit-bindgen = { version = "=0.61.1", default-features = false, features = [
  "realloc",
] }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
