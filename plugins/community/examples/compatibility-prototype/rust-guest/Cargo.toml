# Rust guest of the ADR-061 revisions 4 and 5 compatibility prototype (#539).
#
# Not a workspace member: it builds only for wasm32-unknown-unknown, through
# `build-fixtures.sh`, with the pinned toolchain below.
[package]
name = "pigloros-compatibility-prototype"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Runtime support only: the bindings come from the pinned wit-bindgen CLI.
wit-bindgen = { version = "=0.61.1", default-features = false, features = [
  "realloc",
] }

[profile.release]
codegen-units = 1
debug = false
lto = true
opt-level = "s"
panic = "abort"
strip = true

[workspace]
