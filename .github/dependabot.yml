version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-dependency:
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
