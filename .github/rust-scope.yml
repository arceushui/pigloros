# This file is read from the pull request's trusted base revision by the scope jobs.
# The Rust gate is skipped only when every changed path is documentation-only.
# Keep this list conservative: an unknown path must run the full gate set.
rust:
  - '**'
  - '!**/*.md'
  - '!**/*.mdx'
  - '!**/*.adoc'
  - '!**/*.rst'
  - '!.agents/**'
  - '!docs/**'
# The native Windows owner lane runs on a pull request only when it changes a
# path the lane builds, lints, tests or executes, or a gate that consumes its
# evidence. Transitive path dependencies of pos-crypto (pos-core,
# pos-plugin-release, ...) are deliberately not listed: every push to main
# still runs the complete lane. A base revision without this key, or failed
# change detection, runs the lane.
owner_windows:
  - crates/pos-owner-bridge-windows/**
  - crates/pos-owner-bridge/**
  - crates/pos-owner-bridge-codec/**
  - apps/piglor-owner/**
  - crates/pos-crypto/**
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - .cargo/**
  - .config/**
  - clippy.toml
  - .clippy.toml
  - rustfmt.toml
  - .rustfmt.toml
  - covgate.toml
  - .gitattributes
  - fixtures/owner-bridge/**
  - .github/workflows/owner-bridge-windows.yml
  - .github/workflows/ci.yml
  - .github/rust-scope.yml
  - scripts/*owner*
  - scripts/*cargo_crap*
# The Linux owner U-tier (ADR-110 E20, Redmine #1476) runs on a pull request only
# when it changes a path the lane builds, runs or exports, or a gate that
# consumes its evidence. A base revision without this key, or failed change
# detection, runs the lane.
owner_uhid:
  - crates/pos-owner-ctap/**
  - crates/pos-owner-bridge/**
  - crates/pos-owner-bridge-codec/**
  - Cargo.toml
  - Cargo.lock
  - rust-toolchain.toml
  - .cargo/**
  - .config/**
  - clippy.toml
  - .clippy.toml
  - rustfmt.toml
  - .rustfmt.toml
  - covgate.toml
  - .gitattributes
  - .github/workflows/owner-ctap-uhid.yml
  - .github/workflows/ci.yml
  - .github/rust-scope.yml
  - scripts/*owner*
  - scripts/*cargo_crap*
