name: Temporary Unstack Wave 8
on:
  push:
    branches:
      - automation/unstack-wave8-20261002
permissions:
  contents: read
  pull-requests: write
jobs:
  unstack:
    runs-on: ubuntu-latest
    steps:
      - name: Remove stale native stack links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/stacks/233/unstack"
