name: dependency-lock-bootstrap

on:
  push:
    branches: [codex/ticket-365-systemd-filter]

permissions:
  contents: read

jobs:
  resolve-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust for hosted-only dependency resolution
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Resolve new member while retaining existing dependency locks
        run: cargo +1.97.1 metadata --format-version 1 > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-${{ github.sha }}
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
