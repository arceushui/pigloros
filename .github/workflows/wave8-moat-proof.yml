name: Wave 8 moat proof

on:
  push:
    branches: [wave8-moat-proof]
  pull_request:
  workflow_dispatch:

concurrency:
  group: wave8-moat-proof-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: wave8-moat-proof
      - name: Format
        run: cargo fmt --all -- --check
      - name: Focused Wave 8 tests
        run: >
          cargo test
          -p pos-runtime
          -p pos-conformance
          -p pos-reference
          -p pos-plugin-world
          -p pos-experiment
          --locked -- --include-ignored
      - name: Focused Wave 8 clippy
        run: >
          cargo clippy
          -p pos-runtime
          -p pos-conformance
          -p pos-reference
          -p pos-plugin-world
          -p pos-experiment
          --all-targets --locked --
          -D warnings -W clippy::pedantic
