# Semgrep AST ban on #[ignore] tests (complements Trunk rust-test-policy).
# cargo-deny cannot ban source attributes — see cargo-deny.yml for deps.

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: semgrep --config .semgrep.yml
        run: semgrep scan --config .semgrep.yml --error --quiet
