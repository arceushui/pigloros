# PiglorOS CI — mirrors README Development gates (Redmine #100).
#
# Decisions locked for the coverage quality bar:
# - Platform: GitHub Actions (remote is github.com/arceushui/pigloros)
# - Triggers: every PR + pushes to main
# - Jobs: fmt, test, clippy (pedantic), coverage (99% lines + regions), audit, deny — all required
# - coverage(off) test-only + no ```ignore doctests: Trunk `rust-test-policy`
# - Tests: `cargo test --all-features -- --include-ignored` so #[ignore] cannot silently skip and feature-gated code is exercised
# - Dependencies: cargo-deny.yml (crates/licenses/advisories/sources)
# - Coverage: RUSTC_BOOTSTRAP=1 so cfg(coverage_nightly) can enable feature(coverage_attribute).
#   Unnecessary code is deleted/simplified rather than left as dead branches.
# - Runners: ubuntu-latest only (rusqlite bundled; no macOS matrix yet)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface future warnings as errors in CI builds (clippy still has its own -D warnings).
  RUSTFLAGS: -D warnings

jobs:
  pinned-dependencies:
    name: pinned-dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.11

      - name: Install pinned dependency checker requirements
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt

      - name: Check immutable Action and Docker references
        run: bash scripts/check-pinned-dependencies.sh

      - name: Test pinned dependency checker
        run: bash scripts/test-check-pinned-dependencies.sh

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: test

      - name: cargo check --workspace --no-default-features --locked
        run: cargo check --workspace --all-targets --no-default-features --locked

      - name: cargo test --workspace --all-features --locked -- --include-ignored
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked -- --include-ignored 2>&1 | tee /tmp/cargo-test.log
          bash scripts/assert-no-ignored-in-test-summary.sh /tmp/cargo-test.log

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: clippy

      - name: cargo clippy (all features, pedantic, deny warnings)
        run: >
          cargo clippy --workspace --all-features --all-targets --locked --
          -D warnings -W clippy::pedantic

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: coverage

      - name: cargo llvm-cov (all features) at-or-above-99pct lines and regions
        run: >
          cargo llvm-cov --workspace --all-features --locked --summary-only
          --fail-under-lines 99
          --fail-under-regions 99
          -- --include-ignored

  audit:
    name: cargo-audit (security advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo-deny (licenses / bans / sources / deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install cargo-deny
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny --locked check

  geiger:
    name: cargo-geiger (unsafe code audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-geiger
      - name: cargo geiger (all features)
        run: cargo geiger --all-features --locked --workspace 2>&1 | tee /tmp/geiger.log
      - name: assert no unsafe in own crates
        run: '! grep -E "^(crates|apps|plugins)/" /tmp/geiger.log | grep -v "0 unsafe"'

  asan:
    name: asan (address sanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: asan
      - name: cargo test with ASan
        env:
          RUSTC_BOOTSTRAP: "1"
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
        run: >
          RUSTFLAGS="-Z sanitizer=address"
          cargo +nightly test --all-features --locked -Z build-std --target x86_64-unknown-linux-gnu --workspace --tests

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: pigloros-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run --rm -d -p 8080:8080 --name pigloros-smoke pigloros-gateway:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep '"ok":true'
          curl -sf http://localhost:8080/v1/ledger | grep '"domain":"piglor.com"'
          docker stop pigloros-smoke

  modules:
    name: modules-structure (reports only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-modules
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-modules

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: modules

      - name: Module structure reports
        if: always()
        run: |
          mkdir -p artifacts/modules
          for pkg in pos-core pos-crypto pos-store pos-state pos-query pos-time pos-runtime \
            pos-plugin-agent pos-plugin-bridges pos-plugin-eval pos-plugin-geo \
            pos-plugin-ledger pos-plugin-persona pos-plugin-rule-agent \
            pos-plugin-society pos-plugin-synthetic-obs pos-plugin-world \
            piglor-gateway piglor-ledger pos-experiment pos-cli pos-mvp; do
            cargo modules structure -p "$pkg" --lib > "artifacts/modules/${pkg}.txt" 2>/dev/null || true
          done

      - name: Upload module reports
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: module-structures
          path: artifacts/modules/

  depgraph:
    name: depgraph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-depgraph
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: cargo-depgraph

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate dependency graph
        run: |
          mkdir -p artifacts
          cargo depgraph --locked --all-deps --dedup-transitive-deps > artifacts/depgraph.svg

      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: depgraph
          path: artifacts/depgraph.svg

  world-client-wasm:
    name: world-client-wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: wasm-pack@0.15.0

      - name: Check world-client WASM contract
        run: bash scripts/test-check-world-client-wasm.sh

      - name: Check world-client WASM packaging
        run: bash scripts/check-world-client-wasm.sh package

  world-client-browser-parity:
    name: world-client-browser-parity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.97.1

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@18b1216eba7f8039b0f8d131d5473787f0edce68 # v2
        with:
          tool: wasm-pack@0.15.0

      - name: Install Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        with:
          chrome-version: 151.0.7922.47
          install-chromedriver: true

      - name: Check world-client browser parity
        run: bash scripts/check-world-client-wasm.sh browser
