# PiglorOS CI — mirrors README Development gates (Redmine #100).
#
# Decisions locked for "perfect" bar:
# - Platform: GitHub Actions (remote is github.com/arceushui/pigloros)
# - Triggers: every PR + pushes to main
# - Jobs: fmt, test, clippy (pedantic), coverage (honest floor: 99% lines + regions) — all required
# - Coverage: RUSTC_BOOTSTRAP=1 so cfg(coverage_nightly) can enable
#   feature(coverage_attribute); #[coverage(off)] is ONLY ever applied to #[test] functions
#   or code inside #[cfg(test)] modules — production code is never exempted from coverage.
#   A handful of genuinely unhittable error arms (infallible-in-practice branches such as
#   float-precision fallbacks or serialization edge cases) remain uninstrumented and are
#   reflected honestly in the fail-under floor below instead of being suppressed.
# - Runners: ubuntu-latest only (rusqlite bundled; no macOS matrix yet)

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface future warnings as errors in CI builds (clippy still has its own -D warnings).
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - name: cargo clippy (pedantic, deny warnings)
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings -W clippy::pedantic

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Required: cargo-llvm-cov sets cfg(coverage_nightly); we need the unstable
      # coverage_attribute feature on stable for #[coverage(off)] on tests.
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      # Honest floor: production code is fully instrumented (coverage(off) is
      # test-only), so this is slightly below measured coverage (~99.9% lines /
      # ~99.7% regions) to leave headroom for the handful of infallible-in-practice
      # error arms (e.g. float-precision fallbacks) that are impractical to hit
      # in a unit test. See README "Development" section for the measured numbers.
      - name: cargo llvm-cov (honest floor: 99% lines + regions)
        run: >
          cargo llvm-cov --workspace --locked --summary-only
          --fail-under-lines 99
          --fail-under-regions 99
