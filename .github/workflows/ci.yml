name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  codec-focused:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Verify source and run package tests
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:crates/pos-crypto/src/subject_nonce_ledger.rs
          cargo test -p pos-crypto -p pos-owner-bridge --all-features --locked -- --include-ignored
      - name: Clippy both packages all targets and features
        run: cargo clippy -p pos-crypto -p pos-owner-bridge --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
