# PiglorOS CI — mirrors README Development gates (Redmine #100).
#
# Decisions locked for "perfect" bar:
# - Platform: GitHub Actions (remote is github.com/arceushui/pigloros)
# - Triggers: every PR + pushes to main
# - Jobs: fmt, test, clippy (pedantic), coverage (100% lines + regions) — all required
# - Test policy (no #[ignore]; coverage(off) test-only): Trunk `rust-test-policy` + Semgrep
#   (`.semgrep.yml`). cargo-deny cannot ban source attributes — see cargo-deny.yml for deps.
# - Tests: `cargo test -- --include-ignored` so ignored tests cannot silently skip.
# - Coverage: RUSTC_BOOTSTRAP=1 so cfg(coverage_nightly) can enable feature(coverage_attribute).
#   Unnecessary code is deleted/simplified rather than left as dead branches.
# - Runners: ubuntu-latest only (rusqlite bundled; no macOS matrix yet)

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface future warnings as errors in CI builds (clippy still has its own -D warnings).
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: cargo test --workspace --locked -- --include-ignored
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --include-ignored 2>&1 | tee /tmp/cargo-test.log
          if grep -E '[1-9][0-9]* ignored' /tmp/cargo-test.log; then
            echo "ERROR: cargo test still reported ignored/skipped tests" >&2
            exit 1
          fi

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - name: cargo clippy (pedantic, deny warnings)
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings -W clippy::pedantic

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Required: cargo-llvm-cov sets cfg(coverage_nightly); we need the unstable
      # coverage_attribute feature on stable for #[coverage(off)] on tests.
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      # 100% coverage requirement: production code is fully instrumented (coverage(off) is
      # test-only), and unnecessary code is deleted/simplified rather than left as dead branches.
      - name: cargo llvm-cov 100pct lines and regions
        run: >
          cargo llvm-cov --workspace --locked --summary-only
          --fail-under-lines 100
          --fail-under-regions 100
          -- --include-ignored
