name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listener-deadline-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
      - name: Record checkout
        run: git rev-parse HEAD
      - name: Exercise listener deadline boundaries
        run: cargo test -p pos-owner-bridge --lib --all-features --locked listener::tests:: -- --include-ignored --nocapture
