# ── Security & compliance ────────────────────────────────────────────────────

  audit:
    name: dependency-policy (audit / deny / shear)
    needs: *core-stage-needs
    if: *core-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Check the Wasmtime pin and resolved feature set
        run: |
          set -euo pipefail
          cargo metadata --locked --all-features --format-version 1 \
            | python3 scripts/check_wasmtime_feature_pin.py
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-shear
      - name: cargo shear (strict)
        run: cargo shear --deny-warnings

  # Always runs, including for documentation-only pull requests: the main
  # ruleset's code_scanning rule needs an uploaded analysis for the head commit,
  # and a skipped job uploads none, which leaves the PR unmergeable. Rust PRs
  # wait for the core pass rule; documentation-only PRs run it even if
  # preflight fails.
  codeql:
    name: CodeQL (Rust)
    needs: *core-stage-needs
    if: >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      ((needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped'))) ||
      needs.ci_change_scope.outputs.rust == 'false') }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  # Reusable-workflow checks are reported as "caller / callee". Preserve the
  # stable status context required by the main-branch ruleset.
  codeql-required:
    name: CodeQL (Rust)
    if: ${{ always() }}
    needs:
      - codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the required CodeQL status
        env:
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: test "${CODEQL_RESULT}" = success

# ── Platform verification ────────────────────────────────────────────────────

  # ASan compilation took most of each ASan shard's time, so it runs once as a
  # standard-stage job. Crates compile in parallel while scripts/asan/
  # serial-link.sh admits one link at a time; the build fails unless the
  # wrapper's lock file exists afterwards. The archive holds every
  # workspace test binary; the shards below still run last and only execute
  # tests from it.
  asan-build:
    name: asan build (nextest archive)
    needs: *core-stage-needs
    if: *core-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *reclaim-sdk-headroom
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - name: Install cargo-nextest for the ASan archive
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: asan-nightly-2026-07-01
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo nextest archive with ASan
        env:
          RUSTC_BOOTSTRAP: "1"
          CARGO_BUILD_JOBS: "4"
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/scripts/asan/serial-link.sh
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        run: |
          set -euo pipefail
          read -ra packages <<<"${CARGO_PACKAGES}"
          RUSTFLAGS="-Z sanitizer=address" \
            cargo +nightly-2026-07-01 nextest archive "${packages[@]}" --all-features \
            --locked -Z build-std --target x86_64-unknown-linux-gnu --tests \
            --archive-file "${RUNNER_TEMP}/asan-tests.tar.zst"
          test -f "${RUNNER_TEMP}/asan-link.lock"
      - name: Upload ASan test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-nextest-archive
          path: ${{ runner.temp }}/asan-tests.tar.zst
          retention-days: 3
          if-no-files-found: error
          overwrite: true
          compression-level: 0

  # Shards do not compile: they run tests from the asan-build archive, so
  # rust-src and rust-cache are intentionally absent.
  asan:
    name: asan shard (${{ matrix.shard }})
    needs: &standard-stage-needs
      - ci_change_scope
      - trunk-pr
      - pinned-dependencies
      - source-policies
      - owner-bridge-policies
      - conformance-fixtures
      - conformance-non-linux
      - plugin-component-fixtures
      - third-party-notices
      - fmt
      - feature-matrix
      - test
      - test-shards
      - clippy
      - coverage
      - codeql
      - rustdoc
      - reference-evaluator-release
      - materialize-conformance-bundles
      - audit
      - ledger-windows
      - docker-build
      - world-client-wasm
      - world-client-browser-parity
      - asan-build
      - static-launcher
    # The shards run beside diff mutation testing; ci-gate requires both.
    if: >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped')) && needs.codeql.result == 'success' &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.rustdoc.result == 'success'
      && needs.reference-evaluator-release.result == 'success' &&
      needs.materialize-conformance-bundles.result == 'success' &&
      needs.audit.result == 'success' && needs.ledger-windows.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.world-client-wasm.result == 'success' &&
      needs.world-client-browser-parity.result == 'success' &&
      needs.asan-build.result == 'success' && needs.static-launcher.result == 'success')
      || (needs.ci_change_scope.outputs.rust == 'false' &&
      needs.rustdoc.result == 'skipped' &&
      needs.reference-evaluator-release.result == 'skipped' &&
      needs.materialize-conformance-bundles.result == 'skipped' &&
      needs.audit.result == 'skipped' && needs.ledger-windows.result == 'skipped' &&
      needs.docker-build.result == 'skipped' &&
      needs.world-client-wasm.result == 'skipped' &&
      needs.world-client-browser-parity.result == 'skipped' &&
      needs.asan-build.result == 'skipped' && needs.static-launcher.result == 'skipped'))
      && needs.asan-build.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' ||
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard:
          - remainder-1
          - remainder-2
          - bundle-coverage
          - bundle-public-1
          - bundle-public-2
          - moat-proof
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - *reclaim-sdk-headroom
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly-2026-07-01
      - name: Install cargo-nextest for partitioned ASan tests
        uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Verify ASan symbolizer
        run: |
          symbolizer="/usr/bin/llvm-symbolizer-18"
          test -x "${symbolizer}"
          symbolizer_version="$("${symbolizer}" --version)"
          grep -Fqx "Ubuntu LLVM version 18.1.3" <<<"${symbolizer_version}"
      # The ~10 GB archive download can fail at the artifact store after the
      # action's own retries (runs 44311811537 and 44400730021). One retry on
      # a cleared directory follows; if it also fails, the shard fails.
      - name: Download ASan test archive
        id: download-asan-archive
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asan-nextest-archive
          path: ${{ runner.temp }}/asan-archive
      - name: Clear the failed ASan archive download
        if: steps.download-asan-archive.outcome == 'failure'
        run: rm -rf -- "${RUNNER_TEMP}/asan-archive"
      - name: Retry ASan test archive download
        if: steps.download-asan-archive.outcome == 'failure'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: asan-nextest-archive
          path: ${{ runner.temp }}/asan-archive
      - name: Prove unrelated leaks still fail LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/asan-intentional-leak"
          log="${RUNNER_TEMP}/asan-intentional-leak.log"
          trap 'rm -f "${binary}" "${log}"' EXIT
          rustc +nightly-2026-07-01 -Z sanitizer=address -C debuginfo=1 \
            --target x86_64-unknown-linux-gnu \
            scripts/asan/intentional-leak.rs -o "${binary}"
          set +e
          ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
            "${binary}" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          test "${status}" -ne 0
          grep -Fqx "SUMMARY: AddressSanitizer: 1234 byte(s) leaked in 1 allocation(s)." "${log}"
          ! grep -F "Suppressions used:" "${log}"
          ! grep -F "bevy_reflect::utility::GenericTypeCell" "${log}"
      # Extracting into the workspace puts target/ at the path the archive was
      # built at, so compile-time env!("CARGO_BIN_EXE_*") paths resolve.
      - name: cargo test with ASan
        env:
          ASAN_SHARD: ${{ matrix.shard }}
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        # The archive holds exactly the packages asan-build selected. A scoped
        # selection may leave a partition without tests, and without
        # pos-conformance the four conformance partitions have nothing to run.
        run: |
          set -euo pipefail
          test -x "/usr/bin/llvm-symbolizer-18"
          nextest_args=(
            +nightly-2026-07-01 nextest run
            --archive-file "${RUNNER_TEMP}/asan-archive/asan-tests.tar.zst"
            --extract-to "${GITHUB_WORKSPACE}"
            --extract-overwrite
            --workspace-remap "${GITHUB_WORKSPACE}"
            --user-config-file none
            --ignore-default-filter
            --success-output final
            --no-output-indent
            --test-threads 2
          )
          conformance=true
          if [[ "${CARGO_PACKAGES}" != --workspace ]]; then
            nextest_args+=(--no-tests=pass)
            if [[ " ${CARGO_PACKAGES} " != *" -p pos-conformance "* ]]; then
              conformance=false
            fi
          fi
          run_asan_partition() {
            ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
              cargo "${nextest_args[@]}" "$@"
          }
          run_conformance_partition() {
            if [[ "${conformance}" == true ]]; then
              run_asan_partition "$@"
            else
              printf 'pos-conformance is not in the affected packages; skipped: %s\n' "$*"
            fi
          }
          case "${ASAN_SHARD}" in
            bundle-coverage)
              run_conformance_partition \
                -E 'binary_id(pos-conformance::bundle_contract_coverage_public)'
              ;;
            bundle-public-1)
              run_conformance_partition \
                -E 'binary_id(pos-conformance::bundle_contract_public)' \
                --partition slice:1/2 --run-ignored all
              ;;
            bundle-public-2)
              run_conformance_partition \
                -E 'binary_id(pos-conformance::bundle_contract_public)' \
                --partition slice:2/2 --run-ignored all
              ;;
            moat-proof)
              run_conformance_partition \
                -E 'binary_id(pos-conformance::moat_proof_public)'
              ;;
            remainder-1)
              run_asan_partition -E 'not package(pos-conformance)' \
                --partition slice:1/2
              run_conformance_partition \
                -E 'package(pos-conformance) & not (binary_id(pos-conformance::bundle_contract_coverage_public) | binary_id(pos-conformance::bundle_contract_public) | binary_id(pos-conformance::moat_proof_public))'
              ;;
            remainder-2)
              run_asan_partition -E 'not package(pos-conformance)' \
                --partition slice:2/2
              ;;
            *)
              printf 'unknown ASan shard: %s\n' "${ASAN_SHARD}" >&2
              exit 2
              ;;
          esac 2>&1 | tee "${RUNNER_TEMP}/asan.log"
          python scripts/check_lsan_suppression_report.py "${RUNNER_TEMP}/asan.log"

  asan-gate:
    name: asan (address sanitizer)
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - asan-build
      - asan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every ASan shard
        env:
          SCOPE_JOB_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE_RESULT: ${{ needs.ci_change_scope.outputs.rust }}
          ASAN_BUILD_RESULT: ${{ needs.asan-build.result }}
          ASAN_SHARDS_RESULT: ${{ needs.asan.result }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_JOB_RESULT}" == "success" \
            && "${RUST_SCOPE_RESULT}" == "false" \
            && "${ASAN_BUILD_RESULT}" == "skipped" \
            && "${ASAN_SHARDS_RESULT}" == "skipped" ]]; then
            exit 0
          fi
          test "${ASAN_BUILD_RESULT}" = success
          test "${ASAN_SHARDS_RESULT}" = success

  docker-build:
    name: docker-build
    needs: *core-stage-needs
    if: >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped')) &&
      needs.third-party-notices.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' ||
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image ships the third-party notice bundle (#798), exactly as
      # deploy.yml builds it; this job never pushes. The bundle lands in the
      # build context, where the Dockerfile COPYs it.
      - name: Download the third-party notice bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: third-party-notices

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: pigloros-gateway:ci
          cache-from: type=gha
          # PR runs restore only; main writes the shared layer cache so pull
          # requests cannot evict it from the repository cache budget.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
      - name: Check the image carries its third-party notices
        run: bash scripts/check-gateway-image-notices.sh pigloros-gateway:ci
      - name: Smoke test container
        run: |
          docker run --rm -d -p 8080:8080 --name pigloros-smoke pigloros-gateway:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep '"ok":true'
          ledger_json="$(curl -sf http://localhost:8080/v1/ledger)"
          printf '%s\n' "$ledger_json" | grep '"domain":"piglor.com"'
          printf '%s\n' "$ledger_json" | grep '"ledger":\[\]'
          docker stop pigloros-smoke

  world-client-wasm:
    name: world-client-wasm
    needs: *core-stage-needs
    if: *core-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-pack@0.15.0
      - name: Check world-client WASM contract
        run: bash scripts/test-check-world-client-wasm.sh
      - name: Check world-client WASM packaging
        run: bash scripts/check-world-client-wasm.sh package

  world-client-browser-parity:
    name: world-client-browser-parity
    needs:
      - ci_change_scope
      - world-client-wasm
    if: >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.world-client-wasm.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: wasm-pack@0.15.0
      - id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 151.0.7922.47
          install-chromedriver: true
      - name: Configure Chrome binary for wasm-bindgen
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          WEBDRIVER_CONFIG: ${{ runner.temp }}/world-client-webdriver.json
        run: >
          jq -n --arg binary "$CHROME_PATH"
          '{"goog:chromeOptions": {"binary": $binary}}' > "$WEBDRIVER_CONFIG"
      - name: Check world-client browser parity
        env:
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/world-client-webdriver.json
        run: bash scripts/check-world-client-wasm.sh browser

  # Reports the standard verdict to ci-gate. Mutation, the ASan shards and the
  # main-only reports start from the standard pass rule instead.
  standard-gate:
    name: standard-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - core-gate
      - rustdoc
      - reference-evaluator-release
      - materialize-conformance-bundles
      - audit
      - codeql
      - ledger-windows
      - docker-build
      - world-client-wasm
      - world-client-browser-parity
      - asan-build
      - static-launcher
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require normal blocking checks
        env:
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          CORE_RESULT: ${{ needs.core-gate.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          REFERENCE_RESULT: ${{ needs.reference-evaluator-release.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize-conformance-bundles.result }}
          DEPENDENCY_RESULT: ${{ needs.audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          LEDGER_WINDOWS_RESULT: ${{ needs.ledger-windows.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          WASM_RESULT: ${{ needs.world-client-wasm.result }}
          BROWSER_RESULT: ${{ needs.world-client-browser-parity.result }}
          ASAN_BUILD_RESULT: ${{ needs.asan-build.result }}
          STATIC_LAUNCHER_RESULT: ${{ needs.static-launcher.result }}
        run: |
          set -euo pipefail
          test "${CORE_RESULT}" = success
          test "${CODEQL_RESULT}" = success
          expected=success
          if [[ "${RUST_SCOPE}" = false ]]; then
            expected=skipped
          fi
          for result in \
            "${RUSTDOC_RESULT}" "${REFERENCE_RESULT}" \
            "${MATERIALIZE_RESULT}" "${DEPENDENCY_RESULT}" \
            "${LEDGER_WINDOWS_RESULT}" "${DOCKER_RESULT}" \
            "${WASM_RESULT}" "${BROWSER_RESULT}" "${ASAN_BUILD_RESULT}" \
            "${STATIC_LAUNCHER_RESULT}"; do
            test "${result}" = "${expected}"
          done

  mutation-checks:
    name: diff mutation testing
    needs: *standard-stage-needs
    if: >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped')) && needs.codeql.result == 'success' &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.rustdoc.result == 'success'
      && needs.reference-evaluator-release.result == 'success' &&
      needs.materialize-conformance-bundles.result == 'success' &&
      needs.audit.result == 'success' && needs.ledger-windows.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.world-client-wasm.result == 'success' &&
      needs.world-client-browser-parity.result == 'success' &&
      needs.asan-build.result == 'success' && needs.static-launcher.result == 'success')
      || (needs.ci_change_scope.outputs.rust == 'false' &&
      needs.rustdoc.result == 'skipped' &&
      needs.reference-evaluator-release.result == 'skipped' &&
      needs.materialize-conformance-bundles.result == 'skipped' &&
      needs.audit.result == 'skipped' && needs.ledger-windows.result == 'skipped' &&
      needs.docker-build.result == 'skipped' &&
      needs.world-client-wasm.result == 'skipped' &&
      needs.world-client-browser-parity.result == 'skipped' &&
      needs.asan-build.result == 'skipped' && needs.static-launcher.result == 'skipped'))
      && github.event_name == 'pull_request' &&
      needs.ci_change_scope.outputs.rust == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mutation.yml

  # See codeql-required: retain the pre-existing ruleset context while the
  # implementation runs as a staged reusable workflow.
  mutation-required:
    name: diff mutation testing
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - mutation-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report the required mutation status
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          MUTATION_RESULT: ${{ needs.mutation-checks.result }}
        run: |
          expected=skipped
          if [[ "${EVENT_NAME}" = pull_request && "${RUST_SCOPE}" = true ]]; then
            expected=success
          fi
          test "${MUTATION_RESULT}" = "${expected}"

# ── Informational reports (non-blocking) ────────────────────────────────────

  pinned-dependencies:
    name: pinned-dependencies
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
      - name: Install pinned dependency checker
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt
      - name: Check immutable Action and Docker references
        run: bash scripts/check-pinned-dependencies.sh
      - name: Test pinned dependency checker
        run: bash scripts/test-check-pinned-dependencies.sh
      - name: Test CI workflow policy
        run: python scripts/test_ci_workflow_policy.py
      - name: Test the affected-package resolver
        run: python scripts/test_affected_packages.py
      - name: Test mutation workflow policy
        run: python scripts/test_mutation_workflow_policy.py
      - name: Test deploy workflow policy
        run: python scripts/test_deploy_workflow_policy.py
      - name: Test ignored-test summary checker
        run: python scripts/test_assert_no_ignored_in_test_summary.py
      - name: Test agent command guard
        run: python scripts/test_agent_command_guard.py
      - name: Check ASan CI policy
        run: bash scripts/check-asan-ci-policy.sh
      - name: Test ASan CI policy checker
        run: |
          python scripts/test_check_asan_ci_policy.py
          python scripts/test_check_lsan_suppression_report.py
      - name: Check MemoryStore benchmark CI policy
        run: python scripts/check_memory_store_benchmark_ci_policy.py
      - name: Test MemoryStore benchmark CI policy checker
        run: python scripts/test_check_memory_store_benchmark_ci_policy.py
      - name: Check delegated isolated-test policy
        run: |
          python scripts/check_isolated_test_runner_policy.py
          python scripts/test_check_isolated_test_runner_policy.py
      - name: Check cargo-crap CI policy
        run: python scripts/check_cargo_crap_ci_policy.py
      - name: Test cargo-crap policy checkers
        run: |
          python scripts/test_check_cargo_crap_ci_policy.py
          python scripts/test_check_cargo_crap_report.py
      - name: Check test-support feature policy
        run: |
          python scripts/check_test_support_features.py
          python scripts/test_check_test_support_features.py
      - name: Test rust-test-policy test-code classification
        run: python scripts/test_rust_test_policy.py
      - name: Test the Air-Gapped test namespace helpers
        run: python scripts/test_air_gapped_seccomp_exec.py
      - name: Check the community Plugin handoff READMEs
        run: |
          python scripts/check_handoff_readme.py
          python scripts/test_check_handoff_readme.py
      - name: Check PMF1 golden vectors match their generator
        run: python scripts/generate_pmf1_golden_vectors.py --check
      - name: Check independent owner-bridge codec vectors
        run: |
          python scripts/owner_bridge_vectors.py --check
          python scripts/test_owner_bridge_vectors.py
      - name: Check independent owner-bridge WebAuthn fixture
        run: python scripts/owner_bridge_webauthn_fixtures.py --check
      - name: Test Wasmtime pin checker
        run: python scripts/test_check_wasmtime_feature_pin.py
      - name: Check and test the third-party notice generator
        run: |
          python scripts/third_party_notices.py check
          python scripts/test_third_party_notices.py

  # Source-confinement policy checks, split from pinned-dependencies so each
  # preflight policy job finishes well inside its timeout.
  source-policies:
    name: source-policies
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
      - name: Install pinned dependency checker
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt
      - name: Check counterfactual adapter seal policy
        run: |
          python scripts/check_counterfactual_adapter_seal.py
          python scripts/test_check_counterfactual_adapter_seal.py
      - name: Check authority trust-root seal policy
        run: |
          python scripts/check_authority_trust_root_seal.py
          python scripts/test_check_authority_trust_root_seal.py
      - name: Check trusted-clock port implementation policy
        run: |
          python scripts/check_trusted_clock_port_impls.py
          python scripts/test_check_trusted_clock_port_impls.py
      - name: Check Plugin trust registry confinement policy
        run: |
          python scripts/check_plugin_trust_registry_impls.py
          python scripts/test_check_plugin_trust_registry_impls.py
      - name: Check composition fallback registry confinement policy
        run: |
          python scripts/check_composition_fallback_registry_impls.py
          python scripts/test_check_composition_fallback_registry_impls.py
      - name: Check fixture evaluation instant and admission host confinement policy
        run: |
          python scripts/check_fixture_instant_confinement.py
          python scripts/test_check_fixture_instant_confinement.py

  # Owner-bridge source policy checks, split from pinned-dependencies so each
  # preflight policy job finishes well inside its timeout.
  owner-bridge-policies:
    name: owner-bridge-policies
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.12.11
      - name: Install pinned dependency checker
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt
      - name: Check owner-bridge Windows unsafe policy
        run: |
          python scripts/check_owner_bridge_unsafe_policy.py
          python scripts/test_check_owner_bridge_unsafe_policy.py
      - name: Check owner-bridge encryptor-lock dependency pin
        run: |
          python scripts/check_owner_bridge_lock.py
          python scripts/test_check_owner_bridge_lock.py
      - name: Check subject-encryption activation boundary
        run: |
          python scripts/check_subject_encryption_activation.py
          python scripts/test_check_subject_encryption_activation.py
      - name: Test Windows shim coverage exclusions
        run: python scripts/test_owner_bridge_windows_cov_ignore.py

  # Main-only reports keep running only after every normal check passes the
  # standard pass rule, and after cargo-crap, which that rule does not cover.
  modules-structure:
    name: modules-structure (reports only)
    needs: &main-report-needs
      - ci_change_scope
      - trunk-pr
      - pinned-dependencies
      - source-policies
      - owner-bridge-policies
      - conformance-fixtures
      - conformance-non-linux
      - plugin-component-fixtures
      - third-party-notices
      - fmt
      - feature-matrix
      - test
      - test-shards
      - clippy
      - coverage
      - codeql
      - rustdoc
      - reference-evaluator-release
      - materialize-conformance-bundles
      - audit
      - ledger-windows
      - docker-build
      - world-client-wasm
      - world-client-browser-parity
      - asan-build
      - static-launcher
      - cargo-crap
    if: &main-report-if >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
      needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped')) && needs.codeql.result == 'success' &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.rustdoc.result == 'success'
      && needs.reference-evaluator-release.result == 'success' &&
      needs.materialize-conformance-bundles.result == 'success' &&
      needs.audit.result == 'success' && needs.ledger-windows.result == 'success' &&
      needs.docker-build.result == 'success' &&
      needs.world-client-wasm.result == 'success' &&
      needs.world-client-browser-parity.result == 'success' &&
      needs.asan-build.result == 'success' && needs.static-launcher.result == 'success')
      || (needs.ci_change_scope.outputs.rust == 'false' &&
      needs.rustdoc.result == 'skipped' &&
      needs.reference-evaluator-release.result == 'skipped' &&
      needs.materialize-conformance-bundles.result == 'skipped' &&
      needs.audit.result == 'skipped' && needs.ledger-windows.result == 'skipped' &&
      needs.docker-build.result == 'skipped' &&
      needs.world-client-wasm.result == 'skipped' &&
      needs.world-client-browser-parity.result == 'skipped' &&
      needs.asan-build.result == 'skipped' && needs.static-launcher.result == 'skipped'))
      && needs.cargo-crap.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-modules
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-modules
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: modules
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Module structure reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/modules
          for pkg in pos-core pos-crypto pos-store pos-state pos-query pos-time pos-runtime \
            pos-plugin-agent pos-plugin-bridges pos-plugin-eval pos-plugin-geo \
            pos-plugin-ledger pos-plugin-persona pos-plugin-rule-agent \
            pos-plugin-society pos-plugin-synthetic-obs pos-plugin-world \
            piglor-gateway piglor-ledger pos-experiment pos-cli; do
            cargo modules structure -p "$pkg" --lib > "artifacts/modules/${pkg}.txt" 2>/dev/null || true
          done
      - name: Upload module reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: module-structures
          path: artifacts/modules/

  depgraph:
    name: depgraph
    needs: *main-report-needs
    if: *main-report-if
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-depgraph
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-depgraph
      - name: Install graphviz
        run: |
          bash scripts/prepare-ubuntu-package-mirror.sh graphviz
      - name: Generate dependency graph
        run: |
          mkdir -p artifacts
          cargo depgraph --locked --all-deps --dedup-transitive-deps > artifacts/depgraph.svg
      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: depgraph
          path: artifacts/depgraph.svg

  # One stable fan-in covers every staged blocking check. Individual jobs and
  # shards are implementation details, not independent merge approvals.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - preflight-gate
      - core-gate
      - standard-gate
      - cargo-crap
      - mutation-checks
      - asan-gate
      - owner-bridge-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every blocking CI job to pass
        env:
          SCOPE_JOB_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE_RESULT: ${{ needs.ci_change_scope.outputs.rust }}
          EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_RESULT: ${{ needs.preflight-gate.result }}
          CORE_RESULT: ${{ needs.core-gate.result }}
          STANDARD_RESULT: ${{ needs.standard-gate.result }}
          CARGO_CRAP_RESULT: ${{ needs.cargo-crap.result }}
          MUTATION_RESULT: ${{ needs.mutation-checks.result }}
          ASAN_RESULT: ${{ needs.asan-gate.result }}
          OWNER_WINDOWS_SCOPE: ${{ needs.ci_change_scope.outputs.owner_windows }}
          OWNER_WINDOWS_RESULT: ${{ needs.owner-bridge-windows.result }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "${SCOPE_JOB_RESULT}" != "success" ]]; then
            echo "SCOPE_JOB_RESULT=${SCOPE_JOB_RESULT}" >&2
            failed=1
          fi

          for result_name in PREFLIGHT_RESULT CORE_RESULT STANDARD_RESULT ASAN_RESULT; do
            result="${!result_name}"
            if [[ "${result}" != success ]]; then
              echo "${result_name}=${result}" >&2
              failed=1
            fi
          done

          # cargo-crap waits for the native Windows lane, so it is required
          # here rather than in the standard pass rule that mutation and ASan
          # follow.
          expected_cargo_crap=success
          if [[ "${RUST_SCOPE_RESULT}" = false ]]; then
            expected_cargo_crap=skipped
          fi
          if [[ "${CARGO_CRAP_RESULT}" != "${expected_cargo_crap}" ]]; then
            echo "CARGO_CRAP_RESULT=${CARGO_CRAP_RESULT}" >&2
            failed=1
          fi

          expected_mutation=skipped
          if [[ "${EVENT_NAME}" = pull_request && "${RUST_SCOPE_RESULT}" = true ]]; then
            expected_mutation=success
          fi
          if [[ "${MUTATION_RESULT}" != "${expected_mutation}" ]]; then
            echo "MUTATION_RESULT=${MUTATION_RESULT}" >&2
            failed=1
          fi

          # Every non-pull-request event runs the native Windows owner lane; a
          # pull request runs it for Rust-affecting Windows-owner changes.
          expected_owner_windows=skipped
          if [[ "${EVENT_NAME}" != pull_request \
            || ( "${RUST_SCOPE_RESULT}" = true && "${OWNER_WINDOWS_SCOPE}" != false ) ]]; then
            expected_owner_windows=success
          fi
          if [[ "${OWNER_WINDOWS_RESULT}" != "${expected_owner_windows}" ]]; then
            echo "OWNER_WINDOWS_RESULT=${OWNER_WINDOWS_RESULT}" >&2
            failed=1
          fi

          exit "${failed}"
