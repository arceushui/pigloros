name: SQLite image inventory diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          key: sqlite-image-inventory
      - name: Record build and feature inputs
        run: |
          set -euo pipefail
          inventory_directory="$RUNNER_TEMP/sqlite-image-inventory"
          mkdir -p "$inventory_directory"
          printf 'SQLITE_IMAGE_REPORT=%s/report.json\n' "$inventory_directory" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc -Vv > "$inventory_directory/rustc.txt"
          cargo tree -p pos-store --all-features --locked -e features > "$inventory_directory/features.txt"
      - name: Check the inventory test
        run: cargo clippy -p pos-store --all-features --test sqlite_native_image_inventory --locked -- -D warnings -W clippy::pedantic
      - name: Run the read-only inventory
        run: cargo test -p pos-store --all-features --test sqlite_native_image_inventory --locked -- --include-ignored --exact captures_current_sqlite_image --nocapture
      - name: Record the linked executable
        run: |
          python3 -B - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          report_path = Path(os.environ["SQLITE_IMAGE_REPORT"])
          report = json.loads(report_path.read_text())
          assert report["checkout"] == os.environ["GITHUB_SHA"]
          executable = Path(report["executable"])
          with executable.open("rb") as stream:
              executable_hash = hashlib.file_digest(stream, "sha256").hexdigest()
          symbols = subprocess.run(
              ["nm", "--defined-only", str(executable)],
              check=True, capture_output=True, text=True, timeout=60,
          ).stdout
          wanted = {"sqlite3_open_v2", "sqlite3_close", "sqlite3_sourceid", "sqlite3_file_control"}
          selected = [
              line for line in symbols.splitlines()
              if line.split() and line.split()[-1] in wanted
          ]
          linked = subprocess.run(
              ["ldd", str(executable)],
              check=True, capture_output=True, text=True, timeout=60,
          ).stdout
          (report_path.parent / "executable.json").write_text(json.dumps({
              "path": str(executable), "sha256": executable_hash,
              "selected_defined_symbols": selected,
          }, indent=2) + "\n")
          (report_path.parent / "linked-libraries.txt").write_text(linked)
          PY
      - name: Retain the image inventory
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sqlite-image-inventory-${{ github.sha }}
          path: ${{ runner.temp }}/sqlite-image-inventory/
          if-no-files-found: error
