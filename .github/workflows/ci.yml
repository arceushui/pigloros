# PiglorOS CI — quality gates enforced for Rust-affecting changes and pushes to main.
#
# Gate policy (Redmine #100):
#   fmt          — cargo fmt --check (rustfmt)
#   rustdoc      — cargo doc with rustdoc warnings denied
#   test         — cargo nextest --all-features in 3 shards + doctests (no ignored
#                  or unrun test)
#   clippy       — pedantic + -D warnings; also the all-features, all-targets
#                  type check
#   coverage     — lines ≥99%, regions ≥99%
#   cargo-crap   — no CRAP regressions; new functions score ≤30
#   audit        — cargo-audit (CVE advisories)
#   deny         — cargo-deny (licenses, bans, sources)
#   notices      — third-party notice bundle from the locked graphs (#545)
#   unsafe       — workspace unsafe_code = "forbid" plus the source-based
#                  owner-bridge unsafe policy (owner-bridge-policies job)
#   asan         — address sanitizer on nightly
#   docker       — image builds and smoke-tests
#   wasm         — world-client WASM contract + browser parity
#
# Implementation notes:
#   RUSTC_BOOTSTRAP=1 in coverage: lets cfg(coverage_nightly) enable
#     feature(coverage_attribute) for #[coverage(off)] on test helpers.
#   coverage(off) is only permitted on #[test]/#[tokio::test]/#[cfg(test)] code
#     (enforced by Trunk rust-test-policy).
#   --run-ignored all / --include-ignored: ensures #[ignore] tests run in CI;
#     none may silently skip.
#
# Pull requests that change only documentation or other non-Rust content run the
# lightweight scope job plus Trunk policy workflows and CodeQL (the
# code_scanning ruleset needs an analysis for every head commit). Rust build, test,
# coverage, cargo-crap, security, platform, and report jobs are skipped
# successfully. Any Rust, manifest, dependency, script, workflow, or
# build-policy change keeps the complete gate set.
#
# Within that set, a pull request whose changes all lie inside workspace member
# directories runs the plain test and lint jobs (test-shard, test doctests,
# feature-matrix, clippy, rustdoc, asan-build and asan) only for the members
# it can affect (scripts/affected_packages.py). Coverage, cargo-crap,
# mutation, CodeQL, Docker, conformance and the Windows lanes keep the whole
# workspace. Pushes to main, manual runs and Trunk merge-queue test pull
# requests always run the whole workspace in every job.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push cancels the superseded pull request run. Every main push gets its
# own group so main runs are never cancelled: each main commit must publish the
# trusted cargo-crap baseline that later pull requests resolve against.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# ── Quality gates ────────────────────────────────────────────────────────────
#
# Fail fast in bounded stages. Pull-request diff and policy checks run before
# any Cargo-heavy work. The core jobs then run together; the complete core set
# releases at most eight heavy standard jobs. The lightweight cargo-crap
# analysis starts as soon as hosted coverage (and the native lane, when in
# scope) succeeds, so main publishes its trusted baseline without waiting for
# the other core jobs. Mutation and the ASan shards follow the complete
# standard set as the final expensive stage and run beside each other. The
# native Windows owner lane starts after the ledger Windows runner and runs
# beside every other stage: only cargo-crap (native LCOV) waits for it, and
# ci-gate requires both results directly.
#
# preflight-gate, core-gate and standard-gate only report stage verdicts to
# ci-gate. Each later stage needs the gate's underlying jobs directly and
# repeats the gate's pass rule as its condition (the *-stage-needs and
# *-stage-if anchors), so no stage waits in the runner queue for an empty
# aggregator. scripts/ci_stage_policy.py holds the canonical conditions and
# scripts/test_ci_workflow_policy.py proves each equals its gate's verdict.

jobs:

  ci_change_scope:
    name: ci change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.fallback.outputs.rust || steps.scope.outputs.rust || steps.full.outputs.rust }}
      owner_windows: ${{ steps.owner_windows.outputs.owner_windows }}
      rust_packages: ${{ steps.rust_packages.outputs.rust_packages }}
      rust_doc_packages: ${{ steps.rust_packages.outputs.rust_doc_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Detect Rust-affecting changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: scope
        # The changed-file lookup calls the GitHub API, which can briefly refuse
        # diffs under load. Fall back to the full gate set instead of failing.
        continue-on-error: true
        if: github.event_name == 'pull_request' && hashFiles('.github/rust-scope.yml') != ''
        with:
          filters: .github/rust-scope.yml
          predicate-quantifier: some-with-excludes
      - name: Use full scope when change detection is unavailable
        id: fallback
        if: steps.scope.outcome == 'failure'
        run: |
          echo '::warning::Changed-file detection failed; running the full gate set.'
          printf 'rust=true\n' >> "$GITHUB_OUTPUT"
      - name: Use full scope for non-pull-request events
        id: full
        if: github.event_name != 'pull_request' || hashFiles('.github/rust-scope.yml') == ''
        run: printf 'rust=true\n' >> "$GITHUB_OUTPUT"
      # Phase-1 package scope (scripts/affected_packages.py, run from the
      # trusted base): on a pull request with Rust changes, the plain test and
      # lint jobs build and test only the members the diff can affect. Any
      # doubt selects the whole workspace: another event, failed detection, a
      # Trunk merge-queue test pull request (trunk-merge/*), a possibly
      # truncated (3000-file) or unlisted diff, a missing or failing script,
      # or output of an unexpected shape.
      - name: Resolve the affected Rust packages
        id: rust_packages
        env:
          EVENT_NAME: ${{ github.event_name }}
          DETECTED: ${{ github.event_name == 'pull_request' && steps.scope.outcome == 'success' && steps.scope.outputs.rust || '' }}
          HEAD_REF: ${{ github.head_ref }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          packages=--workspace
          doc_packages=--workspace
          selection='^(--workspace|-p [A-Za-z0-9_-]+( -p [A-Za-z0-9_-]+)*)$'
          listing="${RUNNER_TEMP}/pull-request-files.jsonl"
          if [[ "${EVENT_NAME}" != pull_request || "${DETECTED}" != true ]]; then
            echo 'Not a scoped pull request; running the whole workspace.'
          elif [[ "${HEAD_REF}" == trunk-merge/* ]]; then
            echo 'Merge-queue test pull request; running the whole workspace.'
          elif [[ ! "${CHANGED_FILES}" =~ ^[0-9]+$ ]] || (( 10#${CHANGED_FILES} >= 3000 )); then
            echo '::warning::The changed-file list may be truncated; running the whole workspace.'
          elif [[ ! "${PULL_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo '::warning::The pull request number is unavailable; running the whole workspace.'
          elif ! gh api --method GET --paginate -f per_page=100 \
            "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}/files" \
            --jq '.[] | {filename, previous_filename}' >"${listing}"; then
            echo '::warning::Changed files could not be listed; running the whole workspace.'
          elif ! resolved="$(python3 scripts/affected_packages.py \
            --expected-files "$((10#${CHANGED_FILES}))" "${listing}")"; then
            echo '::warning::The affected packages could not be resolved; running the whole workspace.'
          else
            mapfile -t lines <<<"${resolved}"
            candidate="${lines[0]-}"
            candidate="${candidate#rust_packages=}"
            doc_candidate="${lines[1]-}"
            doc_candidate="${doc_candidate#rust_doc_packages=}"
            if (( ${#lines[@]} == 2 )) \
              && [[ "${lines[0]-}" == rust_packages=* && "${lines[1]-}" == rust_doc_packages=* ]] \
              && [[ "${candidate}" =~ ${selection} ]] \
              && [[ "${doc_candidate}" == none || "${doc_candidate}" =~ ${selection} ]] \
              && [[ "${candidate}" != --workspace || "${doc_candidate}" == --workspace ]]; then
              packages="${candidate}"
              doc_packages="${doc_candidate}"
            else
              echo '::warning::The affected-package output is malformed; running the whole workspace.'
            fi
          fi
          printf 'Rust packages: %s\nDoctest packages: %s\n' "${packages}" "${doc_packages}"
          printf 'rust_packages=%s\n' "${packages}" >> "$GITHUB_OUTPUT"
          printf 'rust_doc_packages=%s\n' "${doc_packages}" >> "$GITHUB_OUTPUT"
      # Only an explicit 'false' from successful detection skips the native
      # Windows owner lane. paths-filter emits nothing for a key the base
      # revision's filter file lacks, and failed detection, non-pull-request
      # events and a missing filter file all leave the value empty: run it.
      # The pull-request files API lists at most 3000 files, and a rename may
      # move a lane input out of a matched path, so either also runs it, as
      # does any failure to list the renames.
      - name: Resolve the Windows-owner scope
        id: owner_windows
        env:
          DETECTED: ${{ github.event_name == 'pull_request' && steps.scope.outcome == 'success' && steps.scope.outputs.owner_windows || '' }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          scope=true
          if [[ "${DETECTED}" = false ]]; then
            if [[ ! "${CHANGED_FILES}" =~ ^[0-9]+$ ]] || (( 10#${CHANGED_FILES} >= 3000 )); then
              echo '::warning::The changed-file list may be truncated; running the Windows owner lane.'
            elif [[ ! "${PULL_NUMBER}" =~ ^[0-9]+$ ]]; then
              echo '::warning::The pull request number is unavailable; running the Windows owner lane.'
            elif ! renamed="$(gh api --method GET --paginate -f per_page=100 \
              "repos/${GITHUB_REPOSITORY}/pulls/${PULL_NUMBER}/files" \
              --jq '.[] | select(.status == "renamed") | .filename')"; then
              echo '::warning::Renamed files could not be listed; running the Windows owner lane.'
            elif [[ -n "${renamed}" ]]; then
              echo 'A renamed file may move a lane input; running the Windows owner lane.'
            else
              scope=false
            fi
          fi
          printf 'owner_windows=%s\n' "${scope}" >> "$GITHUB_OUTPUT"

  trunk-pr:
    # Keep this display name stable: the main-branch ruleset requires it.
    name: Trunk Code Quality
    needs: ci_change_scope
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Trunk Check (pull-request diff)
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  # Reports the preflight verdict to core-gate and ci-gate. The next stage
  # starts from *preflight-stage-needs and *preflight-stage-if instead.
  preflight-gate:
    name: preflight-gate
    if: ${{ always() }}
    needs: &preflight-stage-needs
      - ci_change_scope
      - trunk-pr
      - pinned-dependencies
      - source-policies
      - owner-bridge-policies
      - conformance-fixtures
      - conformance-non-linux
      - plugin-component-fixtures
      - third-party-notices
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require fast preflight checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          TRUNK_RESULT: ${{ needs.trunk-pr.result }}
          POLICY_RESULT: ${{ needs.pinned-dependencies.result }}
          SOURCE_POLICY_RESULT: ${{ needs.source-policies.result }}
          OWNER_POLICY_RESULT: ${{ needs.owner-bridge-policies.result }}
          FIXTURES_RESULT: ${{ needs.conformance-fixtures.result }}
          NON_LINUX_RESULT: ${{ needs.conformance-non-linux.result }}
          PLUGIN_FIXTURES_RESULT: ${{ needs.plugin-component-fixtures.result }}
          NOTICES_RESULT: ${{ needs.third-party-notices.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          test "${FIXTURES_RESULT}" = success
          test "${NON_LINUX_RESULT}" = success
          if [[ "${EVENT_NAME}" = pull_request ]]; then
            test "${TRUNK_RESULT}" = success
          else
            test "${TRUNK_RESULT}" = skipped
          fi
          if [[ "${RUST_SCOPE}" = true ]]; then
            test "${POLICY_RESULT}" = success
            test "${SOURCE_POLICY_RESULT}" = success
            test "${OWNER_POLICY_RESULT}" = success
            test "${PLUGIN_FIXTURES_RESULT}" = success
            test "${NOTICES_RESULT}" = success
          else
            test "${POLICY_RESULT}" = skipped
            test "${SOURCE_POLICY_RESULT}" = skipped
            test "${OWNER_POLICY_RESULT}" = skipped
            test "${PLUGIN_FIXTURES_RESULT}" = skipped
            test "${NOTICES_RESULT}" = skipped
          fi

  fmt:
    name: fmt
    needs: *preflight-stage-needs
    # The preflight pass rule accepts the push-only skip of trunk-pr and the
    # Rust-scope skips. !cancelled() keeps those skips from propagating here;
    # the explicit result checks still stop the stage after a failed preflight.
    if: &preflight-stage-if >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      (needs.ci_change_scope.outputs.rust == 'true' ||
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: cargo fmt --check (full repository)
        run: cargo fmt --all -- --check

  rustdoc:
    name: rustdoc
    needs: &core-stage-needs
      - ci_change_scope
      - trunk-pr
      - pinned-dependencies
      - source-policies
      - owner-bridge-policies
      - conformance-fixtures
      - conformance-non-linux
      - plugin-component-fixtures
      - third-party-notices
      - fmt
      - feature-matrix
      - test
      - test-shards
      - clippy
      - coverage
    if: &core-stage-if >-
      ${{ !cancelled() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.conformance-non-linux.result == 'success' &&
      ((github.event_name == 'pull_request' && needs.trunk-pr.result == 'success') ||
      (github.event_name != 'pull_request' && needs.trunk-pr.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust == 'true' &&
      needs.pinned-dependencies.result == 'success' &&
      needs.source-policies.result == 'success' &&
      needs.owner-bridge-policies.result == 'success' &&
      needs.plugin-component-fixtures.result == 'success' &&
      needs.third-party-notices.result == 'success') ||
      (needs.ci_change_scope.outputs.rust != 'true' &&
      needs.pinned-dependencies.result == 'skipped' &&
      needs.source-policies.result == 'skipped' &&
      needs.owner-bridge-policies.result == 'skipped' &&
      needs.plugin-component-fixtures.result == 'skipped' &&
      needs.third-party-notices.result == 'skipped')) &&
      ((needs.ci_change_scope.outputs.rust != 'false' && needs.fmt.result == 'success' &&
      needs.feature-matrix.result == 'success' && needs.test.result == 'success' &&
      needs.test-shards.result == 'success' && needs.clippy.result == 'success' &&
      needs.coverage.result == 'success') ||
      (needs.ci_change_scope.outputs.rust == 'false' && needs.fmt.result == 'skipped' &&
      needs.feature-matrix.result == 'skipped' && needs.test.result == 'skipped' &&
      needs.test-shards.result == 'skipped' && needs.clippy.result == 'skipped' &&
      needs.coverage.result == 'skipped')) &&
      (needs.ci_change_scope.outputs.rust == 'true' ||
      github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      # Partial-cache cleanup mistakes rustdoc source directories named tests
      # for build directories. Build documentation fresh, without that cache.
      - name: cargo doc (warnings denied)
        env:
          CARGO_INCREMENTAL: "0"
          RUSTDOCFLAGS: -D warnings
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        run: |
          read -ra packages <<<"${CARGO_PACKAGES}"
          cargo doc "${packages[@]}" --all-features --no-deps --locked

  feature-matrix:
    name: feature-matrix
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: feature-matrix
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo check (no default features)
        env:
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        run: |
          read -ra packages <<<"${CARGO_PACKAGES}"
          cargo check "${packages[@]}" --all-targets --no-default-features --locked
      - name: Plugin trust registry Memory vectors (no default features)
        run: >
          cargo test -p pos-store --no-default-features
          --test plugin_trust_registry_memory_public
          --test plugin_trust_registry_memory_policy_public
          --test plugin_trust_registry_memory_evaluation_public --locked
      - name: cargo check (all features, all targets)
        env:
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        run: |
          read -ra packages <<<"${CARGO_PACKAGES}"
          cargo check "${packages[@]}" --all-targets --all-features --locked
      - name: Prove reference evaluator implementation independence
        run: bash scripts/check-reference-evaluator-independence.sh
      - name: Prove the conformance adapter dependency graph
        run: bash scripts/check-adapter-graph.sh

  test:
    name: test
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Coverage and ASan already build tests with line tables. They keep
      # panic locations and backtraces while cutting link time and the
      # cached target size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test advisory benchmark comparator
        run: python3 scripts/test_compare_memory_store_benchmarks.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The workspace tests run in the test-shard matrix. Doctests are not
      # supported by nextest, so libtest still runs them here.
      # A scoped pull request whose affected members have no library target
      # has no doctest; cargo refuses --doc for such a selection.
      - name: cargo test doctests (all features, ignored included)
        env:
          CARGO_DOC_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_doc_packages || '--workspace' }}
        run: |
          set -euo pipefail
          if [[ "${CARGO_DOC_PACKAGES}" == none ]]; then
            echo 'No affected package has a library target; no doctest is in scope.'
            exit 0
          fi
          read -ra packages <<<"${CARGO_DOC_PACKAGES}"
          cargo test "${packages[@]}" --all-features --locked --doc -- --include-ignored 2>&1 | tee /tmp/cargo-doctest.log
      - name: Require no ignored test in the doctest summary
        env:
          CARGO_DOC_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_doc_packages || '--workspace' }}
        run: |
          set -euo pipefail
          if [[ "${CARGO_DOC_PACKAGES}" != none ]]; then
            bash scripts/assert-no-ignored-in-test-summary.sh /tmp/cargo-doctest.log
          fi

  # The nextest suite is CPU-bound (~860 test-seconds on a 4-vCPU runner after
  # the crypto dependency opt-level change), so it is split across runners.
  # slice:k/N deals tests round-robin, spreading the long pos-conformance
  # bundle tests over every shard.
  test-shard:
    name: test shard (${{ matrix.shard }}/3)
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - &reclaim-sdk-headroom
        name: Reclaim unused SDK headroom
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          printf 'CI SDK headroom before (bytes)\n'
          df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          printf 'CI SDK headroom before (inodes)\n'
          df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          ci_root_device="$(stat -c '%d' -- /)"
          for ci_sdk_path in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ ! -e "${ci_sdk_path}" && ! -L "${ci_sdk_path}" ]]; then
              printf 'CI SDK absent: %s\n' "${ci_sdk_path}"
              continue
            fi
            printf 'CI SDK candidate: %s\n' "${ci_sdk_path}"
            test -d "${ci_sdk_path}"
            test ! -L "${ci_sdk_path}"
            test "$(readlink -e -- "${ci_sdk_path}")" = "${ci_sdk_path}"
            ci_sdk_device="$(stat -c '%d' -- "${ci_sdk_path}")"
            printf 'CI SDK device: %s root=%s sdk=%s\n' "${ci_sdk_path}" "${ci_root_device}" "${ci_sdk_device}"
            test "${ci_sdk_device}" = "${ci_root_device}"
            sudo du -sx -B1 -- "${ci_sdk_path}"
            sudo rm -rf --one-file-system -- "${ci_sdk_path}"
            printf 'CI SDK removed: %s\n' "${ci_sdk_path}"
          done
          printf 'CI SDK headroom after (bytes)\n'
          df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          printf 'CI SDK headroom after (inodes)\n'
          df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: test-nextest
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo nextest partition (all features, ignored included)
        env:
          SHARD: ${{ matrix.shard }}
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        # A scoped package set can leave a slice without tests; only then may
        # a slice run none. test-shards still proves every selected test ran
        # exactly once.
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/nextest-shard.log"
          read -ra packages <<<"${CARGO_PACKAGES}"
          no_tests=fail
          if [[ "${CARGO_PACKAGES}" != --workspace ]]; then
            no_tests=pass
          fi
          printf 'nextest partition: slice:%s/3\n' "${SHARD}" >"${log}"
          cargo nextest run "${packages[@]}" --all-features --locked \
            --user-config-file none --ignore-default-filter \
            --run-ignored all --no-fail-fast --no-tests="${no_tests}" \
            --partition "slice:${SHARD}/3" 2>&1 | tee -a "${log}"
      - name: Upload shard summary log
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-log-${{ matrix.shard }}
          path: ${{ runner.temp }}/nextest-shard.log
          retention-days: 1
          if-no-files-found: error
          # A re-run of one shard replaces its earlier attempt's log.
          overwrite: true

  test-shards:
    name: test-shards
    needs: [test-shard]
    if: ${{ !cancelled() && needs.test-shard.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download every shard summary log
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-shard-log-*
          path: ${{ runner.temp }}/shards
      - name: Prove the shards ran every test exactly once
        run: |
          set -euo pipefail
          shopt -s nullglob
          logs=("${RUNNER_TEMP}"/shards/test-shard-log-*/nextest-shard.log)
          for shard in 1 2 3; do
            matches="$(grep -lFx "nextest partition: slice:${shard}/3" "${logs[@]}" | wc -l)"
            test "${matches}" -eq 1
          done
          bash scripts/assert-no-ignored-in-test-summary.sh --partitioned=3 "${logs[@]}"

  reference-evaluator-release:
    name: reference-evaluator-release
    needs: *core-stage-needs
    if: *core-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: reference-evaluator-release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install evaluator packaging tools
        run: |
          bash scripts/prepare-ubuntu-package-mirror.sh b3sum jq
      - name: Build and verify standalone evaluator release evidence
        run: |
          shadow_directory="${RUNNER_TEMP}/caller-path-shadow"
          mkdir -p "${shadow_directory}"
          for command in b3sum cargo cut dirname env git gzip install jq mkdir mktemp rm rustc rustup sed tar; do
            printf '#!/bin/sh\nexit 99\n' >"${shadow_directory}/${command}"
            chmod 0755 "${shadow_directory}/${command}"
          done
          PATH="${shadow_directory}:${PATH}" /bin/bash \
            scripts/package-reference-evaluator.sh "${RUNNER_TEMP}/reference-evaluator"
      - name: Verify the packaged evaluator output through the public test
        env:
          POS_REFERENCE_EVALUATOR_PACKAGE: ${{ runner.temp }}/reference-evaluator
        run: |
          test -d "${POS_REFERENCE_EVALUATOR_PACKAGE}"
          cargo test --locked -p pos-reference --test evaluator_package_public
      - name: Upload standalone evaluator release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-evaluator-${{ github.sha }}
          path: ${{ runner.temp }}/reference-evaluator
          retention-days: 7
          if-no-files-found: error

  conformance-fixtures:
    name: conformance-fixtures
    needs: ci_change_scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The Gateway contract check compares compatibility/ with the merge base of main.
          fetch-depth: 0
      - name: Install fixture verification tools
        run: |
          bash scripts/prepare-ubuntu-package-mirror.sh b3sum jq
      - name: Obtain pinned offline SCS1 derivation inputs
        env:
          SYSTEMD_SCS1_SYSTEMD_SOURCE: ${{ runner.temp }}/systemd-scs1-source
          SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE: ${{ runner.temp }}/libseccomp-2.6.1.tar.gz
        run: |
          git init "$SYSTEMD_SCS1_SYSTEMD_SOURCE"
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" remote add origin https://github.com/systemd/systemd.git
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" fetch --depth=2 origin f1d0952a125b96b7ab2f1ff29a87448ade8ac29b
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" checkout --detach FETCH_HEAD
          curl --fail --location --retry 3 --retry-all-errors --max-time 60 \
            https://github.com/seccomp/libseccomp/releases/download/v2.6.1/libseccomp-2.6.1.tar.gz \
            --output "$SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE"
      - name: Reproduce production SCS1 and exercise materializer rejection boundaries
        env:
          SYSTEMD_SCS1_SYSTEMD_SOURCE: ${{ runner.temp }}/systemd-scs1-source
          SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE: ${{ runner.temp }}/libseccomp-2.6.1.tar.gz
        run: python3 scripts/test_materialize_systemd_scs1.py
      - name: Independently regenerate public fixture records
        run: bash scripts/generate-conformance-fixture-records.sh
      - name: Check the Plugin conformance fixture generator and its outputs
        run: python3 scripts/generate_plugin_conformance_fixtures.py --check
      - name: Check the metric conformance fixture generator and its outputs
        run: python3 scripts/generate_metric_conformance_fixtures.py --check
      - name: Check the replay conformance fixture generator and its outputs
        run: python3 scripts/generate_replay_conformance_fixtures.py --check
      - name: Check the non-interference expected results and matrix bindings
        run: python3 scripts/generate_non_interference_fixtures.py --check
      - name: Check the erasure conformance cases and their recorded artifacts
        run: python3 scripts/generate_erasure_conformance_fixtures.py --check
      - name: Check the gateway conformance fixture generator and its outputs
        run: python3 scripts/generate_gateway_conformance_fixtures.py --check
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12.11
      - name: Install the pinned Gateway contract validator
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt
      - name: Check the Gateway v1 contract, its frozen v1 baseline and served fixtures
        run: |
          python scripts/check_gateway_contract.py --append-only origin/main
          python scripts/test_check_gateway_contract.py
      - name: Prove the Gateway execution-mode profile strings stay confined
        run: |
          bash scripts/check-gateway-mode-profile-confinement.sh
          bash scripts/test-check-gateway-mode-profile-confinement.sh
      - name: Check the Plugin conformance evidence-status records stay pending
        run: |
          python3 scripts/check_plugin_conformance_expected.py
          python3 scripts/test_check_plugin_conformance_expected.py
      - name: Verify public conformance fixtures
        run: bash scripts/verify-conformance-fixtures.sh
      - name: Exercise conformance fixture rejection boundaries
        run: bash scripts/test-conformance-fixture-validation.sh

  materialize-conformance-bundles:
    name: materialize-conformance-bundles
    needs: *core-stage-needs
    if: *core-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: conformance-materialization
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install fixture verification tools
        run: |
          bash scripts/prepare-ubuntu-package-mirror.sh b3sum jq
      - name: Reject non-main manual artifact publication
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          echo 'repository Draft artifact publication is only permitted from main' >&2
          exit 1
      - name: Materialize repository-only Draft CPF1 verification bundles
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          # Public deterministic fixture key. The declared Draft authority is
          # repository-test-fixture-only and is never a deployment trust root.
          PIGLOROS_CONFORMANCE_SIGNING_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
        run: bash scripts/materialize-conformance-bundles.sh
      - name: Materialize repository-only Draft bundles for pull-request verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Same public deterministic fixture key used for main verification;
          # these signatures prove fixture consistency, not publisher identity.
          PIGLOROS_CONFORMANCE_SIGNING_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
        run: |
          mkdir -- "${RUNNER_TEMP}/conformance-draft"
          bash scripts/materialize-conformance-bundles.sh "${RUNNER_TEMP}/conformance-draft"
      - name: Exercise build-time fixture rejection boundary
        run: bash scripts/test-conformance-build-validation.sh
      - name: Materialize Sandbox Provider public vectors
        env:
          SANDBOX_PROVIDER_VECTOR_OUTPUT: ${{ runner.temp }}/sandbox-provider-v1
        run: |
          cargo test --locked -p pos-conformance --test sandbox_provider_contract_public
          cargo test --locked -p pos-conformance --test profile_contract_public
      - name: Upload Sandbox Provider public vectors
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sandbox-provider-v1-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-provider-v1
          retention-days: 7
          if-no-files-found: warn
      - name: Upload main-branch Draft verification artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-bundles-${{ github.sha }}
          path: fixtures/conformance/published
          retention-days: 7
          if-no-files-found: error
      - name: Upload pull-request Draft verification artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-bundles-pr-draft-${{ github.sha }}
          path: ${{ runner.temp }}/conformance-draft
          retention-days: 7
          if-no-files-found: error

  conformance-non-linux:
    name: conformance-non-linux
    needs: ci_change_scope
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          shared-key: conformance-non-linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Enforce the Linux-only secure fixture-generation boundary
        run: |
          set +e
          cargo check -p pos-conformance --locked 2>&1 | tee "${RUNNER_TEMP}/conformance-non-linux.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "non-Linux conformance build unexpectedly succeeded" >&2
            exit 1
          fi
          grep --fixed-strings \
            "secure conformance fixture snapshot generation requires Linux openat2" \
            "${RUNNER_TEMP}/conformance-non-linux.log"
      - name: Check pos-store without the Linux-only Plugin trust registry
        run: cargo check -p pos-store --locked
      - name: Exercise unsupported recipient export decryption boundary
        run: cargo test -p pos-store --test recipient_export_decryption_unsupported_public --locked -- --include-ignored

  # ADR-061 revision 4 compatibility prototype (#539): rebuild the
  # compatibility Components from source with pinned toolchains and require
  # the committed fixtures byte for byte.
  plugin-component-fixtures:
    name: plugin-component-fixtures
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: wasm32-unknown-unknown
      - name: Install pinned Component guest toolchains
        run: >
          bash plugins/community/examples/compatibility-prototype/install-tools.sh
          "${{ runner.temp }}/component-tools"
      - name: Rebuild the compatibility Components and compare their bytes
        env:
          PROTOTYPE_TOOLS: ${{ runner.temp }}/component-tools
          REBUILT_DIR: ${{ runner.temp }}/rebuilt-plugin-fixtures
        run: bash plugins/community/examples/compatibility-prototype/verify-fixtures.sh
      # On a mismatch, publish the rebuilt Components and SHA256SUMS: download
      # them with `gh run download -n rebuilt-plugin-fixtures` and commit them
      # to the prototype's fixtures directory.
      - name: Upload the rebuilt compatibility Components
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuilt-plugin-fixtures
          path: ${{ runner.temp }}/rebuilt-plugin-fixtures
          retention-days: 3
          if-no-files-found: warn

  # The third-party notice bundle (#545) from the locked graphs and the
  # committed third_party/notices texts. The reusable workflow is the one
  # generator that any future binary release must also call.
  third-party-notices:
    name: third-party-notices
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    uses: ./.github/workflows/third-party-notices.yml

  ledger-windows:
    name: ledger-windows
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: i686-pc-windows-msvc
      - name: Exercise the unsupported owned-key signing boundary
        run: cargo test -p piglor-ledger --all-features --test non_unix_store_owner --locked -- --include-ignored
      - name: Exercise the unsupported non-Linux EPF1 boundary
        run: cargo test -p pos-runtime --features test-support --test non_linux_profile --locked -- --include-ignored
      - name: Exercise the Windows subject encryptor platform admission
        run: cargo test -p pos-owner-bridge --lib --locked linux_and_windows_support_the_nonce_ledger_and_encryptor_lock -- --include-ignored
      - name: Check narrower-target Replay representation boundaries
        run: cargo check -p pos-runtime --target i686-pc-windows-msvc --locked
      - name: Exercise narrower-target registry cardinality refusals
        run: cargo test -p pos-core --target i686-pc-windows-msvc --test key_registry_guarded_read_public --locked -- --include-ignored
      - name: Exercise native-width canonical length arithmetic
        run: cargo test -p pos-core --target i686-pc-windows-msvc --lib --locked canonical_length_tests -- --include-ignored

  # The owner lane reuses the completed ledger Windows runner and then runs
  # beside the core and standard stages instead of gating preflight. It is not
  # a standard-stage runner: only cargo-crap (which consumes its native LCOV)
  # and ci-gate depend on it, so a failed lane never hides standard-stage
  # findings. Pull requests run it only for Windows-owner changes; every other
  # event always runs it.
  owner-bridge-windows:
    name: owner-bridge-windows
    needs: [ci_change_scope, ledger-windows]
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' && needs.ci_change_scope.outputs.owner_windows == 'true' }}
    uses: ./.github/workflows/owner-bridge-windows.yml
    permissions:
      contents: read

  clippy:
    name: clippy
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Reject new lint suppressions
        run: bash scripts/check-no-new-lint-suppressions.sh origin/main
      - name: cargo clippy (workspace lint policy, pedantic, deny warnings)
        env:
          CARGO_PACKAGES: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust_packages || '--workspace' }}
        run: |
          read -ra packages <<<"${CARGO_PACKAGES}"
          cargo clippy "${packages[@]}" --all-features --all-targets --locked -- \
            -D warnings -W clippy::pedantic
      # Library and binary targets only: the shim's test targets depend on
      # pos-crypto, whose C build cannot target MSVC from this Linux runner.
      # The native owner-bridge-windows job lints every target with these flags.
      - name: Cross-target lint the Windows owner shim
        run: >
          cargo clippy -p pos-owner-bridge-windows --target x86_64-pc-windows-msvc
          --all-features --locked -- -D warnings -W clippy::pedantic
      - name: Staged reducer purity guard (ADR-113 §7)
        run: bash scripts/check-reducer-purity-guard.sh
      - name: Exercise Windows shim coverage exclusions with real metadata
        run: |
          set -euo pipefail
          cargo metadata --locked --no-deps --format-version 1 |
            python scripts/owner_bridge_windows_cov_ignore.py > "${RUNNER_TEMP}/owner-bridge-windows-cov-ignore.txt"
          test -s "${RUNNER_TEMP}/owner-bridge-windows-cov-ignore.txt"

  # The provider binary doubles as the ADR-069 release launcher, which must be a
  # self-contained static ELF: no PT_INTERP, no dynamic section (owner decision
  # Q9.10). Build it for both supported architectures and inspect the result.
  static-launcher:
    name: static-launcher
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTFLAGS: -D warnings -C target-feature=+crt-static -C relocation-model=static
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: static-launcher
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the musl and aarch64 cross toolchains
        run: |
          set -euo pipefail
          bash scripts/prepare-ubuntu-package-mirror.sh --no-install-recommends musl-tools gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Build the provider binary as a static ELF for each architecture
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            cargo build --locked --release --package pos-sandboxd --bin pos-sandboxd --target "${target}"
          done
      - name: Require no interpreter, no dynamic section and no shared dependency
        run: |
          set -euo pipefail
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            binary="target/${target}/release/pos-sandboxd"
            file "${binary}"
            file "${binary}" | grep -q 'statically linked'
            if file "${binary}" | grep -qi 'interpreter\|dynamically linked'; then
              echo "${binary} names an interpreter or is dynamically linked" >&2
              exit 1
            fi
            if readelf --program-headers --wide "${binary}" | grep -q 'INTERP'; then
              echo "${binary} has a PT_INTERP program header" >&2
              exit 1
            fi
            readelf --dynamic "${binary}" 2>&1 | grep -q 'There is no dynamic section in this file'
            if readelf --section-headers --wide "${binary}" | grep -Eq '\.interp|\.dynamic|\.dynsym'; then
              echo "${binary} has dynamic-linking sections" >&2
              exit 1
            fi
          done
      - name: Run the x86_64 binary and require its launcher mode to refuse invalid LPV1 input
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-musl/release/pos-sandboxd
          set +e
          "${binary}" launch-barrier zz 2> launcher.err
          status=$?
          set -e
          test "${status}" = 1
          grep -q 'launch parameters are not a valid LPV1' launcher.err

  coverage:
    name: coverage
    needs: *preflight-stage-needs
    if: *preflight-stage-if
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - *reclaim-sdk-headroom
      - name: Test advisory benchmark comparator
        run: python3 scripts/test_compare_memory_store_benchmarks.py
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install cargo-nextest
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-nextest@0.9.146
          fallback: none
      - name: Install covgate
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: covgate@0.2.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Generate one complete report, then let covgate check the changed
      # production diff before spending time on the repository-wide floor.
      # nextest runs every test executable in parallel instead of one at a
      # time; each test process writes its own profile, merged by llvm-cov.
      # The test-shard jobs run the same nextest flags and test-shards proves
      # every test ran with none skipped, so this run needs no summary check.
      - name: Generate coverage report for changed-code gate
        run: >
          cargo llvm-cov nextest --workspace --all-features --locked
          --json --output-path "${{ runner.temp }}/coverage.json"
          --user-config-file none --ignore-default-filter
          --run-ignored all --no-fail-fast
      - name: Enforce changed production Rust code coverage first
        run: >
          covgate check "${{ runner.temp }}/coverage.json"
          --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'origin/main' }}"
          --no-github-summary
      - name: Upload coverage JSON for region diagnosis
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-json-${{ github.sha }}
          path: ${{ runner.temp }}/coverage.json
          retention-days: 1
          if-no-files-found: error
      - name: Enforce workspace coverage floor
        run: |
          jq -er '
            .data[0].totals
            | "Workspace coverage: lines \(.lines.covered)/\(.lines.count) (\(.lines.percent)%); regions \(.regions.covered)/\(.regions.count) (\(.regions.percent)%)"
          ' "${{ runner.temp }}/coverage.json"
          cargo llvm-cov report --json --summary-only --show-missing-lines \
            --fail-under-lines 99 \
            --fail-under-regions 99
      - name: Preserve failed coverage diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/coverage.json
          retention-days: 1
          if-no-files-found: ignore
      - name: Export LCOV for cargo-crap
        run: cargo llvm-cov report --lcov
          --output-path "${{ runner.temp }}/coverage.lcov"
      - name: Upload LCOV for cargo-crap
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-${{ github.sha }}
          path: ${{ runner.temp }}/coverage.lcov
          retention-days: 1
          if-no-files-found: error

  # Reports the core verdict to standard-gate and ci-gate. The standard stage
  # starts from *core-stage-needs and *core-stage-if instead.
  core-gate:
    name: core-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - preflight-gate
      - fmt
      - feature-matrix
      - test
      - test-shards
      - clippy
      - coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require fmt, feature matrix, doctests, test shards, clippy, and coverage
        env:
          SCOPE_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          PREFLIGHT_RESULT: ${{ needs.preflight-gate.result }}
          FMT_RESULT: ${{ needs.fmt.result }}
          FEATURE_MATRIX_RESULT: ${{ needs.feature-matrix.result }}
          TEST_RESULT: ${{ needs.test.result }}
          TEST_SHARDS_RESULT: ${{ needs.test-shards.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          test "${PREFLIGHT_RESULT}" = success
          expected=success
          if [[ "${RUST_SCOPE}" = false ]]; then
            expected=skipped
          fi
          test "${FMT_RESULT}" = "${expected}"
          test "${FEATURE_MATRIX_RESULT}" = "${expected}"
          test "${TEST_RESULT}" = "${expected}"
          test "${TEST_SHARDS_RESULT}" = "${expected}"
          test "${CLIPPY_RESULT}" = "${expected}"
          test "${COVERAGE_RESULT}" = "${expected}"

  cargo-crap:
    name: cargo-crap
    # Starts from coverage, not core-gate: the score depends only on the LCOV
    # inputs, and ci-gate still requires core-gate. On main this publishes the
    # trusted baseline that pull requests wait for as early as possible.
    needs:
      - ci_change_scope
      - coverage
      - owner-bridge-windows
    # The push-only Trunk skip is an accepted preflight ancestor. Evaluate the
    # explicit direct dependencies instead of inheriting that skipped state.
    # The native lane must succeed unless the trusted scope explicitly left it
    # out of this pull request.
    if: ${{ !cancelled() && needs.coverage.result == 'success' && (needs.owner-bridge-windows.result == 'success' || (needs.ci_change_scope.outputs.owner_windows == 'false' && needs.owner-bridge-windows.result == 'skipped')) && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    # Budget: the pre-steps (full-history checkout, install-action, LCOV
    # downloads), the resolver step's 45-minute bound on waiting for main's
    # trusted baseline (see that step), then scoring and uploads, all within
    # 70 minutes.
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-crap
        uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2
        with:
          tool: cargo-crap@0.2.2
      - name: Download hosted LCOV
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-lcov-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Download hosted native LCOV
        if: ${{ needs.ci_change_scope.outputs.owner_windows != 'false' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: owner-windows-lcov-${{ github.sha }}
          path: ${{ runner.temp }}/owner-windows-lcov
      - name: Bind native and Linux coverage to this checkout
        if: ${{ needs.ci_change_scope.outputs.owner_windows != 'false' }}
        run: >
          python scripts/merge_owner_bridge_lcov.py
          --linux "${{ runner.temp }}/coverage.lcov"
          --native "${{ runner.temp }}/owner-windows-lcov/owner-windows.lcov"
          --receipt "${{ runner.temp }}/owner-windows-lcov/owner-windows-lcov-receipt.json"
          --workspace "${{ github.workspace }}"
          --checkout "${{ github.sha }}"
          --output "${{ runner.temp }}/cargo-crap-coverage.lcov"
      # Without the native lane the shim has no measured counters. Score the
      # Linux LCOV alone and hide only the shim from scoring (below), so its
      # functions are neither invented green nor scored pessimistically.
      - name: Use Linux coverage without the unmeasured native shim
        if: ${{ needs.ci_change_scope.outputs.owner_windows == 'false' }}
        run: cp "${{ runner.temp }}/coverage.lcov" "${{ runner.temp }}/cargo-crap-coverage.lcov"
      - name: Reject repository cargo-crap configuration
        run: test ! -e .cargo-crap.toml
      # Polls up to 30 minutes while main's ci.yml run for the trusted base is
      # still producing its cargo-crap baseline, then falls back to the nearest
      # first-parent main ancestor's baseline (fetch-depth 0 above provides that
      # history), then fails closed as before. The extra 15 minutes cover the
      # last poll and the 30-commit ancestor walk even when GitHub API calls
      # need retries; a step that still runs out of time fails closed.
      - name: Resolve trusted cargo-crap baseline
        id: baseline
        timeout-minutes: 45
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve_cargo_crap_baseline.sh
      - name: Download trusted base baseline
        if: ${{ steps.baseline.outputs.run-id != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cargo-crap-baseline-${{ steps.baseline.outputs.baseline-sha }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run-id }}
      - name: Drop the unmeasured native shim from the trusted baseline
        if: ${{ steps.baseline.outputs.run-id != '' && needs.ci_change_scope.outputs.owner_windows == 'false' }}
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/cargo-crap-baseline.json"
          jq -e '.entries |= map(select(.file | gsub("\\\\"; "/") | test("(^|/)crates/pos-owner-bridge-windows/") | not))' \
            "${baseline}" > "${baseline}.scoped"
          mv "${baseline}.scoped" "${baseline}"
      - name: Generate trusted current baseline
        if: ${{ steps.baseline.outputs.bootstrap == 'true' }}
        env:
          NATIVE_SHIM_ALLOW: ${{ needs.ci_change_scope.outputs.owner_windows == 'false' && 'crates/pos-owner-bridge-windows/**' || '' }}
        run: >
          cargo crap --workspace
          --lcov "${{ runner.temp }}/cargo-crap-coverage.lcov"
          --missing pessimistic
          --jobs 2
          --exclude 'tests/**'
          --exclude 'benches/**'
          --exclude 'examples/**'
          --exclude 'src/selector/installation/tests/**'
          --exclude 'src/erasure_tests.rs'
          --exclude 'src/system_bus/tests.rs'
          --exclude 'src/image_activator/tests.rs'
          --exclude 'src/root_attachment/tests.rs'
          --exclude 'src/root_selector/tests/admission_bounds.rs'
          --exclude 'src/selector/installation/fixture.rs'
          --exclude 'src/provider_admission/test_support.rs'
          --exclude 'src/e2e_determinism.rs'
          --exclude 'src/action_admission_tests.rs'
          --exclude 'src/fork_event_authority/tests/local_replay.rs'
          --exclude 'src/sqlite/tests/protected_interval_cleanup.rs'
          --exclude 'src/sqlite/fork_replay/interval_tests.rs'
          --exclude 'src/imported_fork_replay_tests.rs'
          --exclude 'src/imported_fork_replay_tests/lifecycle.rs'
          --exclude 'src/imported_fork_replay_tests/lifecycle/begin.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/compare.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/read_bounds.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/sqlite.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/sqlite/compare.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget/deadline.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget/repeat.rs'
          --exclude 'src/nested_imported_fork_replay_tests.rs'
          --exclude 'src/nested_imported_fork_replay_tests/intermediate_privacy.rs'
          --exclude 'src/ordinary_fork_lineage_tests.rs'
          --exclude 'src/execute/tests/ownership.rs'
          --exclude 'src/provider_barrier/tests.rs'
          --exclude 'src/execute/tests.rs'
          --exclude 'src/attempt_records/tests.rs'
          --exclude 'src/execute/tests/ownership/abandonment.rs'
          --exclude 'src/execute/tests/adapter.rs'
          --exclude 'src/revision/tests.rs'
          --exclude 'src/provider_lifecycle/tests.rs'
          --exclude 'src/provider_runtime/tests.rs'
          --exclude 'src/provider_runtime/endpoint/tests.rs'
          --exclude 'src/provider_runtime/serving/tests.rs'
          --exclude 'src/provider_runtime/recovery_peer/tests.rs'
          --exclude 'src/selector/recovery/tests.rs'
          --exclude 'src/provider_runtime/revocation/tests.rs'
          --exclude 'src/scenario_room/tests.rs'
          --exclude 'src/executor/scenario_room/tests.rs'
          --exclude 'src/decision_preview/tests.rs'
          --exclude 'src/executor/decision_preview/tests.rs'
          --exclude 'src/decision_preview/route/tests.rs'
          --exclude 'src/local_erasure_provision/tests.rs'
          --exclude 'src/local_erasure_composition/tests.rs'
          --exclude 'src/erasure/tests.rs'
          --exclude 'src/erasure/tests/acceptance.rs'
          --exclude 'src/mode_profile/tests.rs'
          --exclude 'src/community/memory_domain/tests.rs'
          --exclude 'src/community/initialize/tests.rs'
          --exclude 'src/community/extractor/tests.rs'
          --exclude 'src/community/quarantine/tests.rs'
          --exclude 'src/attempt_records/tests/**'
          --exclude 'src/adapter/native_tests.rs'
          --exclude 'src/adapter/native_tests/**'
          ${NATIVE_SHIM_ALLOW:+--allow "${NATIVE_SHIM_ALLOW}"}
          --format json
          --output "${{ runner.temp }}/cargo-crap-baseline.json"
      - name: Analyze CRAP score changes
        env:
          NATIVE_SHIM_ALLOW: ${{ needs.ci_change_scope.outputs.owner_windows == 'false' && 'crates/pos-owner-bridge-windows/**' || '' }}
        run: >
          cargo crap --workspace
          --lcov "${{ runner.temp }}/cargo-crap-coverage.lcov"
          --missing pessimistic
          --jobs 2
          --exclude 'tests/**'
          --exclude 'benches/**'
          --exclude 'examples/**'
          --exclude 'src/selector/installation/tests/**'
          --exclude 'src/erasure_tests.rs'
          --exclude 'src/system_bus/tests.rs'
          --exclude 'src/image_activator/tests.rs'
          --exclude 'src/root_attachment/tests.rs'
          --exclude 'src/root_selector/tests/admission_bounds.rs'
          --exclude 'src/selector/installation/fixture.rs'
          --exclude 'src/provider_admission/test_support.rs'
          --exclude 'src/e2e_determinism.rs'
          --exclude 'src/action_admission_tests.rs'
          --exclude 'src/fork_event_authority/tests/local_replay.rs'
          --exclude 'src/sqlite/tests/protected_interval_cleanup.rs'
          --exclude 'src/sqlite/fork_replay/interval_tests.rs'
          --exclude 'src/imported_fork_replay_tests.rs'
          --exclude 'src/imported_fork_replay_tests/lifecycle.rs'
          --exclude 'src/imported_fork_replay_tests/lifecycle/begin.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/compare.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/read_bounds.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/sqlite.rs'
          --exclude 'src/imported_fork_replay_tests/cumulative_budget/sqlite/compare.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget/deadline.rs'
          --exclude 'src/imported_fork_replay_tests/runtime_budget/repeat.rs'
          --exclude 'src/nested_imported_fork_replay_tests.rs'
          --exclude 'src/nested_imported_fork_replay_tests/intermediate_privacy.rs'
          --exclude 'src/ordinary_fork_lineage_tests.rs'
          --exclude 'src/execute/tests/ownership.rs'
          --exclude 'src/provider_barrier/tests.rs'
          --exclude 'src/execute/tests.rs'
          --exclude 'src/attempt_records/tests.rs'
