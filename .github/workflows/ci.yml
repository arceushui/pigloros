# PiglorOS CI — mirrors README Development gates (Redmine #100).
#
# Decisions locked for "perfect" bar:
# - Platform: GitHub Actions (remote is github.com/arceushui/pigloros)
# - Triggers: every PR + pushes to main
# - Jobs: fmt, test, clippy (pedantic), coverage (100% lines + regions), audit, deny — all required
# - coverage(off) test-only + no ```ignore doctests: Trunk `rust-test-policy`
# - Tests: `cargo test -- --include-ignored` so #[ignore] cannot silently skip
# - Dependencies: cargo-deny.yml (crates/licenses/advisories/sources)
# - Coverage: RUSTC_BOOTSTRAP=1 so cfg(coverage_nightly) can enable feature(coverage_attribute).
#   Unnecessary code is deleted/simplified rather than left as dead branches.
# - Runners: ubuntu-latest only (rusqlite bundled; no macOS matrix yet)

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Surface future warnings as errors in CI builds (clippy still has its own -D warnings).
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: test

      - name: cargo test --workspace --locked -- --include-ignored
        run: |
          set -euo pipefail
          cargo test --workspace --locked -- --include-ignored 2>&1 | tee /tmp/cargo-test.log
          bash scripts/assert-no-ignored-in-test-summary.sh /tmp/cargo-test.log

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy

      - name: cargo clippy (pedantic, deny warnings)
        run: >
          cargo clippy --workspace --all-targets --locked --
          -D warnings -W clippy::pedantic

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage

      - name: cargo llvm-cov at-or-near-100pct lines and regions
        run: >
          cargo llvm-cov --workspace --locked --summary-only
          --fail-under-lines 100
          --fail-under-regions 100
          -- --include-ignored

  audit:
    name: cargo-audit (security advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  deny:
    name: cargo-deny (licenses / bans / sources / deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: cargo deny check

  geiger:
    name: cargo-geiger (unsafe code audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
      - name: cargo geiger
        run: cargo geiger --workspace 2>&1 | tee /tmp/geiger.log
      - name: assert no unsafe in own crates
        run: '! grep -E "^(crates|apps|plugins)/" /tmp/geiger.log | grep -v "0 unsafe"'

  asan:
    name: asan (address sanitizer)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: asan
      - name: cargo test with ASan
        env:
          RUSTC_BOOTSTRAP: "1"
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
        run: >
          RUSTFLAGS="-Z sanitizer=address"
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu --workspace --tests

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: pigloros-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        run: |
          docker run --rm -d -p 8080:8080 --name pigloros-smoke pigloros-gateway:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep '"ok":true'
          curl -sf http://localhost:8080/v1/ledger | grep '"domain":"piglor.com"'
          docker stop pigloros-smoke

  modules:
    name: modules-structure (reports only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-modules
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-modules

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: modules

      - name: Module structure reports
        if: always()
        run: |
          mkdir -p artifacts/modules
          for pkg in pos-core pos-crypto pos-store pos-state pos-query pos-time pos-runtime \
            pos-plugin-agent pos-plugin-bridges pos-plugin-eval pos-plugin-geo \
            pos-plugin-ledger pos-plugin-persona pos-plugin-rule-agent \
            pos-plugin-society pos-plugin-synthetic-obs pos-plugin-world \
            piglor-gateway piglor-ledger pos-experiment pos-cli pos-mvp; do
            cargo modules structure -p "$pkg" --lib > "artifacts/modules/${pkg}.txt" 2>/dev/null || true
          done

      - name: Upload module reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: module-structures
          path: artifacts/modules/

  depgraph:
    name: depgraph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install cargo-depgraph
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-depgraph

      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Generate dependency graph
        run: |
          cargo depgraph --all-deps --dedup-transitive-deps \
            --output artifacts/depgraph.svg

      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: depgraph
          path: artifacts/depgraph.svg

