# PiglorOS CI — quality gates enforced for Rust-affecting changes and pushes to main.
#
# Gate policy (Redmine #100):
#   fmt          — cargo fmt --check (rustfmt)
#   rustdoc      — cargo doc with rustdoc warnings denied
#   test         — cargo test --all-features (no ignored tests silently skip)
#   clippy       — pedantic + -D warnings
#   coverage     — lines ≥99%, regions ≥99%
#   cargo-crap   — no CRAP regressions; new functions score ≤30
#   audit        — cargo-audit (CVE advisories)
#   deny         — cargo-deny (licenses, bans, sources)
#   geiger       — no unsafe in own crates
#   asan         — address sanitizer on nightly
#   docker       — image builds and smoke-tests
#   wasm         — world-client WASM contract + browser parity
#
# Implementation notes:
#   RUSTC_BOOTSTRAP=1 in coverage: lets cfg(coverage_nightly) enable
#     feature(coverage_attribute) for #[coverage(off)] on test helpers.
#   coverage(off) is only permitted on #[test]/#[tokio::test]/#[cfg(test)] code
#     (enforced by Trunk rust-test-policy).
#   --include-ignored: ensures #[ignore] tests run in CI; none may silently skip.
#
# Pull requests that change only documentation or other non-Rust content run the
# lightweight scope job plus Trunk/CodeQL policy workflows. Rust build, test,
# coverage, cargo-crap, security, platform, and report jobs are skipped
# successfully. Any Rust, manifest, dependency, script, workflow, or
# build-policy change keeps the complete gate set.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# ── Quality gates ────────────────────────────────────────────────────────────
#
# Fail fast in bounded stages. Pull-request diff and policy checks run before
# any Cargo-heavy work. The four core gates then run together, followed by at
# most eight standard jobs. Mutation and ASan are the final expensive stages.

jobs:

  ci_change_scope:
    name: ci change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust || steps.full.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Detect Rust-affecting changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: scope
        if: github.event_name == 'pull_request' && hashFiles('.github/rust-scope.yml') != ''
        with:
          filters: .github/rust-scope.yml
          predicate-quantifier: some-with-excludes
      - name: Use full scope for non-pull-request events
        id: full
        if: github.event_name != 'pull_request' || hashFiles('.github/rust-scope.yml') == ''
        run: printf 'rust=true\n' >> "$GITHUB_OUTPUT"

  trunk-pr:
    # Keep this display name stable: the main-branch ruleset requires it.
    name: Trunk Code Quality
    needs: ci_change_scope
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install hosted rustfmt for #382 patch collection
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Produce hosted rustfmt patch for #382
        run: |
          rustfmt --edition 2021 \
            apps/pos-sandboxd/src/system_bus.rs \
            apps/pos-sandboxd/src/system_bus/tests.rs
          git diff --binary > /tmp/rustfmt-382.patch
      - name: Upload hosted rustfmt patch for #382
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustfmt-382
          path: /tmp/rustfmt-382.patch
      - name: Trunk Check (pull-request diff)
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0

  preflight-gate:
    name: preflight-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - trunk-pr
      - pinned-dependencies
      - conformance-fixtures
      - conformance-non-linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require fast preflight checks
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          TRUNK_RESULT: ${{ needs.trunk-pr.result }}
          POLICY_RESULT: ${{ needs.pinned-dependencies.result }}
          FIXTURES_RESULT: ${{ needs.conformance-fixtures.result }}
          NON_LINUX_RESULT: ${{ needs.conformance-non-linux.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          test "${FIXTURES_RESULT}" = success
          test "${NON_LINUX_RESULT}" = success
          if [[ "${EVENT_NAME}" = pull_request ]]; then
            test "${TRUNK_RESULT}" = success
          else
            test "${TRUNK_RESULT}" = skipped
          fi
          if [[ "${RUST_SCOPE}" = true ]]; then
            test "${POLICY_RESULT}" = success
          else
            test "${POLICY_RESULT}" = skipped
          fi

  fmt:
    name: fmt
    needs: [ci_change_scope, preflight-gate]
    # preflight-gate intentionally accepts the push-only skip of trunk-pr.
    # always() prevents that optional ancestor from propagating a skip here;
    # the explicit result check still stops the stage after a failed preflight.
    if: ${{ always() && needs.preflight-gate.result == 'success' && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: cargo fmt --check (full repository)
        run: cargo fmt --all -- --check

  rustdoc:
    name: rustdoc
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: rustdoc
      - name: cargo doc (warnings denied)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

  test:
    name: test
    needs: [ci_change_scope, preflight-gate]
    if: ${{ always() && needs.preflight-gate.result == 'success' && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: test
      - name: cargo check (no default features)
        run: cargo check --workspace --all-targets --no-default-features --locked
      - name: cargo check (all features, all targets)
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Prove reference evaluator implementation independence
        run: bash scripts/check-reference-evaluator-independence.sh
      - name: cargo test (all features, no ignored skip)
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked -- --include-ignored 2>&1 | tee /tmp/cargo-test.log
          bash scripts/assert-no-ignored-in-test-summary.sh /tmp/cargo-test.log

  reference-evaluator-release:
    name: reference-evaluator-release
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: reference-evaluator-release
      - name: Install evaluator packaging tools
        run: sudo apt-get update && sudo apt-get install --yes b3sum jq
      - name: Build and verify standalone evaluator release evidence
        run: |
          shadow_directory="${RUNNER_TEMP}/caller-path-shadow"
          mkdir -p "${shadow_directory}"
          for command in b3sum cargo cut dirname env git gzip install jq mkdir mktemp rm rustc rustup sed tar; do
            printf '#!/bin/sh\nexit 99\n' >"${shadow_directory}/${command}"
            chmod 0755 "${shadow_directory}/${command}"
          done
          PATH="${shadow_directory}:${PATH}" /bin/bash \
            scripts/package-reference-evaluator.sh "${RUNNER_TEMP}/reference-evaluator"
      - name: Upload standalone evaluator release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reference-evaluator-${{ github.sha }}
          path: ${{ runner.temp }}/reference-evaluator
          retention-days: 7
          if-no-files-found: error

  conformance-fixtures:
    name: conformance-fixtures
    needs: ci_change_scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install fixture verification tools
        run: sudo apt-get update && sudo apt-get install --yes b3sum jq
      - name: Obtain pinned offline SCS1 derivation inputs
        env:
          SYSTEMD_SCS1_SYSTEMD_SOURCE: ${{ runner.temp }}/systemd-scs1-source
          SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE: ${{ runner.temp }}/libseccomp-2.6.1.tar.gz
        run: |
          git init "$SYSTEMD_SCS1_SYSTEMD_SOURCE"
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" remote add origin https://github.com/systemd/systemd.git
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" fetch --depth=2 origin f1d0952a125b96b7ab2f1ff29a87448ade8ac29b
          git -C "$SYSTEMD_SCS1_SYSTEMD_SOURCE" checkout --detach FETCH_HEAD
          curl --fail --location --retry 3 --max-time 60 \
            https://github.com/seccomp/libseccomp/releases/download/v2.6.1/libseccomp-2.6.1.tar.gz \
            --output "$SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE"
      - name: Reproduce production SCS1 and exercise materializer rejection boundaries
        env:
          SYSTEMD_SCS1_SYSTEMD_SOURCE: ${{ runner.temp }}/systemd-scs1-source
          SYSTEMD_SCS1_LIBSECCOMP_ARCHIVE: ${{ runner.temp }}/libseccomp-2.6.1.tar.gz
        run: python3 scripts/test_materialize_systemd_scs1.py
      - name: Independently regenerate public fixture records
        run: bash scripts/generate-conformance-fixture-records.sh
      - name: Verify public conformance fixtures
        run: bash scripts/verify-conformance-fixtures.sh
      - name: Exercise conformance fixture rejection boundaries
        run: bash scripts/test-conformance-fixture-validation.sh

  materialize-conformance-bundles:
    name: materialize-conformance-bundles
    needs:
      - ci_change_scope
      - conformance-fixtures
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.conformance-fixtures.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: conformance-materialization
      - name: Install fixture verification tools
        run: sudo apt-get update && sudo apt-get install --yes b3sum jq
      - name: Reject non-main manual artifact publication
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main' }}
        run: |
          set -euo pipefail
          echo 'repository Draft artifact publication is only permitted from main' >&2
          exit 1
      - name: Materialize repository-only Draft CPF1 verification bundles
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        env:
          # Public deterministic fixture key. The declared Draft authority is
          # repository-test-fixture-only and is never a deployment trust root.
          PIGLOROS_CONFORMANCE_SIGNING_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
        run: bash scripts/materialize-conformance-bundles.sh
      - name: Materialize repository-only Draft bundles for pull-request verification
        if: ${{ github.event_name == 'pull_request' }}
        env:
          # Same public deterministic fixture key used for main verification;
          # these signatures prove fixture consistency, not publisher identity.
          PIGLOROS_CONFORMANCE_SIGNING_KEY: "0707070707070707070707070707070707070707070707070707070707070707"
        run: |
          mkdir -- "${RUNNER_TEMP}/conformance-draft"
          bash scripts/materialize-conformance-bundles.sh "${RUNNER_TEMP}/conformance-draft"
      - name: Exercise build-time fixture rejection boundary
        run: bash scripts/test-conformance-build-validation.sh
      - name: Materialize Sandbox Provider public vectors
        env:
          SANDBOX_PROVIDER_VECTOR_OUTPUT: ${{ runner.temp }}/sandbox-provider-v1
        run: |
          cargo test --locked -p pos-conformance --test sandbox_provider_contract_public
          cargo test --locked -p pos-conformance --test profile_contract_public
      - name: Upload Sandbox Provider public vectors
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-provider-v1-${{ github.sha }}
          path: ${{ runner.temp }}/sandbox-provider-v1
          retention-days: 7
          if-no-files-found: warn
      - name: Upload main-branch Draft verification artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-bundles-${{ github.sha }}
          path: fixtures/conformance/published
          retention-days: 7
          if-no-files-found: error
      - name: Upload pull-request Draft verification artifact
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: conformance-bundles-pr-draft-${{ github.sha }}
          path: ${{ runner.temp }}/conformance-draft
          retention-days: 7
          if-no-files-found: error

  conformance-non-linux:
    name: conformance-non-linux
    needs: ci_change_scope
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: conformance-non-linux
      - name: Enforce the Linux-only secure fixture-generation boundary
        run: |
          set +e
          cargo check -p pos-conformance --locked 2>&1 | tee "${RUNNER_TEMP}/conformance-non-linux.log"
          status="${PIPESTATUS[0]}"
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "non-Linux conformance build unexpectedly succeeded" >&2
            exit 1
          fi
          grep --fixed-strings \
            "secure conformance fixture snapshot generation requires Linux openat2" \
            "${RUNNER_TEMP}/conformance-non-linux.log"

  clippy:
    name: clippy
    needs: [ci_change_scope, preflight-gate]
    if: ${{ always() && needs.preflight-gate.result == 'success' && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: clippy
      - name: Reject new lint suppressions
        run: bash scripts/check-no-new-lint-suppressions.sh origin/main
      - name: cargo clippy (workspace lint policy, pedantic, deny warnings)
        run: >
          cargo clippy --workspace --all-features --all-targets --locked --
          -D warnings -W clippy::pedantic

  coverage:
    name: coverage
    needs: [ci_change_scope, preflight-gate]
    if: ${{ always() && needs.preflight-gate.result == 'success' && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: "1"
      # Keep instrumentation bounded on the hosted runner; local runs may use
      # substantially more memory when compiling the Bevy workspace.
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov
      - name: Install covgate
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: covgate@0.2.0
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: coverage
      # Generate one complete report, then let covgate check the changed
      # production diff before spending time on the repository-wide floor.
      - name: Generate coverage report for changed-code gate
        run: >
          cargo llvm-cov --workspace --all-features --locked
          --json --output-path "${{ runner.temp }}/coverage.json"
          -- --include-ignored
      - name: Enforce changed production Rust code coverage first
        run: >
          covgate check "${{ runner.temp }}/coverage.json"
          --base "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'origin/main' }}"
          --no-github-summary
      - name: Enforce workspace coverage floor
        run: >
          cargo llvm-cov report --json --summary-only --show-missing-lines
          --fail-under-lines 99
          --fail-under-regions 99
      - name: Export LCOV for cargo-crap
        run: cargo llvm-cov report --lcov
          --output-path "${{ runner.temp }}/coverage.lcov"
      - name: Upload LCOV for cargo-crap
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov-${{ github.sha }}
          path: ${{ runner.temp }}/coverage.lcov
          retention-days: 1
          if-no-files-found: error

  core-gate:
    name: core-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - preflight-gate
      - fmt
      - test
      - clippy
      - coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require fmt, test, clippy, and coverage
        env:
          SCOPE_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          PREFLIGHT_RESULT: ${{ needs.preflight-gate.result }}
          FMT_RESULT: ${{ needs.fmt.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CLIPPY_RESULT: ${{ needs.clippy.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          set -euo pipefail
          test "${SCOPE_RESULT}" = success
          test "${PREFLIGHT_RESULT}" = success
          expected=success
          if [[ "${RUST_SCOPE}" = false ]]; then
            expected=skipped
          fi
          test "${FMT_RESULT}" = "${expected}"
          test "${TEST_RESULT}" = "${expected}"
          test "${CLIPPY_RESULT}" = "${expected}"
          test "${COVERAGE_RESULT}" = "${expected}"

  cargo-crap:
    name: cargo-crap
    needs:
      - ci_change_scope
      - coverage
      - core-gate
    # The push-only Trunk skip is an accepted preflight ancestor. Evaluate the
    # explicit direct dependencies instead of inheriting that skipped state.
    if: ${{ always() && needs.core-gate.result == 'success' && needs.coverage.result == 'success' && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Install cargo-crap
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-crap@0.2.2
      - name: Download hosted LCOV
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-lcov-${{ github.sha }}
          path: ${{ runner.temp }}
      - name: Reject repository cargo-crap configuration
        run: test ! -e .cargo-crap.toml
      - name: Resolve trusted cargo-crap baseline
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/resolve_cargo_crap_baseline.sh
      - name: Download trusted base baseline
        if: ${{ steps.baseline.outputs.run-id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cargo-crap-baseline-${{ steps.baseline.outputs.baseline-sha }}
          path: ${{ runner.temp }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline.outputs.run-id }}
      - name: Generate trusted current baseline
        if: ${{ steps.baseline.outputs.bootstrap == 'true' }}
        run: >
          cargo crap --workspace
          --lcov "${{ runner.temp }}/coverage.lcov"
          --missing pessimistic
          --jobs 2
          --exclude 'tests/**'
          --exclude 'benches/**'
          --exclude 'examples/**'
          --exclude 'src/selector/installation/tests/**'
          --exclude 'src/erasure_tests.rs'
          --exclude 'src/system_bus/tests.rs'
          --format json
          --output "${{ runner.temp }}/cargo-crap-baseline.json"
      - name: Analyze CRAP score changes
        run: >
          cargo crap --workspace
          --lcov "${{ runner.temp }}/coverage.lcov"
          --missing pessimistic
          --jobs 2
          --exclude 'tests/**'
          --exclude 'benches/**'
          --exclude 'examples/**'
          --exclude 'src/selector/installation/tests/**'
          --exclude 'src/erasure_tests.rs'
          --exclude 'src/system_bus/tests.rs'
          --baseline "${{ runner.temp }}/cargo-crap-baseline.json"
          --epsilon 0
          --format json
          --output "${{ runner.temp }}/cargo-crap-report.json"
      - name: Enforce cargo-crap policy
        run: python scripts/check_cargo_crap_report.py
          "${{ runner.temp }}/cargo-crap-report.json"
      - name: Upload cargo-crap report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-crap-report-${{ github.sha }}
          path: ${{ runner.temp }}/cargo-crap-report.json
          if-no-files-found: ignore
      - name: Publish trusted main baseline
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-crap-baseline-${{ github.sha }}
          path: ${{ runner.temp }}/cargo-crap-baseline.json
          retention-days: 90
          if-no-files-found: error

# ── Security & compliance ────────────────────────────────────────────────────

  audit:
    name: dependency-policy (audit / deny / shear)
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
      - name: Install cargo-deny
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-shear
      - name: cargo shear (strict)
        run: cargo shear --deny-warnings

  geiger:
    name: cargo-geiger (unsafe code audit)
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-geiger
      - name: cargo geiger (assert no unsafe in own crates)
        run: bash scripts/check-geiger.sh

  codeql:
    name: CodeQL (Rust)
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    permissions:
      actions: read
      contents: read
      pull-requests: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  # Reusable-workflow checks are reported as "caller / callee". Preserve the
  # stable status context required by the main-branch ruleset.
  codeql-required:
    name: CodeQL (Rust)
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required CodeQL status
        env:
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
        run: |
          expected=success
          if [[ "${RUST_SCOPE}" = false ]]; then
            expected=skipped
          fi
          test "${CODEQL_RESULT}" = "${expected}"

# ── Platform verification ────────────────────────────────────────────────────

  asan:
    name: asan shard (${{ matrix.shard }})
    needs:
      - ci_change_scope
      - standard-gate
      - mutation-checks
    if: ${{ always() && needs.standard-gate.result == 'success' && (needs.mutation-checks.result == 'success' || needs.mutation-checks.result == 'skipped') && (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard:
          - bundle-coverage
          - bundle-public-1
          - bundle-public-2
          - moat-proof
          - remainder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - name: Install cargo-nextest for partitioned public bundle tests
        if: ${{ startsWith(matrix.shard, 'bundle-public-') }}
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-nextest
      - name: Verify ASan symbolizer
        run: |
          symbolizer="/usr/bin/llvm-symbolizer-18"
          test -x "${symbolizer}"
          symbolizer_version="$("${symbolizer}" --version)"
          grep -Fqx "Ubuntu LLVM version 18.1.3" <<<"${symbolizer_version}"
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: asan-nightly-2026-07-01
      - name: Prove unrelated leaks still fail LSan
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
        run: |
          set -euo pipefail
          binary="${RUNNER_TEMP}/asan-intentional-leak"
          log="${RUNNER_TEMP}/asan-intentional-leak.log"
          trap 'rm -f "${binary}" "${log}"' EXIT
          rustc +nightly-2026-07-01 -Z sanitizer=address -C debuginfo=1 \
            --target x86_64-unknown-linux-gnu \
            scripts/asan/intentional-leak.rs -o "${binary}"
          set +e
          ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
            "${binary}" 2>&1 | tee "${log}"
          status=${PIPESTATUS[0]}
          set -e
          test "${status}" -ne 0
          grep -Fqx "SUMMARY: AddressSanitizer: 1234 byte(s) leaked in 1 allocation(s)." "${log}"
          ! grep -F "Suppressions used:" "${log}"
          ! grep -F "bevy_reflect::utility::GenericTypeCell" "${log}"
      - name: cargo test with ASan
        env:
          ASAN_SHARD: ${{ matrix.shard }}
          RUSTC_BOOTSTRAP: "1"
          ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
          CARGO_BUILD_JOBS: "1"
          RUST_TEST_THREADS: "2"
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
        run: |
          set -euo pipefail
          test -x "/usr/bin/llvm-symbolizer-18"
          cargo_args=(
            +nightly-2026-07-01 test --all-features --locked -Z build-std
            --target x86_64-unknown-linux-gnu
          )
          nextest_args=(
            +nightly-2026-07-01 nextest run --all-features --locked -Z build-std
            --target x86_64-unknown-linux-gnu
          )
          run_asan_tests() {
            ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
              RUSTFLAGS="-Z sanitizer=address" \
              cargo "${cargo_args[@]}" "$@"
          }
          run_asan_partition() {
            ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
              RUSTFLAGS="-Z sanitizer=address" \
              cargo "${nextest_args[@]}" "$@"
          }
          case "${ASAN_SHARD}" in
            bundle-coverage)
              run_asan_tests -p pos-conformance \
                --test bundle_contract_coverage_public
              ;;
            bundle-public-1)
              run_asan_partition -p pos-conformance \
                --test bundle_contract_public \
                --partition slice:1/2 --run-ignored all --test-threads 2
              ;;
            bundle-public-2)
              run_asan_partition -p pos-conformance \
                --test bundle_contract_public \
                --partition slice:2/2 --run-ignored all --test-threads 2
              ;;
            moat-proof)
              run_asan_tests -p pos-conformance \
                --test moat_proof_public
              ;;
            remainder)
              run_asan_tests --workspace --exclude pos-conformance --tests
              run_asan_tests -p pos-conformance --lib --bins \
                --test profile_contract_public \
                --test provider_contract_public
              ;;
            *)
              printf 'unknown ASan shard: %s\n' "${ASAN_SHARD}" >&2
              exit 2
              ;;
          esac 2>&1 | tee "${RUNNER_TEMP}/asan.log"
          python scripts/check_lsan_suppression_report.py "${RUNNER_TEMP}/asan.log"

  asan-gate:
    name: asan (address sanitizer)
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - asan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every ASan shard
        env:
          SCOPE_JOB_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE_RESULT: ${{ needs.ci_change_scope.outputs.rust }}
          ASAN_SHARDS_RESULT: ${{ needs.asan.result }}
        run: |
          set -euo pipefail
          if [[ "${SCOPE_JOB_RESULT}" == "success" \
            && "${RUST_SCOPE_RESULT}" == "false" \
            && "${ASAN_SHARDS_RESULT}" == "skipped" ]]; then
            exit 0
          fi
          test "${ASAN_SHARDS_RESULT}" = success

  docker-build:
    name: docker-build
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: pigloros-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test container
        run: |
          docker run --rm -d -p 8080:8080 --name pigloros-smoke pigloros-gateway:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep '"ok":true'
          ledger_json="$(curl -sf http://localhost:8080/v1/ledger)"
          printf '%s\n' "$ledger_json" | grep '"domain":"piglor.com"'
          printf '%s\n' "$ledger_json" | grep '"ledger":\[\]'
          docker stop pigloros-smoke

  world-client-wasm:
    name: world-client-wasm
    needs:
      - ci_change_scope
      - cargo-crap
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.cargo-crap.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack@0.15.0
      - name: Check world-client WASM contract
        run: bash scripts/test-check-world-client-wasm.sh
      - name: Check world-client WASM packaging
        run: bash scripts/check-world-client-wasm.sh package

  world-client-browser-parity:
    name: world-client-browser-parity
    needs:
      - ci_change_scope
      - world-client-wasm
    if: >-
      ${{ always() && needs.ci_change_scope.result == 'success' &&
      needs.world-client-wasm.result == 'success' &&
      (needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: wasm-pack@0.15.0
      - id: setup-chrome
        uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        with:
          chrome-version: 151.0.7922.47
          install-chromedriver: true
      - name: Configure Chrome binary for wasm-bindgen
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
          WEBDRIVER_CONFIG: ${{ runner.temp }}/world-client-webdriver.json
        run: >
          jq -n --arg binary "$CHROME_PATH"
          '{"goog:chromeOptions": {"binary": $binary}}' > "$WEBDRIVER_CONFIG"
      - name: Check world-client browser parity
        env:
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/world-client-webdriver.json
        run: bash scripts/check-world-client-wasm.sh browser

  standard-gate:
    name: standard-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - core-gate
      - cargo-crap
      - rustdoc
      - reference-evaluator-release
      - materialize-conformance-bundles
      - audit
      - geiger
      - codeql
      - docker-build
      - world-client-wasm
      - world-client-browser-parity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require normal blocking checks
        env:
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          CORE_RESULT: ${{ needs.core-gate.result }}
          CARGO_CRAP_RESULT: ${{ needs.cargo-crap.result }}
          RUSTDOC_RESULT: ${{ needs.rustdoc.result }}
          REFERENCE_RESULT: ${{ needs.reference-evaluator-release.result }}
          MATERIALIZE_RESULT: ${{ needs.materialize-conformance-bundles.result }}
          DEPENDENCY_RESULT: ${{ needs.audit.result }}
          GEIGER_RESULT: ${{ needs.geiger.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          DOCKER_RESULT: ${{ needs.docker-build.result }}
          WASM_RESULT: ${{ needs.world-client-wasm.result }}
          BROWSER_RESULT: ${{ needs.world-client-browser-parity.result }}
        run: |
          set -euo pipefail
          test "${CORE_RESULT}" = success
          expected=success
          if [[ "${RUST_SCOPE}" = false ]]; then
            expected=skipped
          fi
          for result in \
            "${CARGO_CRAP_RESULT}" "${RUSTDOC_RESULT}" "${REFERENCE_RESULT}" \
            "${MATERIALIZE_RESULT}" "${DEPENDENCY_RESULT}" "${GEIGER_RESULT}" \
            "${CODEQL_RESULT}" "${DOCKER_RESULT}" "${WASM_RESULT}" "${BROWSER_RESULT}"; do
            test "${result}" = "${expected}"
          done

  mutation-checks:
    name: diff mutation testing
    needs:
      - ci_change_scope
      - standard-gate
    if: ${{ github.event_name == 'pull_request' && needs.ci_change_scope.outputs.rust == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/mutation.yml

  # See codeql-required: retain the pre-existing ruleset context while the
  # implementation runs as a staged reusable workflow.
  mutation-required:
    name: diff mutation testing
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - mutation-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report the required mutation status
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUST_SCOPE: ${{ needs.ci_change_scope.outputs.rust }}
          MUTATION_RESULT: ${{ needs.mutation-checks.result }}
        run: |
          expected=skipped
          if [[ "${EVENT_NAME}" = pull_request && "${RUST_SCOPE}" = true ]]; then
            expected=success
          fi
          test "${MUTATION_RESULT}" = "${expected}"

# ── Informational reports (non-blocking) ────────────────────────────────────

  pinned-dependencies:
    name: pinned-dependencies
    needs: ci_change_scope
    if: ${{ needs.ci_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: 3.12.11
      - name: Install pinned dependency checker
        run: >
          python -m pip install --require-hashes --only-binary=:all:
          --requirement requirements-pinned-dependencies.txt
      - name: Check immutable Action and Docker references
        run: bash scripts/check-pinned-dependencies.sh
      - name: Test pinned dependency checker
        run: bash scripts/test-check-pinned-dependencies.sh
      - name: Test Rust scope filter policy
        run: python scripts/test_rust_scope_policy.py
      - name: Check ASan CI policy
        run: bash scripts/check-asan-ci-policy.sh
      - name: Test ASan CI policy checker
        run: |
          python scripts/test_check_asan_ci_policy.py
          python scripts/test_check_lsan_suppression_report.py
      - name: Check delegated isolated-test policy
        run: |
          python scripts/check_isolated_test_runner_policy.py
          python scripts/test_check_isolated_test_runner_policy.py
      - name: Check cargo-crap CI policy
        run: python scripts/check_cargo_crap_ci_policy.py
      - name: Test cargo-crap policy checkers
        run: |
          python scripts/test_check_cargo_crap_ci_policy.py
          python scripts/test_check_cargo_crap_report.py

  modules-structure:
    name: modules-structure (reports only)
    needs: standard-gate
    if: ${{ github.event_name != 'pull_request' && needs.standard-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-modules
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-modules
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: modules
      - name: Module structure reports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p artifacts/modules
          for pkg in pos-core pos-crypto pos-store pos-state pos-query pos-time pos-runtime \
            pos-plugin-agent pos-plugin-bridges pos-plugin-eval pos-plugin-geo \
            pos-plugin-ledger pos-plugin-persona pos-plugin-rule-agent \
            pos-plugin-society pos-plugin-synthetic-obs pos-plugin-world \
            piglor-gateway piglor-ledger pos-experiment pos-cli; do
            cargo modules structure -p "$pkg" --lib > "artifacts/modules/${pkg}.txt" 2>/dev/null || true
          done
      - name: Upload module reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: module-structures
          path: artifacts/modules/

  depgraph:
    name: depgraph
    needs: standard-gate
    if: ${{ github.event_name != 'pull_request' && needs.standard-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1

      - name: Install cargo-depgraph
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-depgraph
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Generate dependency graph
        run: |
          mkdir -p artifacts
          cargo depgraph --locked --all-deps --dedup-transitive-deps > artifacts/depgraph.svg
      - name: Upload dependency graph
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: depgraph
          path: artifacts/depgraph.svg

  # One stable fan-in covers every staged blocking check. Individual jobs and
  # shards are implementation details, not independent merge approvals.
  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - ci_change_scope
      - preflight-gate
      - core-gate
      - standard-gate
      - mutation-checks
      - asan-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every blocking CI job to pass
        env:
          SCOPE_JOB_RESULT: ${{ needs.ci_change_scope.result }}
          RUST_SCOPE_RESULT: ${{ needs.ci_change_scope.outputs.rust }}
          EVENT_NAME: ${{ github.event_name }}
          PREFLIGHT_RESULT: ${{ needs.preflight-gate.result }}
          CORE_RESULT: ${{ needs.core-gate.result }}
          STANDARD_RESULT: ${{ needs.standard-gate.result }}
          MUTATION_RESULT: ${{ needs.mutation-checks.result }}
          ASAN_RESULT: ${{ needs.asan-gate.result }}
        run: |
          set -euo pipefail
          failed=0
          if [[ "${SCOPE_JOB_RESULT}" != "success" ]]; then
            echo "SCOPE_JOB_RESULT=${SCOPE_JOB_RESULT}" >&2
            failed=1
          fi

          for result_name in PREFLIGHT_RESULT CORE_RESULT STANDARD_RESULT ASAN_RESULT; do
            result="${!result_name}"
            if [[ "${result}" != success ]]; then
              echo "${result_name}=${result}" >&2
              failed=1
            fi
          done

          expected_mutation=skipped
          if [[ "${EVENT_NAME}" = pull_request && "${RUST_SCOPE_RESULT}" = true ]]; then
            expected_mutation=success
          fi
          if [[ "${MUTATION_RESULT}" != "${expected_mutation}" ]]; then
            echo "MUTATION_RESULT=${MUTATION_RESULT}" >&2
            failed=1
          fi

          exit "${failed}"
