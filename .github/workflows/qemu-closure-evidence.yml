name: qemu-closure-evidence

# #444 parts (a) and (b), ADR-087 gate 5: boot the pinned NixOS 26.05 closure
# once per architecture under QEMU TCG on GitHub-hosted runners, record its
# packaged kernel, keyring and mountfsd state, and run the real MountImage,
# readback, failure-closure and cleanup cases through the production
# activation path. CI uses the public dev/test trust domain; the release
# signing key stays offline (ADR-087 Part C.4).

on:
  pull_request:
    paths:
      - .github/workflows/qemu-closure-evidence.yml
      - deploy/nixos/**
      # The guest's part (b) driver and the crates it compiles.
      - Cargo.lock
      - Cargo.toml
      - apps/pos-sandbox-evidence-adapter/**
      - apps/pos-sandboxd/**
      - crates/pos-reference/**
      - fixtures/conformance/**
      - scripts/check_qemu_closure_evidence.py
      - scripts/test_check_qemu_closure_evidence.py
      - scripts/check_qemu_closure_workflow_policy.py
      - scripts/test_check_qemu_closure_workflow_policy.py
      - scripts/check_asan_ci_policy.py
      - scripts/ci_stage_policy.py
      - scripts/check_owner_runtime_custody_policy.py
      - scripts/install-pinned-nix.sh
      - scripts/qemu-closure-evidence.sh
      - scripts/qemu_qmp_query_kvm.py
      - scripts/test_qemu_closure_evidence_producer.py
      - scripts/qemu-kernel-cache.sh
  # Main publishes the signed kernel cache that pull requests fetch whenever
  # the kernel's inputs change. Release assets are never evicted, so no
  # scheduled refresh is needed.
  push:
    branches: [main]
    paths:
      - .github/workflows/qemu-closure-evidence.yml
      - deploy/nixos/**
      - scripts/install-pinned-nix.sh
      - scripts/qemu-kernel-cache.sh

permissions:
  contents: read

concurrency:
  group: qemu-closure-evidence-${{ github.ref }}
  # A newer push supersedes a pull request run; a main kernel build always
  # finishes, so its cache is published.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enforce the evidence workflow and producer pins
        run: python scripts/check_qemu_closure_workflow_policy.py
      - name: Test the evidence workflow policy
        run: python scripts/test_check_qemu_closure_workflow_policy.py
      - name: Test the evidence checker
        run: python scripts/test_check_qemu_closure_evidence.py
      - name: Test the evidence producer
        run: python scripts/test_qemu_closure_evidence_producer.py

  evidence:
    name: evidence (${{ matrix.architecture }})
    needs: policy
    # The evidence binds the pull request's merge commit and head.
    if: ${{ github.event_name == 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    # The packaged kernel is rebuilt from source with the dev/test certificate.
    timeout-minutes: 345
    env:
      EVIDENCE_ARCHITECTURE: ${{ matrix.architecture }}
      EVIDENCE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &sdk-headroom
        name: Reclaim unused SDK headroom
        if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          printf 'CI SDK headroom before (bytes)\n'
          df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          printf 'CI SDK headroom before (inodes)\n'
          df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          ci_root_device="$(stat -c '%d' -- /)"
          for ci_sdk_path in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
            if [[ ! -e "${ci_sdk_path}" && ! -L "${ci_sdk_path}" ]]; then
              printf 'CI SDK absent: %s\n' "${ci_sdk_path}"
              continue
            fi
            printf 'CI SDK candidate: %s\n' "${ci_sdk_path}"
            test -d "${ci_sdk_path}"
            test ! -L "${ci_sdk_path}"
            test "$(readlink -e -- "${ci_sdk_path}")" = "${ci_sdk_path}"
            ci_sdk_device="$(stat -c '%d' -- "${ci_sdk_path}")"
            printf 'CI SDK device: %s root=%s sdk=%s\n' "${ci_sdk_path}" "${ci_root_device}" "${ci_sdk_device}"
            test "${ci_sdk_device}" = "${ci_root_device}"
            sudo du -sx -B1 -- "${ci_sdk_path}"
            sudo rm -rf --one-file-system -- "${ci_sdk_path}"
            printf 'CI SDK removed: %s\n' "${ci_sdk_path}"
          done
          printf 'CI SDK headroom after (bytes)\n'
          df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
          printf 'CI SDK headroom after (inodes)\n'
          df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
      - name: Install the hash-pinned Nix release
        run: bash scripts/install-pinned-nix.sh
      # Exact kernel derivation only: a different kernel builds from source,
      # and so does a failed download.
      - name: Fetch the signed kernel built on main
        id: kernel-cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! bash scripts/qemu-kernel-cache.sh fetch "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache" >>"${GITHUB_OUTPUT}"; then
            echo '::warning::qemu-kernel-cache fetch failed: building the kernel from source.'
            echo 'hit=false' >>"${GITHUB_OUTPUT}"
          fi
      - name: Note a kernel cache miss
        if: ${{ steps.kernel-cache.outputs.hit != 'true' }}
        run: echo 'qemu-kernel-cache miss, so the kernel is built from source.' >>"${GITHUB_STEP_SUMMARY}"
      # The daemon still checks every signature. An entry it refuses leaves
      # the store unchanged, and the next step builds the kernel from source.
      - name: Import the signed kernel
        if: ${{ steps.kernel-cache.outputs.hit == 'true' }}
        run: |
          if ! bash scripts/qemu-kernel-cache.sh import "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache"; then
            echo '::warning::qemu-kernel-cache refused: building the kernel from source.'
            echo 'qemu-kernel-cache refused: the kernel was built from source.' >>"${GITHUB_STEP_SUMMARY}"
          fi
      - name: Build the pinned guest and record its store identities
        run: bash scripts/qemu-closure-evidence.sh build "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-closure-evidence"
      - name: Boot the guest under QEMU TCG without network
        run: bash scripts/qemu-closure-evidence.sh boot "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-closure-evidence"
      - name: Check the recorded evidence
        run: >
          python scripts/check_qemu_closure_evidence.py
          --architecture "${EVIDENCE_ARCHITECTURE}"
          --certificate deploy/nixos/dev-trust/root-hash-dev-test.crt
          --untrusted-certificate deploy/nixos/dev-trust/root-hash-untrusted-dev-test.crt
          --flake-lock deploy/nixos/flake.lock
          --verdict "${RUNNER_TEMP}/qemu-closure-evidence/checker-verdict.json"
          "${RUNNER_TEMP}/qemu-closure-evidence"
      - name: Hash every evidence file
        run: bash scripts/qemu-closure-evidence.sh seal "${RUNNER_TEMP}/qemu-closure-evidence"
      - name: Publish the hashed evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-closure-evidence-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/qemu-closure-evidence/
          if-no-files-found: error
          retention-days: 90
      - name: Retain failed-run diagnostics, which are not evidence
        if: ${{ !success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-closure-diagnostics-${{ matrix.architecture }}-${{ github.sha }}
          path: ${{ runner.temp }}/qemu-closure-evidence/
          if-no-files-found: ignore
          retention-days: 7

  # Runs the cache's signing, verifying and import code with a throwaway key,
  # so a pull request exercises the real Nix commands that main uses.
  kernel-cache-selftest:
    name: kernel cache self-test
    needs: policy
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the hash-pinned Nix release
        run: bash scripts/install-pinned-nix.sh
      - name: Sign, verify and import a throwaway path
        run: bash scripts/qemu-kernel-cache.sh selftest "${RUNNER_TEMP}/qemu-kernel-cache-selftest"

  # Builds the guest kernel once per kernel derivation on main, signs it with
  # the main-only key and publishes it as a release asset for pull requests
  # (scripts/qemu-kernel-cache.sh). The qemu-kernel-cache environment allows
  # only main to deploy; that is a repository setting this workflow's policy
  # oracle cannot read. Only this job may write the release.
  kernel-cache:
    name: kernel cache
    needs: policy
    if: ${{ github.event_name != 'pull_request' }}
    environment: qemu-kernel-cache
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 345
    env:
      EVIDENCE_ARCHITECTURE: ${{ matrix.architecture }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *sdk-headroom
      - name: Install the hash-pinned Nix release
        run: bash scripts/install-pinned-nix.sh
      # A full download, so a hit is verified: an asset that is not intact and
      # signed by the trusted key fails this job on main until it is deleted.
      - name: Fetch the published kernel
        id: kernel-fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/qemu-kernel-cache.sh fetch "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache" >>"${GITHUB_OUTPUT}"
      - name: Verify the published kernel
        if: ${{ steps.kernel-fetch.outputs.hit == 'true' }}
        run: bash scripts/qemu-kernel-cache.sh verify "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache"
      - name: Build the kernel
        if: ${{ steps.kernel-fetch.outputs.hit != 'true' }}
        run: bash scripts/qemu-kernel-cache.sh build "${EVIDENCE_ARCHITECTURE}"
      - name: Sign the kernel
        if: ${{ steps.kernel-fetch.outputs.hit != 'true' }}
        env:
          QEMU_KERNEL_CACHE_SIGNING_KEY: ${{ secrets.QEMU_KERNEL_CACHE_SIGNING_KEY }}
        run: bash scripts/qemu-kernel-cache.sh export "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache"
      - name: Publish the signed kernel
        if: ${{ steps.kernel-fetch.outputs.hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/qemu-kernel-cache.sh publish "${EVIDENCE_ARCHITECTURE}" "${RUNNER_TEMP}/qemu-kernel-cache"
      # Every run, so a failed deletion is retried on the next one.
      - name: Prune week-old kernel assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/qemu-kernel-cache.sh prune "${EVIDENCE_ARCHITECTURE}"
