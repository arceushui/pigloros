# Throwaway pre-acceptance evidence for Proposed ADR-084/ADR-085.
# This workflow and its prototype remain on an unmerged branch.
name: adr084-podman-feasibility

on:
  push:
    branches:
      - codex/adr084-podman-feasibility
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adr084-podman-feasibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Podman feasibility (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.architecture }}-unknown-linux-musl
          components: llvm-tools-preview
      - name: Install pinned cargo-llvm-cov for throwaway ADR-079 evidence
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-llvm-cov@0.9.0
      - name: Install distribution probe dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf automake b3sum binutils-arm-linux-gnueabihf build-essential crun gperf jq libtool \
            musl-tools podman python3-cbor2 python3-cryptography python3-z3
          probe_user="$(id -un)"
          if ! grep -q "^${probe_user}:" /etc/subuid; then
            sudo usermod --add-subuids 100000-165535 "${probe_user}"
          fi
          if ! grep -q "^${probe_user}:" /etc/subgid; then
            sudo usermod --add-subgids 100000-165535 "${probe_user}"
          fi
      - name: Run throwaway Podman feasibility probe
        run: bash prototypes/adr084-podman-feasibility/run.sh
      - name: Upload durable raw evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr084-podman-feasibility-${{ matrix.architecture }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/adr084-podman-feasibility/
          if-no-files-found: error
          retention-days: 90
