name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface-models:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Verify source and lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          $sourceHead = 'f4755449f4e9101239a2deff8f5e679593ff8a87'
          $changed = @(git diff --name-only $sourceHead HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/owner-bridge-windows.yml') { throw 'Unexpected diagnostic source differences' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/surface/mod.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/surface/tests/fault_admission.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/surface/tests/fault_states.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/surface/tests/native.rs
          cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Run Surface models and export diagnostic coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- adapter::surface::tests:: --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Surface model tests failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/surface-models.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'LCOV export failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/surface-models.json"
          if ($LASTEXITCODE -ne 0) { throw 'JSON export failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: surface-models-json-lcov
          path: |
            ${{ runner.temp }}/surface-models.lcov
            ${{ runner.temp }}/surface-models.json
