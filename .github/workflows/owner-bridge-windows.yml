name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Lint diagnostic native packages
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Sample distinct native boundaries
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests/process_fault.rs
          Write-Output 'Diagnostic-only observations; no full matrix, G3, coverage, or qualification claim'
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::native_tests::process_fault::diagnostic_882_early_renderer_pairs --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Paired renderer diagnostic failed' }
