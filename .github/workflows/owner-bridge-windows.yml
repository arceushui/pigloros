name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - name: Test delayed receipt observation
        run: cargo test -p pos-owner-bridge --all-features --locked --test protocol first_receipt_timestamp_follows_completed_state_read -- --include-ignored --nocapture
