name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Run complete original lifecycle and G3
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests/readiness.rs
          git rev-parse HEAD:crates/pos-owner-bridge/src/ceremony/driver.rs
          Write-Output 'Selected original full lifecycle and G3; diagnostic only, not full CI or coverage qualification'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_window_environment_and_buffers_lifecycle --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Original lifecycle or G3 failed' }
  process-fault-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Run complete original process-fault function
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests/process_fault.rs
          git rev-parse HEAD:crates/pos-owner-bridge/src/ceremony/driver.rs
          Write-Output 'Selected original full process-fault function; diagnostic only, not full CI or coverage qualification'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_verified_owned_process_faults_retire --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Original process-fault function failed' }
