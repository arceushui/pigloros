name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic Ubuntu archive transport
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Observe archive hostname resolution
        run: |
          set -u
          for archive_host in azure.archive.ubuntu.com archive.ubuntu.com security.ubuntu.com mirrors.edge.kernel.org; do
            printf 'APT_DIAGNOSTIC hostname=%s\n' "$archive_host"
            timeout 15 getent ahostsv4 "$archive_host" || true
          done
      - name: Use the Ubuntu kernel.org mirror for the isolated install probe
        run: |
          set -euo pipefail
          sudo python3 - <<'PY'
          from pathlib import Path
          changed = []
          paths = [Path('/etc/apt/sources.list')]
          paths.extend(Path('/etc/apt/sources.list.d').glob('*.sources'))
          paths.extend(Path('/etc/apt/sources.list.d').glob('*.list'))
          for path in paths:
              if not path.is_file():
                  continue
              original = path.read_text()
              updated = original.replace('mirror+file:/etc/apt/apt-mirrors.txt', 'https://mirrors.edge.kernel.org/ubuntu')
              updated = updated.replace('mirror+file:/etc/apt/apt-security-mirrors.txt', 'https://mirrors.edge.kernel.org/ubuntu')
              if updated != original:
                  path.write_text(updated)
                  changed.append(str(path))
          if not changed:
              raise SystemExit('Expected hosted Ubuntu mirror source was absent')
          print('APT_DIAGNOSTIC changed_sources', changed)
          PY
          sudo apt-get update
          sudo apt-get install -y b3sum jq
          b3sum --version
          jq --version
