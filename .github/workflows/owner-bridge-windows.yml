name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic model and fresh-session cases
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare retained runtime for diagnostic fixtures
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: DIAGNOSTIC Surface and witness models and three fresh-session samples
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Output 'DIAGNOSTIC_ONLY full qualification and coverage remain separate required gates'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output $checkout
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib adapter::surface::tests -- --include-ignored --nocapture --test-threads=1
          $modelResult = $LASTEXITCODE
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib tests::native_api -- --include-ignored --nocapture --test-threads=1
          $apiResult = $LASTEXITCODE
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib modeled_callback_witnesses_bound_repeated_observations_and_reset -- --include-ignored --nocapture --test-threads=1
          $witnessResult = $LASTEXITCODE
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib ffi:: -- --include-ignored --nocapture --test-threads=1
          $ffiResult = $LASTEXITCODE
          $nativeFailed = $false
          foreach ($sample in 1..3) {
            Write-Output "DIAGNOSTIC_FRESH_SAMPLE sample=$sample started=true"
            cargo test -p pos-owner-bridge-windows --all-features --locked --lib native_outstanding_controller_callback_survives_abandonment -- --include-ignored --nocapture --test-threads=1
            $sampleResult = $LASTEXITCODE
            Write-Output "DIAGNOSTIC_FRESH_SAMPLE sample=$sample exit_code=$sampleResult"
            if ($sampleResult -ne 0) { $nativeFailed = $true }
          }
          Write-Output "DIAGNOSTIC_ONLY model_exit=$modelResult api_exit=$apiResult witness_exit=$witnessResult ffi_exit=$ffiResult native_failed=$nativeFailed"
          if ($modelResult -ne 0 -or $apiResult -ne 0 -or $witnessResult -ne 0 -or $ffiResult -ne 0 -or $nativeFailed) { throw 'One or more diagnostic cases failed' }
