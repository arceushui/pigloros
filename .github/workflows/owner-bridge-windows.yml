name: owner-bridge-windows
on:
  push:
    branches: [diag/535-cc-lint]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked --keep-going --message-format short -- -D warnings -W clippy::pedantic
