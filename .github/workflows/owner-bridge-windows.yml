name: owner-bridge-windows

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-bridge-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - name: Install coverage producer
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: Install coverage gate
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: covgate@0.2.0
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      # Prepare the runtime before any tests. The complete native suite runs
      # once under coverage with every test included and no exclusion filters.
      - name: Prepare retained runtime for real native fixtures
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Test portable bridge, owner executable and native docs
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo test -p pos-owner-bridge -p piglor-owner --all-features --locked -- --include-ignored
          if ($LASTEXITCODE -ne 0) { throw 'Portable bridge or owner executable tests failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --doc -- --include-ignored
          if ($LASTEXITCODE -ne 0) { throw 'Native documentation tests failed' }
      - name: Measure only shim source coverage
        id: coverage
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { throw 'Cargo metadata failed' }
          $metadata | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/owner-windows-metadata.json"
          $ignore = $metadata | python scripts/owner_bridge_windows_cov_ignore.py
          if ($LASTEXITCODE -ne 0 -or -not $ignore) { throw 'Unsafe coverage scope' }
          $marker = Join-Path $env:RUNNER_TEMP ("owner-desktop-stop-" + [guid]::NewGuid().ToString('N'))
          $observer = $null
          try {
            $observer = Start-Job -FilePath (Join-Path $env:GITHUB_WORKSPACE 'scripts/observe-owner-desktop.ps1') -ArgumentList $marker
          } catch { Write-Output 'NATIVE_DESKTOP observer=unknown' }
          try {
            cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --no-fail-fast --json --output-path "$env:RUNNER_TEMP/owner-windows-coverage.json" --ignore-filename-regex "$ignore" -- --include-ignored --nocapture
            $nativeResult = $LASTEXITCODE
          } finally {
            try {
              [System.IO.File]::WriteAllText($marker, 'stop')
              if ($null -ne $observer) {
                $finished = Wait-Job -Job $observer -Timeout 6
                if ($null -eq $finished) { Write-Output 'NATIVE_DESKTOP observer_stop=unknown' }
                if ($observer.State -ne 'Completed') { Write-Output 'NATIVE_DESKTOP observer_state=unknown' }
                Receive-Job -Job $observer -ErrorAction SilentlyContinue
              }
            } catch { Write-Output 'NATIVE_DESKTOP observer_output=unknown' }
          }
          if ($nativeResult -ne 0) { throw 'Native coverage execution failed' }
      - name: Enforce both changed-line Windows coverage floors
        shell: pwsh
        env:
          COVERAGE_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || 'origin/main' }}
        working-directory: crates/pos-owner-bridge-windows
        run: covgate check "$env:RUNNER_TEMP/owner-windows-coverage.json" --base "$env:COVERAGE_BASE" --no-github-summary
      - name: Enforce both full-file Windows coverage floors
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $metadata = Get-Content -Raw "$env:RUNNER_TEMP/owner-windows-metadata.json"
          $report = "$env:RUNNER_TEMP/owner-windows-coverage.json"
          $metadata | python scripts/owner_bridge_windows_cov_ignore.py --report "$report" --list-report
          if ($LASTEXITCODE -ne 0) { throw 'Coverage source scope is invalid' }
          $safe = $metadata | python scripts/owner_bridge_windows_cov_ignore.py --report "$report" --scope safe
          if ($LASTEXITCODE -ne 0 -or -not $safe) { throw 'Unsafe full-file safe scope' }
          $ffi = $metadata | python scripts/owner_bridge_windows_cov_ignore.py --report "$report" --scope ffi
          if ($LASTEXITCODE -ne 0 -or -not $ffi) { throw 'Unsafe full-file ffi scope' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/owner-windows-safe-full.json" --ignore-filename-regex "$safe" --fail-under-lines 99 --fail-under-regions 99
          $safeResult = $LASTEXITCODE
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/owner-windows-ffi-full.json" --ignore-filename-regex "$ffi" --fail-under-lines 95 --fail-under-regions 80
          $ffiResult = $LASTEXITCODE
          if ($safeResult -ne 0 -or $ffiResult -ne 0) { throw 'Full-file Windows coverage floor failed' }
      - name: Export native LCOV for cargo-crap
        id: native-lcov
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rawMetadata = Get-Content -Raw "$env:RUNNER_TEMP/owner-windows-metadata.json"
          $metadata = $rawMetadata | ConvertFrom-Json
          $ignore = $rawMetadata | python scripts/owner_bridge_windows_cov_ignore.py
          if ($LASTEXITCODE -ne 0 -or -not $ignore) { throw 'Unsafe native LCOV scope' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --no-default-ignore-filename-regex --ignore-filename-regex "$ignore" --output-path "$env:RUNNER_TEMP/owner-windows.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'Native LCOV export failed' }
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Native coverage checkout mismatch' }
          $rustupRoot = rustup show home
          if ($LASTEXITCODE -ne 0 -or -not $rustupRoot) { throw 'Rustup source root is unavailable' }
          [ordered]@{
            version = 1
            checkout = $checkout
            workspace_root = $metadata.workspace_root
            target_directory = $metadata.target_directory
            cargo_home = $env:CARGO_HOME
            rustup_home = $rustupRoot
            lcov_sha256 = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/owner-windows.lcov" -Algorithm SHA256).Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/owner-windows-lcov-receipt.json" -Encoding utf8
      - name: Retain native LCOV and checkout receipt
        if: ${{ !cancelled() && steps.native-lcov.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-windows-lcov-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owner-windows.lcov
            ${{ runner.temp }}/owner-windows-lcov-receipt.json
          if-no-files-found: error
      - name: Retain the measured shim report
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-windows-coverage-${{ github.sha }}
          path: |
            ${{ runner.temp }}/owner-windows-coverage.json
            ${{ runner.temp }}/owner-windows-safe-full.json
            ${{ runner.temp }}/owner-windows-ffi-full.json
          if-no-files-found: error
      # Failed test profiles are diagnostic only and never qualify a coverage gate.
      - name: Export failed native coverage diagnostics
        if: ${{ failure() && !cancelled() && steps.coverage.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'owner-windows-failed-diagnostic'
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          $receipt = [ordered]@{
            version = 1
            qualification = 'failed-measurement-diagnostic-only'
            expected_checkout = $env:GITHUB_SHA
            checkout = $null
            cargo_llvm_cov_version = 'unavailable'
            profile_directory = $null
            profile_files = 0
            json = 'unavailable'
            lcov = 'unavailable'
            detail = 'profile unavailable'
          }
          try {
            $checkout = git rev-parse HEAD
            $receipt.checkout = $checkout
            if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'checkout mismatch' }
            $version = cargo llvm-cov --version
            if ($LASTEXITCODE -eq 0 -and $version) { $receipt.cargo_llvm_cov_version = $version }
            $rawMetadata = Get-Content -Raw "$env:RUNNER_TEMP/owner-windows-metadata.json"
            $metadata = $rawMetadata | ConvertFrom-Json
            $ignore = $rawMetadata | python scripts/owner_bridge_windows_cov_ignore.py
            if ($LASTEXITCODE -ne 0 -or -not $ignore) { throw 'coverage scope unavailable' }
            $targetOverride = [Environment]::GetEnvironmentVariable('CARGO_LLVM_COV_TARGET_DIR')
            $profileDirectory = if ($null -ne $targetOverride) {
              [System.IO.Path]::GetFullPath($targetOverride, (Get-Location).Path)
            } else {
              Join-Path $metadata.target_directory 'llvm-cov-target'
            }
            $receipt.profile_directory = $profileDirectory
            $profiles = @(Get-ChildItem -LiteralPath $profileDirectory -Filter '*.profraw' -File | Where-Object { $_.Length -gt 0 })
            $receipt.profile_files = $profiles.Count
            if ($profiles.Count -eq 0) { throw 'profile unavailable' }
            cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --ignore-filename-regex "$ignore" --output-path "$directory/diagnostic.json"
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath "$directory/diagnostic.json") -and (Get-Item -LiteralPath "$directory/diagnostic.json").Length -gt 0) { $receipt.json = 'available' }
            cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --no-default-ignore-filename-regex --ignore-filename-regex "$ignore" --output-path "$directory/diagnostic.lcov"
            if ($LASTEXITCODE -eq 0 -and (Test-Path -LiteralPath "$directory/diagnostic.lcov") -and (Get-Item -LiteralPath "$directory/diagnostic.lcov").Length -gt 0) { $receipt.lcov = 'available' }
            $receipt.detail = 'export attempted; available reports reflect failed test execution and are not qualification evidence'
          } catch {
            $receipt.detail = "diagnostic export unavailable: $($_.Exception.Message)"
          } finally {
            if ($receipt.json -ne 'available') { Remove-Item -LiteralPath "$directory/diagnostic.json" -ErrorAction SilentlyContinue }
            if ($receipt.lcov -ne 'available') { Remove-Item -LiteralPath "$directory/diagnostic.lcov" -ErrorAction SilentlyContinue }
            $receipt | ConvertTo-Json | Set-Content -LiteralPath "$directory/failure-receipt.json" -Encoding utf8
          }
      - name: Retain failed native coverage diagnostics
        if: ${{ failure() && !cancelled() && steps.coverage.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-windows-failed-diagnostic-${{ github.sha }}
          path: ${{ runner.temp }}/owner-windows-failed-diagnostic/
          if-no-files-found: error
