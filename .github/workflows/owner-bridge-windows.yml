name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-cutpoints:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Check source and lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests/process_fault.rs
          cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Test exact native cutpoints
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- native_interaction_cutpoints_outlive_fixture_readiness_ceiling --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'interaction case failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/interaction.json"
          if ($LASTEXITCODE -ne 0) { throw 'interaction JSON failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/interaction.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'interaction LCOV failed' }
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- native_release_cutpoint_uses_release_window_after_fixture_readiness_ceiling --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'release case failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/release.json"
          if ($LASTEXITCODE -ne 0) { throw 'release JSON failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/release.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'release LCOV failed' }
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- native_exit_cutpoint_uses_exit_window_after_fixture_readiness_ceiling --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'exit case failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/exit.json"
          if ($LASTEXITCODE -ne 0) { throw 'exit JSON failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/exit.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'exit LCOV failed' }
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- native_outstanding_controller_callback_survives_abandonment --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'controller case failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/controller.json"
          if ($LASTEXITCODE -ne 0) { throw 'controller JSON failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/controller.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'controller LCOV failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-cutpoints
          path: |
            ${{ runner.temp }}/interaction.json
            ${{ runner.temp }}/interaction.lcov
            ${{ runner.temp }}/release.json
            ${{ runner.temp }}/release.lcov
            ${{ runner.temp }}/exit.json
            ${{ runner.temp }}/exit.lcov
            ${{ runner.temp }}/controller.json
            ${{ runner.temp }}/controller.lcov
          if-no-files-found: warn
