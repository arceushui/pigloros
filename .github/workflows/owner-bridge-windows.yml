name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic portable listener on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - name: Install diagnostic coverage producer
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: DIAGNOSTIC full portable bridge tests and coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'DIAGNOSTIC_ONLY portable bridge tests and per-file coverage'
          Write-Output $checkout
          cargo clippy -p pos-owner-bridge --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
          if ($LASTEXITCODE -ne 0) { throw 'Portable bridge Clippy failed' }
          cargo llvm-cov -p pos-owner-bridge --all-features --locked --json --output-path "${{ runner.temp }}/listener-coverage.json" -- --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Portable bridge test or coverage execution failed' }
          cargo test -p pos-owner-bridge --all-features --locked --doc -- --include-ignored
          if ($LASTEXITCODE -ne 0) { throw 'Portable bridge documentation tests failed' }
      - name: Retain portable bridge diagnostic coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-listener-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/listener-coverage.json
          if-no-files-found: error
