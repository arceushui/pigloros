name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  denial-verdict:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Check source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/native_tests/controls.rs
      - name: Modeled denial verdict tests and diagnostic coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- adapter::native_tests::controls::tests::modeled_denial_oracle_ --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Surface model tests failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/denial-verdict.json"
          if ($LASTEXITCODE -ne 0) { throw 'JSON export failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: denial-verdict-json
          path: ${{ runner.temp }}/denial-verdict.json
