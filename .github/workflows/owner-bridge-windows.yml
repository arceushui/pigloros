name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Check selected modeled surface and exit verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'Targeted model checks only; not native G3/G4 or coverage qualification'
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::surface::tests::pending_creation::insecure_environment_readback_refuses_controller_and_retires_recordless --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Surface admission model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::surface::tests::pending_creation::mismatched_environment_identity_refuses_controller_and_retires_recordless --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Environment identity model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::native_tests::process_fault::model_tests::modeled_exit_fault_rejects_duplicate_own_exit_before_querying_handle --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Duplicate exit model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::native_tests::process_fault::model_tests::modeled_exit_control_requires_unique_callback_zero_status_and_live_deadline --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Exit control model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- ffi::process_fault::candidate_tests:: --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Process observation models failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- ffi::buffers::tests::aligned_offsets_include_end_but_reject_unaligned_and_out_of_bounds --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Buffer offset model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::native_tests::session::tests::idle_native_session_refuses_operations_until_their_owners_exist --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Idle session model failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --test directory_public -- private_directory_is_current_sid_only_and_rejects_weakened_acl_and_links --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Directory native boundary failed' }
  g3:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Full original native lifecycle and G3 function
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'Selected full lifecycle and G3 function only; not full native or coverage qualification'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_window_environment_and_buffers_lifecycle --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native lifecycle or G3 failed' }
