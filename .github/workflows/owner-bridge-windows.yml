name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Check selected modeled surface and exit verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'Targeted model checks only; not native G3/G4 or coverage qualification'
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- adapter::surface::tests::synchronous_navigation_failure_refuses_readiness_until_owned_exit --exact --include-ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'Synchronous navigation failure model failed' }
