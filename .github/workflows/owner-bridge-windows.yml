name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  listener-deadline-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Record checkout
        run: git rev-parse HEAD
      - name: Exercise listener deadline boundaries
        run: >
          cargo test -p pos-owner-bridge --lib --all-features --locked
          listener::tests:: -- --include-ignored --nocapture
      - name: Exercise public listener boundary
        run: cargo test -p pos-owner-bridge --test listener_serving --all-features --locked -- --include-ignored
      - name: Lint portable owner bridge
        run: cargo clippy -p pos-owner-bridge --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
