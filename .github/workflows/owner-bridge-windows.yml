name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hold-release-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Clippy Windows native packages
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Run ledger witness and measure diagnostic coverage
        shell: pwsh
        run: |
          git rev-parse HEAD
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/ledger_storage.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/adapter/store_file_identity.rs
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --json --output-path "$env:RUNNER_TEMP/hold-release.json" --lib -- tests::windows_nonce_ledger_storage_native --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'ledger control witness failed' }
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib -- tests::windows_store_file_identity_native --exact --nocapture
          if ($LASTEXITCODE -ne 0) { throw 'store identity witness failed' }
      - name: Retain diagnostic coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: hold-release-coverage
          path: ${{ runner.temp }}/hold-release.json
          if-no-files-found: error
