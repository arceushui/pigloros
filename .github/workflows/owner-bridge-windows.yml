name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic modeled Surface and pre-record observations
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: DIAGNOSTIC modeled Surface and pre-record port observations
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'MODEL_DIAGNOSTIC_ONLY scripted native port observations'
          Write-Output $checkout
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib adapter::surface::tests -- --include-ignored --nocapture --test-threads=1
          $surfaceResult = $LASTEXITCODE
          cargo test -p pos-owner-bridge-windows --all-features --locked --lib adapter::native_tests::process_fault::port_tests -- --include-ignored --nocapture --test-threads=1
          $portResult = $LASTEXITCODE
          Write-Output "MODEL_DIAGNOSTIC_ONLY surface_exit=$surfaceResult port_exit=$portResult"
          if ($surfaceResult -ne 0 -or $portResult -ne 0) { throw 'One or more model diagnostics failed' }
