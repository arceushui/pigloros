name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-g3:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Windows owner Clippy
        run: cargo clippy -p pos-owner-bridge-windows --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Mapping and registry validation models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --lcov --output-path "$env:RUNNER_TEMP/ffi-models.lcov" -- modeled_ --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'FFI model checks failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffi-models-lcov
          path: ${{ runner.temp }}/ffi-models.lcov
          if-no-files-found: error
