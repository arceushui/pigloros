name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  surface-validation:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
      SOURCE_SHA: 30fdf96338f19bd937e5f265666316c816bca8b4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Verify source identity and lint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          $source = git rev-parse "$env:SOURCE_SHA^{commit}"
          if ($LASTEXITCODE -ne 0 -or $source -cne $env:SOURCE_SHA) { throw 'Source missing' }
          $changed = @(git diff --name-only $source HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/owner-bridge-windows.yml') { throw 'Diagnostic source differs' }
          @("source=$source", "checkout=$env:GITHUB_SHA", $changed) | Set-Content "$env:RUNNER_TEMP/surface-source.txt"
          cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Exercise Surface models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- adapter::surface::tests:: --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Surface models failed' }
      - name: Export focused diagnostic profiles
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/surface-validation.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'LCOV export failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/surface-validation.json"
          if ($LASTEXITCODE -ne 0) { throw 'JSON export failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ always() }}
        with:
          name: surface-validation-diagnostic
          path: |
            ${{ runner.temp }}/surface-source.txt
            ${{ runner.temp }}/surface-validation.lcov
            ${{ runner.temp }}/surface-validation.json
          if-no-files-found: error
