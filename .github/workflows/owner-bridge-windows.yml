name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic instrumented G4 retry observations
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare retained runtime for real native fixtures
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: DIAGNOSTIC instrumented owned process faults with retry context
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'DEBUG-535-4297 DIAGNOSTIC_ONLY instrumented native G4 observations'
          Write-Output $checkout
          $failed = $false
          foreach ($sample in 1..2) {
            Write-Output "DEBUG-535-4297 sample=$sample stage=begin"
            cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- adapter::native_tests::process_fault::diagnostic_repeated_second_retry --exact --include-ignored --nocapture --test-threads=1
            $result = $LASTEXITCODE
            Write-Output "DEBUG-535-4297 sample=$sample exit=$result"
            if ($result -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more native G4 diagnostics failed' }
