name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 4
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Verify checkout and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p portable-linux-receipt
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git rev-parse HEAD 6a3aff3048bd078644f503ec42ebe249982402db > portable-linux-receipt/source.txt
          git diff --exit-code 6a3aff3048bd078644f503ec42ebe249982402db HEAD -- . ':(exclude).github/workflows/owner-bridge-windows.yml'
          git rev-parse HEAD:crates/pos-owner-bridge HEAD:apps/piglor-owner HEAD:Cargo.lock HEAD:Cargo.toml >> portable-linux-receipt/source.txt
          cat portable-linux-receipt/source.txt
      - name: Portable all-target lint
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p pos-owner-bridge -p piglor-owner --all-targets --all-features --locked -- -D warnings -W clippy::pedantic 2>&1 | tee portable-linux-receipt/clippy.log
      - name: Portable tests and coverage
        shell: bash
        run: |
          set -o pipefail
          cargo llvm-cov -p pos-owner-bridge -p piglor-owner --all-features --locked --no-report -- --include-ignored 2>&1 | tee portable-linux-receipt/tests.log
          cargo llvm-cov report -p pos-owner-bridge -p piglor-owner --locked --json --output-path portable-linux-receipt/coverage.json
          cargo llvm-cov report -p pos-owner-bridge -p piglor-owner --locked --lcov --output-path portable-linux-receipt/coverage.lcov
      - name: Portable doctests
        shell: bash
        run: |
          set -o pipefail
          cargo test -p pos-owner-bridge -p piglor-owner --all-features --locked --doc -- --include-ignored 2>&1 | tee portable-linux-receipt/doctests.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portable-linux-receipt
          path: portable-linux-receipt/
          if-no-files-found: warn
