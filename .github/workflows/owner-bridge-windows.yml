name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-g3:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Windows owner Clippy
        run: cargo clippy -p pos-owner-bridge-windows --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Observe wrappers after real close
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
          PIGLOR_FFI_CLOSE_OBSERVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output "CHECKOUT=$checkout; targeted closed-COM observation only; G3 intentionally not run"
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --lcov --output-path "$env:RUNNER_TEMP/closed-observation.lcov" -- tests::native_window_environment_and_buffers_lifecycle --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Closed COM observation failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: closed-observation-lcov
          path: ${{ runner.temp }}/closed-observation.lcov
          if-no-files-found: error
