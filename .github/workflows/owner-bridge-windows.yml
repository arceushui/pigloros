name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Enforce the Windows unsafe inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint native adapter and portable bridge
        run: cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Diagnostic phase regressions and original G4 function
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'DEBUG-535-PHASE diagnostic-only, not G3/G4 qualification'
          $failed = $false
          foreach ($filter in @('interaction_cutpoint_requires_receipt_and_keeps_original_limits', 'native_interaction_cutpoints_outlive_fixture_readiness_ceiling', 'native_release_cutpoint_uses_release_window_after_fixture_readiness_ceiling', 'native_exit_cutpoint_uses_exit_window_after_fixture_readiness_ceiling', 'tests::native_verified_owned_process_faults_retire')) {
            Write-Output "DEBUG-535-PHASE filter=$filter"
            cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- $filter --include-ignored --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { throw 'One or more phase diagnostics failed' }
