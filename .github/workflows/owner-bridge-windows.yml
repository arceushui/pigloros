name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previously-unrun-native:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Prepare retained runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-native-runtime"
      - name: Early renderer classification and fault
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output "CHECKOUT=$checkout; previously unrun targeted native tests only; not full native or coverage qualification"
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- adapter::native_tests::process_fault::native_early_renderer_classification_and_faults --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Early renderer native case failed' }
      - name: Native control callbacks
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_control_callbacks_deny_and_retain_through_own_exit --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native control callback cases failed' }
      - name: Native resource denial
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_resource_denial_callback_failure_does_not_contact_listener --exact --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Native resource-denial case failed' }
