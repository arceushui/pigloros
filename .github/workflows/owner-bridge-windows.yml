name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  foreground-green:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: clippy
      - name: Record checkout
        run: git rev-parse HEAD
      - name: Lint Windows owner bridge
        run: cargo clippy -p pos-owner-bridge-windows --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Exercise surface tests
        run: >
          cargo test -p pos-owner-bridge-windows --lib --all-features --locked
          adapter::surface::tests:: -- --include-ignored --nocapture
