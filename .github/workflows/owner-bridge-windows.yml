name: owner-bridge-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: diagnostic portable listener deadline regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: DIAGNOSTIC existing expired deadline must refuse buffered data
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf '%s\n' 'DIAGNOSTIC_ONLY expected regression failure before implementation'
          git rev-parse HEAD
          cargo test -p pos-owner-bridge --all-features --locked --lib listener::tests::an_expired_first_byte_deadline_refuses_a_queued_request_without_reading -- --exact --include-ignored --nocapture
