name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ffi-boundaries:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview, clippy
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-llvm-cov
      - name: Check exact source and all-target Clippy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD) -cne $env:GITHUB_SHA) { throw 'Checkout mismatch' }
          $sourceHead = '647aab81ddd2401a4a2358b5a4eb329941b9c47a'
          $changed = @(git diff --name-only $sourceHead HEAD)
          if ($LASTEXITCODE -ne 0 -or $changed.Count -ne 1 -or $changed[0] -cne '.github/workflows/owner-bridge-windows.yml') { throw 'Unexpected diagnostic source differences' }
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/ffi/process_fault.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/ffi/process_fault/candidate_tests.rs
          git rev-parse HEAD:crates/pos-owner-bridge-windows/src/ffi/session.rs
          cargo clippy -p pos-owner-bridge-windows -p pos-owner-bridge -p piglor-owner --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
          if ($LASTEXITCODE -ne 0) { throw 'Clippy failed' }
      - name: Run focused FFI tests and export coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- modeled_process_collection_refuses_invalid_counts_and_duplicate_or_invalid_pids --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Process model failed' }
          cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-clean -- empty_native_session_refuses_operations_and_allows_ordered_cleanup --include-ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Empty session failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --lcov --output-path "$env:RUNNER_TEMP/ffi-boundaries.lcov"
          if ($LASTEXITCODE -ne 0) { throw 'LCOV export failed' }
          cargo llvm-cov report -p pos-owner-bridge-windows --locked --json --output-path "$env:RUNNER_TEMP/ffi-boundaries.json"
          if ($LASTEXITCODE -ne 0) { throw 'JSON export failed' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ffi-boundaries-json-lcov
          path: |
            ${{ runner.temp }}/ffi-boundaries.lcov
            ${{ runner.temp }}/ffi-boundaries.json
