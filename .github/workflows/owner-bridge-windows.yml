name: owner-bridge-windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      RUSTC_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,llvm-tools-preview
      - name: Install diagnostic coverage instrumentation
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - name: Check the exact unsafe source inventory
        run: python scripts/check_owner_bridge_unsafe_policy.py
      - name: Lint the native package and its tests
        run: cargo clippy -p pos-owner-bridge-windows --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: Prepare the retained native test runtime
        id: runtime
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/prepare-owner-runtime.ps1 -OutputRoot "$env:RUNNER_TEMP/owner-control-runtime"
      - name: Observe one complete native control test
        id: control
        shell: pwsh
        env:
          OWNER_BRIDGE_TEST_RUNTIME: ${{ steps.runtime.outputs.runtime }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkout = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkout -cne $env:GITHUB_SHA) { throw 'Diagnostic checkout mismatch' }
          Write-Output 'Scoped callback diagnostic with all ten original control cases'
          $result = 1
          try {
            cargo llvm-cov -p pos-owner-bridge-windows --all-features --locked --lib --no-report -- tests::native_control_callbacks_deny_and_retain_through_own_exit --exact --include-ignored --nocapture
            $result = $LASTEXITCODE
          } finally {
            [ordered]@{
              version = 1
              purpose = 'scoped native control callback diagnosis'
              checkout = $checkout
              test = 'tests::native_control_callbacks_deny_and_retain_through_own_exit'
              exit_code = $result
              source_base = 'ae1ec5875160be8284e5e0084bfb76df2b6bfdf1'
              qualification = 'diagnostic-only'
            } | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/owner-control-probe-receipt.json" -Encoding utf8
          }
          if ($result -ne 0) { throw 'Selected native control test failed' }
      - name: Retain the diagnostic receipt
        if: ${{ !cancelled() && steps.control.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-control-probe-${{ github.sha }}
          path: ${{ runner.temp }}/owner-control-probe-receipt.json
          if-no-files-found: error
