name: Exact hosted Rustfmt Wave 8

on:
  push:
    branches:
      - automation/format-wave8-exact

permissions:
  contents: write

jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: redmine/432-ard1-registration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format root coverage source
        shell: bash
        run: |
          set -euo pipefail
          target='redmine/432-ard1-registration'
          expected="$(git rev-parse HEAD)"
          rustfmt --edition 2021 --emit files crates/pos-store/src/memory.rs
          if git diff --quiet -- crates/pos-store/src/memory.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/pos-store/src/memory.rs
          git commit -m 'style: format #190 memory coverage'
          git push --force-with-lease="refs/heads/$target:$expected" origin HEAD:"refs/heads/$target"
  child:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: redmine/419-local-cut-owner
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format reviewed child sources
        shell: bash
        run: |
          set -euo pipefail
          target='redmine/419-local-cut-owner'
          expected="$(git rev-parse HEAD)"
          rustfmt --edition 2021 --emit files             crates/pos-core/src/local_cut_commit.rs             crates/pos-core/tests/local_cut_owner_public.rs             crates/pos-runtime/tests/manifest_owner_admission_public.rs
          if git diff --quiet --             crates/pos-core/src/local_cut_commit.rs             crates/pos-core/tests/local_cut_owner_public.rs             crates/pos-runtime/tests/manifest_owner_admission_public.rs; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             crates/pos-core/src/local_cut_commit.rs             crates/pos-core/tests/local_cut_owner_public.rs             crates/pos-runtime/tests/manifest_owner_admission_public.rs
          git commit -m 'style: format #419 reviewed sources'
          git push --force-with-lease="refs/heads/$target:$expected" origin HEAD:"refs/heads/$target"
