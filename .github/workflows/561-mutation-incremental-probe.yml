# Fixed-order test-profile experiment; every failure remains a failure.
name: 561-store-test-profile-control

on:
  push:
    branches: [redmine/561-mutation-incremental-probe]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: never

jobs:
  store-control:
    name: full Store profile comparison with assertions and overflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 0c6d537d11b1bf43614dd980bb30f49e60a7912f
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        timeout-minutes: 2
        with:
          shared-key: mutation
          save-if: false
      - name: Record frozen source and actual runner
        timeout-minutes: 1
        env:
          PROBE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0c6d537d11b1bf43614dd980bb30f49e60a7912f
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p artifacts/store-control
          {
            printf 'workflow=%s\n' "$PROBE_WORKFLOW_SHA"
            git rev-parse HEAD
            sha256sum Cargo.lock crates/pos-store/src/fork_replay.rs
            rustc -Vv
            cargo --version
            uname -a
            nproc
            free -m
            df -h .
          } > artifacts/store-control/environment.txt
      - name: Compare the full Store test profiles in fixed ABBA order
        # The job remains bounded. Partial measurements are not acceptance.
        timeout-minutes: 17
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import time

          artifact = Path("artifacts/store-control")
          report = {
              "source": "0c6d537d11b1bf43614dd980bb30f49e60a7912f",
              "order": [0, 1, 1, 0],
              "debug_assertions": True,
              "overflow_checks": True,
              "cases": [],
          }
          report_path = artifact / "profiles.json"
          first_failure = 0
          for index, opt in enumerate(report["order"]):
              case = {"index": index, "opt_level": opt}
              report["cases"].append(case)
              config = [
                  "--config", f"profile.test.package.pos-store.opt-level={opt}",
                  "--config", "profile.test.package.pos-store.debug-assertions=true",
                  "--config", "profile.test.package.pos-store.overflow-checks=true",
              ]
              base = [
                  "cargo", "test", "--verbose", "--package=pos-store@0.1.0",
                  "--all-features", "--locked", *config,
              ]
              for phase, command, deadline in (
                  ("build", [*base, "--no-run"], 600),
                  ("test", [*base, "--", "-Zunstable-options", "--fail-fast",
                            "--include-ignored", "--test-threads=2"], 120),
              ):
                  environment = dict(os.environ)
                  environment["CARGO_BUILD_JOBS"] = "3" if phase == "build" else "1"
                  assert environment["CARGO_INCREMENTAL"] == "1"
                  log_path = artifact / f"{index}-opt{opt}-{phase}.log"
                  timed = ["timeout", "--kill-after=5s", f"{deadline}s",
                           "/usr/bin/time", "-v", *command]
                  case[phase] = {
                      "command": timed,
                      "compiler_jobs": environment["CARGO_BUILD_JOBS"],
                      "start_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  }
                  report_path.write_text(json.dumps(report, sort_keys=True, indent=2))
                  started = time.monotonic()
                  with log_path.open("wb") as log:
                      status = subprocess.run(
                          timed, env=environment, stdout=log,
                          stderr=subprocess.STDOUT, check=False,
                      ).returncode
                  case[phase].update(
                      exit_code=status, seconds=time.monotonic() - started,
                      end_utc=time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  )
                  report_path.write_text(json.dumps(report, sort_keys=True, indent=2))
                  if status != 0:
                      if first_failure == 0:
                          first_failure = status if status > 0 else 1
                      if phase == "build":
                          sys.exit(first_failure)
                  elif phase == "test":
                      with (artifact / f"{index}-summary-validation.log").open("wb") as log:
                          summary_status = subprocess.run(
                              ["bash", "scripts/assert-no-ignored-in-test-summary.sh",
                               str(log_path)], stdout=log, stderr=subprocess.STDOUT,
                              check=False,
                          ).returncode
                      case["summary_status"] = summary_status
                      report_path.write_text(json.dumps(report, sort_keys=True, indent=2))
                      if summary_status != 0 and first_failure == 0:
                          first_failure = summary_status
              subprocess.run(["git", "diff", "--exit-code", "HEAD"], check=True)
          assert len(report["cases"]) == 4
          report["overall_exit_code"] = first_failure
          report_path.write_text(json.dumps(report, sort_keys=True, indent=2))
          print(json.dumps(report, sort_keys=True))
          sys.exit(first_failure)
          PY
      - name: Preserve every control result, including failure
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-561-store-profile-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/store-control/
          if-no-files-found: error
          retention-days: 14
