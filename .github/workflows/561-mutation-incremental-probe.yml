# Unmutated owning-package control, not a replacement or relaxed mutation gate.
name: 561-store-test-timeout-control

on:
  push:
    branches: [redmine/561-mutation-incremental-probe]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"
  CARGO_TERM_COLOR: never

jobs:
  store-control:
    name: full Store tests within the unchanged 120s budget
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 0c6d537d11b1bf43614dd980bb30f49e60a7912f
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        timeout-minutes: 2
        with:
          shared-key: mutation
          save-if: false
      - name: Record frozen source and actual runner
        timeout-minutes: 1
        env:
          PROBE_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0c6d537d11b1bf43614dd980bb30f49e60a7912f
          test -z "$(git status --porcelain --untracked-files=no)"
          mkdir -p artifacts/store-control
          {
            printf 'workflow=%s\n' "$PROBE_WORKFLOW_SHA"
            git rev-parse HEAD
            sha256sum Cargo.lock crates/pos-store/src/fork_replay.rs
            rustc -Vv
            cargo --version
            uname -a
            nproc
            free -m
            df -h .
          } > artifacts/store-control/environment.txt
      - name: Build all owning-package targets before timing tests
        timeout-minutes: 11
        env:
          # As in the full baseline, three build jobs shorten cold setup.
          # This setup timing is not compared with single-job mutant builds.
          CARGO_BUILD_JOBS: "3"
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          timeout --kill-after=5s 600s cargo test --no-run --verbose \
            --package=pos-store@0.1.0 --all-features --locked \
            2>&1 | tee artifacts/store-control/build.log
      - name: Measure healthy full Store tests under the exact Test-phase budget
        timeout-minutes: 3
        env:
          # Override setup/cache exports at the actual native consumer.
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          test -x /usr/bin/time
          date --utc --iso-8601=seconds > artifacts/store-control/test-start.txt
          set +e
          timeout --kill-after=5s 120s /usr/bin/time -v \
            cargo test --verbose --package=pos-store@0.1.0 --all-features --locked -- \
            -Zunstable-options --fail-fast --include-ignored --test-threads=2 \
            2>&1 | tee artifacts/store-control/test.log
          pipeline_status=("${PIPESTATUS[@]}")
          set -e
          printf '%s\n' "${pipeline_status[@]}" > artifacts/store-control/test-status.txt
          date --utc --iso-8601=seconds > artifacts/store-control/test-end.txt
          if [[ "${pipeline_status[0]}" -ne 0 ]]; then
            exit "${pipeline_status[0]}"
          fi
          if [[ "${pipeline_status[1]}" -ne 0 ]]; then
            exit "${pipeline_status[1]}"
          fi
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/store-control/test.log
          git diff --exit-code HEAD
      - name: Preserve every control result, including failure
        if: ${{ always() }}
        timeout-minutes: 2
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-561-store-test-control-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/store-control/
          if-no-files-found: error
          retention-days: 14
