name: selector-fixture-export

on:
  push:
    branches: [codex/ticket-213-provider-admission]
    paths:
      - .github/workflows/selector-fixture-export.yml
      - crates/pos-reference/tests/evaluator_public/fixture_export.rs
      - crates/pos-reference/src/selector/installation/authority/update/durability.rs

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Generate signed selector fixtures from existing builder
        env:
          SELECTOR_FIXTURE_EXPORT: ${{ runner.temp }}/selector-fixtures
        run: cargo test -p pos-reference --locked --test evaluator_public fixture_export::export_installed_selector_fixtures -- --exact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: selector-fixtures
          path: ${{ runner.temp }}/selector-fixtures
          if-no-files-found: error
          retention-days: 3
