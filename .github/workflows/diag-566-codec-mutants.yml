# Temporary proof run (Redmine #566): full-crate cargo-mutants for
# pos-owner-bridge-codec. Removed before the PR is ready.
name: diag-566-codec-mutants

on:
  push:
    branches: [redmine/566-codec-mutants]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fmt-diff:
    name: rustfmt diff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: cargo fmt --check
        env:
          RUSTUP_TOOLCHAIN: 1.97.1
        run: cargo fmt --all -- --check

  mutants:
    name: codec mutants (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTUP_TOOLCHAIN: nightly-2026-08-28
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-08-28
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
          save-if: false
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-mutants
      - name: Run full-crate mutants
        run: |
          set -euo pipefail
          set +e
          cargo mutants \
            --package pos-owner-bridge-codec \
            --all-features \
            --no-shuffle \
            --shard "${{ matrix.shard }}/4" \
            --jobs 4 \
            --timeout 120 \
            --build-timeout 600 \
            --cap-lints true \
            --cargo-arg=--locked \
            -- \
            -- \
            -Zunstable-options \
            --fail-fast \
            --include-ignored \
            --test-threads=2
          status=$?
          set -e
          echo "### shard ${{ matrix.shard }} missed" >> "$GITHUB_STEP_SUMMARY"
          cat mutants.out/missed.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "### shard ${{ matrix.shard }} timeout" >> "$GITHUB_STEP_SUMMARY"
          cat mutants.out/timeout.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo "---- MISSED"; cat mutants.out/missed.txt || true
          echo "---- TIMEOUT"; cat mutants.out/timeout.txt || true
          exit "$status"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: codec-mutants-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
