# Temporary branch-only evidence; never a replacement PR gate or trusted baseline.
name: 561-repair-coverage-diagnostic

on:
  push:
    branches: [redmine/561-repair-coverage-diagnostic]

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 172c588b6c1efbcc9fa587301b763e861c55a12e
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-llvm-cov
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: covgate@0.2.0
      - name: Record source and execution identities
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = 172c588b6c1efbcc9fa587301b763e861c55a12e
          git merge-base --is-ancestor 091f25b9747f06072be4c10fdad3d14652cbffe0 HEAD
          rustc -Vv | tee artifacts/rustc.txt
          cargo llvm-cov --version | tee artifacts/llvm-cov-version.txt
          id | tee artifacts/runner-identity.txt
          test "$(id -u)" -ne 0
      - name: Generate full-workspace coverage with every ignored test included
        id: coverage
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-features --locked \
            --json --output-path artifacts/coverage.json \
            -- --include-ignored 2>&1 | tee artifacts/coverage.log
          grep -E '^test result: ok\. [1-9][0-9]* passed;' artifacts/coverage.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/coverage.log
      - name: Enforce changed-code coverage against the fixed review base
        run: |
          set -euo pipefail
          covgate check artifacts/coverage.json \
            --base 091f25b9747f06072be4c10fdad3d14652cbffe0 \
            --no-github-summary 2>&1 | tee artifacts/changed-code.log
      - name: Enforce unchanged 99 percent line and region floors
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        run: |
          set -euo pipefail
          cargo llvm-cov report --json --summary-only --show-missing-lines \
            --fail-under-lines 99 --fail-under-regions 99 \
            > artifacts/coverage-summary.json
      - name: Preserve coverage evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: untrusted-561-repair-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
