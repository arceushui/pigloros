name: Temporary Inspect Wave 8 Stack
on:
  push:
    branches:
      - automation/inspect-wave8-stack-20261002
permissions:
  contents: read
  pull-requests: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read native stack records
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${{ github.repository }}/stacks"
