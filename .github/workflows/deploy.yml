name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        type: choice
        options:
          - staging
          - production
        default: staging

jobs:
  # The image ships the third-party notice bundle (#798). The reusable #545
  # workflow fails on an unknown or unaccepted licence or a missing licence
  # text, and build-and-push needs it, so no image is built or pushed without
  # a complete bundle. The bundle is the workspace-wide superset; a
  # gateway-only mode is tracked in #1093.
  third-party-notices:
    name: third-party-notices
    permissions:
      contents: read
    uses: ./.github/workflows/third-party-notices.yml

  build-and-push:
    name: Build, smoke test, push
    needs: third-party-notices
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download the third-party notice bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: third-party-notices
          path: third-party-notices

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.environment }}
            type=raw,value=latest,enable=${{ inputs.environment == 'production' }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: pigloros-gateway:${{ inputs.environment }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image carries its third-party notices
        run: bash scripts/check-gateway-image-notices.sh pigloros-gateway:${{ inputs.environment }}

      - name: Smoke test
        run: |
          docker run --rm -d -p 8080:8080 --name pigloros-smoke pigloros-gateway:${{ inputs.environment }}
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/health | grep '"ok":true'
          curl -sf http://localhost:8080/v1/ledger | grep '"domain":"piglor.com"'
          docker stop pigloros-smoke

      - name: Push to registry
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
