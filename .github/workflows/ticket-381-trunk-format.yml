name: ticket-381-trunk-format

on:
  push:
    branches: [codex/ticket-381-systemd-start]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          post-init: >-
            "${TRUNK_PATH}" fmt apps/pos-sandboxd/Cargo.toml
            apps/pos-sandboxd/src/system_bus/tests.rs
      - run: git diff --binary > ticket-381-trunk-format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: ticket-381-trunk-format-patch
          path: ticket-381-trunk-format.patch
