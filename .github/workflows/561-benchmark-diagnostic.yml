# Temporary #561 investigation branch only; never a gate or trusted baseline.
name: 561-test-cost-diagnostic

on:
  push:
    branches: [redmine/561-benchmark-diagnostic-0c05]

permissions:
  contents: read

jobs:
  profile-tests:
    runs-on: ubuntu-24.04
    # One 15-minute build, two bounded test runs, setup and evidence upload.
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -D warnings
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 1b24e5f272c2962ed8091687ac29426e2b862356
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Test diagnostic instrumentation
        run: python3 harness/scripts/diagnose_561_test_cost.py --self-test
      - name: Measure fixture and consumer cost without changing assertions
        run: python3 harness/scripts/diagnose_561_test_cost.py
      - name: Preserve untrusted diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: untrusted-561-test-cost-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
