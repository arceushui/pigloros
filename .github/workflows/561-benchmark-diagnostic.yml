# Temporary #561 investigation branch only; never a gate or trusted baseline.
name: 561-benchmark-diagnostic

on:
  push:
    branches: [redmine/561-benchmark-diagnostic-0c05]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: -D warnings
      PIGLOROS_BENCH_SAMPLES: "10"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 091f25b9747f06072be4c10fdad3d14652cbffe0
          path: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 0c05f32092401e06e0661bf7982304b9f8a0c282
          path: candidate
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - name: Test diagnostic sample validation
        run: python3 harness/scripts/diagnose_561_benchmark.py --self-test
      - name: Compare frozen unchanged binaries on one runner
        run: python3 harness/scripts/diagnose_561_benchmark.py
      - name: Preserve untrusted diagnostic evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: untrusted-561-abba-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
