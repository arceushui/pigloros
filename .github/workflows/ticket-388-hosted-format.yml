name: ticket-388-hosted-format

on:
  push:
    branches: [diagnostics/388-hosted-format]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          post-init: >-
            "${TRUNK_PATH}" fmt
            apps/pos-sandboxd/Cargo.toml
            apps/pos-sandboxd/src/kernel_cgroup.rs
            apps/pos-sandboxd/src/lib.rs
            apps/pos-sandboxd/src/system_bus.rs
            apps/pos-sandboxd/src/system_bus/tests.rs
      - run: git diff --binary > ticket-388-format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: ticket-388-format-patch
          path: ticket-388-format.patch
