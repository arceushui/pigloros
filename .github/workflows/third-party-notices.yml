# Third-party notice bundle (#545): the reusable generator.
#
# It builds THIRD-PARTY-NOTICES.txt and third-party-notices.json from the
# locked graphs and the committed third_party/notices texts, and uploads them
# as the `third-party-notices` artifact. It fails on an unknown or unaccepted
# licence, on a crate or component with no licence text, and on any notice
# text that no longer matches its recorded upstream commit and digest.
#
# CI calls it on every Rust-affecting change. Any release workflow that ships
# pos-plugin-worker (the only binary that links pos-plugin-host) or the
# compatibility fixtures must call it and ship its artifact; see
# docs/supply-chain.md.

name: third-party-notices

on:
  workflow_call:
    inputs:
      scope:
        description: workspace or gateway notice bundle
        type: string
        required: false
        default: workspace

permissions:
  contents: read

jobs:
  notices:
    name: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NOTICE_SCOPE: ${{ inputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2360a7c2f4b5f0f053ba7a7afa4f2dd8cd4b9609
      - name: Validate the requested notice scope
        run: |
          case "$NOTICE_SCOPE" in
            workspace|gateway) ;;
            *) echo "scope must be workspace or gateway" >&2; exit 1 ;;
          esac
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          # rust-src carries std's library/Cargo.lock; the wasm32 rlibs show
          # which crates the release ships for the Rust guests' target.
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Install cargo-about
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Check the committed notice texts against their upstream commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/third_party_notices.py verify-upstream
      - name: Generate the cargo-about reports from the locked graphs
        env:
          REPORTS: ${{ runner.temp }}/cargo-about
        run: |
          set -euo pipefail
          mkdir -p -- "${REPORTS}"
          cargo about generate --locked --fail --workspace --all-features \
            --config about.toml --format json --output-file "${REPORTS}/workspace.json"
          printf '%s\n' "Cargo.lock=${REPORTS}/workspace.json" >"${REPORTS}/graphs"
          if [[ "$NOTICE_SCOPE" == gateway ]]; then
            cargo metadata --locked --format-version 1 \
              --manifest-path apps/piglor-gateway/Cargo.toml \
              --filter-platform x86_64-unknown-linux-gnu > "${REPORTS}/gateway-metadata.json"
            RUSTC_BOOTSTRAP=1 cargo build --locked --release --bin piglor-gateway \
              --unit-graph -Z unstable-options > "${REPORTS}/gateway-units.json"
          else
            index=0
            while IFS= read -r lock; do
              index=$((index + 1))
              cargo about generate --locked --fail \
                --manifest-path "$(dirname -- "${lock}")/Cargo.toml" \
                --config third_party/about-guest.toml --format json \
                --output-file "${REPORTS}/guest-${index}.json"
              printf '%s\n' "${lock}=${REPORTS}/guest-${index}.json" >>"${REPORTS}/graphs"
            done < <(find plugins/community/examples -name Cargo.lock -type f | LC_ALL=C sort)
            python3 scripts/third_party_notices.py rust-std-report \
              --sysroot "$(rustc --print sysroot)" --output "${REPORTS}/rust-std.json"
            printf '%s\n' "rust-std=${REPORTS}/rust-std.json" >>"${REPORTS}/graphs"
          fi
      - name: Assemble the notice bundle
        env:
          REPORTS: ${{ runner.temp }}/cargo-about
          BUNDLE: ${{ runner.temp }}/third-party-notices
        run: |
          set -euo pipefail
          graphs=()
          while IFS= read -r graph; do
            graphs+=(--graph "${graph}")
          done <"${REPORTS}/graphs"
          scope_args=(--scope "$NOTICE_SCOPE")
          if [[ "$NOTICE_SCOPE" == gateway ]]; then
            scope_args+=(--cargo-metadata "${REPORTS}/gateway-metadata.json"
              --unit-graph "${REPORTS}/gateway-units.json")
          fi
          python3 scripts/third_party_notices.py assemble "${graphs[@]}" \
            "${scope_args[@]}" --sysroot "$(rustc --print sysroot)" --output "${BUNDLE}"
          sha256sum -- "${BUNDLE}"/*
      - name: Upload the notice bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: third-party-notices
          path: ${{ runner.temp }}/third-party-notices
          if-no-files-found: error
      - name: Capture the exact gateway proof inputs
        env:
          REPORTS: ${{ runner.temp }}/cargo-about
        run: |
          set -euo pipefail
          git rev-parse HEAD HEAD^{tree} > "${REPORTS}/source.txt"
          git ls-files -z -- '*.rs' '**/Cargo.toml' Cargo.toml Cargo.lock rust-toolchain.toml \
            Dockerfile about.toml .cargo/config.toml scripts/third_party_notices.py \
            .github/workflows/third-party-notices.yml \
            | xargs -0 sha256sum > "${REPORTS}/source.sha256"
      - name: Upload the bounded gateway proof inputs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-mode-inputs
          path: ${{ runner.temp }}/cargo-about
          if-no-files-found: error
