name: content-lock-resolution

on:
  push:
    branches: [redmine/574-bundle-checker]
    paths:
      - Cargo.toml
      - crates/pos-plugin-content/Cargo.toml
      - .github/workflows/content-lock-resolution.yml

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - name: Resolve the authorized offline checker dependency on the hosted runner
        run: cargo metadata --format-version 1 > "${{ runner.temp }}/content-metadata.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: content-lock-${{ github.sha }}
          path: |
            Cargo.lock
            ${{ runner.temp }}/content-metadata.json
          if-no-files-found: error
