# Temporary Runtime boundary evidence, not a required gate or support promise.
name: 561-runtime-width-diagnostic

on:
  push:
    branches: [redmine/561-runtime-width-diagnostic]

permissions:
  contents: read

jobs:
  runtime-width:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: i686-unknown-linux-gnu
            width: "32"
          - target: x86_64-unknown-linux-gnu
            width: "64"
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -D warnings
      DIAGNOSTIC_TARGET: ${{ matrix.target }}
      DIAGNOSTIC_WIDTH: ${{ matrix.width }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 15f787f1984c9242bc4efaa1a481f29876696c56
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}
          components: llvm-tools-preview, clippy
      - name: Install hosted 32-bit native linker and runtime
        if: matrix.width == '32'
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        timeout-minutes: 4
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record exact source and actual target width
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = 15f787f1984c9242bc4efaa1a481f29876696c56
          rustc -Vv | tee artifacts/rustc.txt
          rustc --print cfg --target "$DIAGNOSTIC_TARGET" | tee artifacts/target-cfg.txt
          grep -Fx "target_pointer_width=\"$DIAGNOSTIC_WIDTH\"" artifacts/target-cfg.txt
          cargo llvm-cov --version | tee artifacts/llvm-cov-version.txt
          id | tee artifacts/runner-identity.txt
          test "$(id -u)" -ne 0
      - name: Execute the exact oversized-count sender boundary
        timeout-minutes: 18
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 16m \
            cargo llvm-cov --target "$DIAGNOSTIC_TARGET" --coverage-target-only \
            -p pos-runtime --all-features --locked --lib \
            --json --output-path artifacts/coverage.json \
            -- erasure_host::tests::world_replay_boundaries::oversized_native_event_counts_refuse_before_materialization \
            --exact --include-ignored 2>&1 | tee artifacts/test.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/test.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/test.log
          python3 - <<'PY' | tee artifacts/target-region.json
          import json
          import os
          from pathlib import Path
          path = "crates/pos-runtime/src/erasure_host/world_replay_read.rs"
          assert Path(path).read_text().splitlines()[203].strip() == "let count = usize::try_from(count).map_err(|_| Error::AdapterFailure)?;"
          report = json.loads(Path("artifacts/coverage.json").read_text())
          files = [entry for data in report["data"] for entry in data["files"]
                   if entry["filename"].endswith("/" + path)]
          assert len(files) == 1, "expected exactly one Runtime reader coverage entry"
          segments = [segment for segment in files[0]["segments"] if segment[0] == 204]
          print(json.dumps({"path": path, "line": 204, "segments": segments}))
          target = [segment for segment in segments if segment[1] == 74
                    and segment[3] and segment[4] and not segment[5]]
          assert len(target) == 1, "missing or ambiguous conversion refusal segment"
          width = os.environ["DIAGNOSTIC_WIDTH"]
          assert width in ("32", "64"), "unexpected target width"
          assert target[0][2] == (1 if width == "32" else 0), "unexpected conversion refusal count"
          PY
      - name: Strict native Runtime test compilation lint
        if: matrix.width == '64'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7m \
            cargo clippy -p pos-runtime --all-features --all-targets --locked \
            -- -D warnings -W clippy::pedantic 2>&1 | tee artifacts/clippy.log
      - name: Preserve bounded component evidence even on failure
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-561-runtime-width-${{ matrix.width }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
