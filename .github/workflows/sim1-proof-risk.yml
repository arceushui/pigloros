# Temporary manual-only #437 fixture producer; never shipped in the test PR.
name: sim1-proof-risk

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zero-width-fixture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  zero-width-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 7c322f838127662601c24c01225c14d3f854c11e
          persist-credentials: false
      - name: Generate one signed zero-width certificate and detached proof
        env:
          FIXTURE_SOURCE: 7c322f838127662601c24c01225c14d3f854c11e
          FIXTURE_OUTPUT: ${{ runner.temp }}/zero-width-fixture
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$FIXTURE_SOURCE"
          mkdir -m 700 "$FIXTURE_OUTPUT"
          fixture_private="$(mktemp -d "${RUNNER_TEMP}/zero-width-private.XXXXXX")"
          trap 'rm -rf -- "$fixture_private"' EXIT
          cp crates/pos-reference/tests/vectors/sim1-pkcs7/root-hash.txt "$fixture_private/root-hash.txt"
          cd "$fixture_private"
          mkdir issued
          : > index.txt
          printf '01\n' > serial
          cat > ca.cnf <<'CONFIG'
          [ca]
          default_ca = fixture_ca
          [fixture_ca]
          database = index.txt
          new_certs_dir = issued
          serial = serial
          certificate = bootstrap.pem
          private_key = key.pem
          default_md = sha256
          default_days = 1
          policy = fixture_policy
          x509_extensions = fixture_leaf
          [fixture_policy]
          commonName = supplied
          [fixture_leaf]
          basicConstraints = critical,CA:FALSE
          keyUsage = critical,digitalSignature
          extendedKeyUsage = codeSigning
          CONFIG
          openssl version -a > "$FIXTURE_OUTPUT/openssl-version.txt"
          openssl req -new -newkey rsa:2048 -nodes -sha256 \
            -keyout key.pem -out request.pem -subj '/CN=SIM1 zero-width fixture'
          openssl x509 -req -in request.pem -signkey key.pem -sha256 \
            -set_serial 2 -days 1 -out bootstrap.pem
          openssl ca -batch -selfsign -config ca.cnf -in request.pem \
            -keyfile key.pem -cert bootstrap.pem -md sha256 -notext \
            -startdate 20270115080000Z -enddate 20270115080000Z -out certificate.pem
          openssl x509 -in certificate.pem -outform DER -out "$FIXTURE_OUTPUT/zero-width-signer.der"
          openssl smime -sign -binary -noattr -md sha256 \
            -in root-hash.txt -signer certificate.pem -inkey key.pem \
            -outform DER -out "$FIXTURE_OUTPUT/zero-width-proof.der"
          openssl verify -no_check_time -check_ss_sig -purpose any \
            -CAfile certificate.pem certificate.pem > "$FIXTURE_OUTPUT/crypto-controls.log" 2>&1
          openssl cms -verify -binary -inform DER -in "$FIXTURE_OUTPUT/zero-width-proof.der" \
            -content root-hash.txt -noverify -out verified-content.bin \
            >> "$FIXTURE_OUTPUT/crypto-controls.log" 2>&1
          cmp root-hash.txt verified-content.bin
          openssl x509 -in certificate.pem -noout -startdate -enddate -serial -subject -issuer \
            > "$FIXTURE_OUTPUT/certificate-identity.txt"
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path
          output = Path(os.environ['FIXTURE_OUTPUT'])
          identity = dict(line.split('=', 1) for line in (output / 'certificate-identity.txt').read_text().splitlines())
          for name in ['notBefore', 'notAfter']:
              value = datetime.datetime.strptime(identity[name], '%b %d %H:%M:%S %Y GMT').replace(tzinfo=datetime.timezone.utc)
              assert int(value.timestamp()) == 1_800_000_000
          assert identity['issuer'] == identity['subject']
          files = {}
          for name in ['zero-width-signer.der', 'zero-width-proof.der', 'openssl-version.txt', 'certificate-identity.txt', 'crypto-controls.log']:
              data = (output / name).read_bytes()
              assert 0 < len(data) < 64 * 1024
              files[name] = {'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
          manifest = {'source_checkout': os.environ['FIXTURE_SOURCE'], 'producer_commit': os.environ['GITHUB_SHA'],
                      'validity_unix_seconds': [1_800_000_000, 1_800_000_000], 'files': files,
                      'root_hash_sha256': hashlib.sha256(Path('root-hash.txt').read_bytes()).hexdigest(),
                      'controls': ['certificate self-signature verified with time checking disabled', 'detached CMS signature verified without certificate path validation', 'detached content byte equality'],
                      'limits': 'Offline fixture generation only. No project public-verifier, time-acceptance, native, heap or whole-ticket claim. Private key never uploaded.'}
          (output / 'fixture-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          print(json.dumps({'generated_public_files': list(files), 'validity_unix_seconds': manifest['validity_unix_seconds']}))
          PY
      - name: Upload only public fixture bytes and provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-zero-width-fixture
          path: |
            ${{ runner.temp }}/zero-width-fixture/zero-width-signer.der
            ${{ runner.temp }}/zero-width-fixture/zero-width-proof.der
            ${{ runner.temp }}/zero-width-fixture/openssl-version.txt
            ${{ runner.temp }}/zero-width-fixture/certificate-identity.txt
            ${{ runner.temp }}/zero-width-fixture/crypto-controls.log
            ${{ runner.temp }}/zero-width-fixture/fixture-manifest.json
          if-no-files-found: error
          retention-days: 7
