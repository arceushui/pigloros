name: sandbox lockfile bootstrap

on:
  pull_request:
    paths:
      - apps/pos-sandboxd/Cargo.toml
      - .github/workflows/sandbox-lockfile-bootstrap.yml

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'codex/439-mount-image-transport'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - name: Resolve new development dependency on the hosted runner
        run: cargo update --workspace
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-439-lockfile
          path: Cargo.lock
          if-no-files-found: error
