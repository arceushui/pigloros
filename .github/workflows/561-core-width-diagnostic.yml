# Temporary component evidence, not a required gate or a platform-support claim.
name: 561-core-width-diagnostic

on:
  push:
    branches: [redmine/561-core-width-diagnostic]

permissions:
  contents: read

jobs:
  core-width:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      RUSTC_BOOTSTRAP: "1"
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 5fecde3f3db4be4f07bf901b740e472eaf0a70cf
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: 1.97.1
          targets: i686-unknown-linux-gnu
          components: llvm-tools-preview
      - name: Install hosted 32-bit native linker and runtime
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes gcc-multilib
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        timeout-minutes: 4
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record exact source and actual target width
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = 5fecde3f3db4be4f07bf901b740e472eaf0a70cf
          rustc -Vv | tee artifacts/rustc.txt
          rustc --print cfg --target i686-unknown-linux-gnu | tee artifacts/target-cfg.txt
          grep -Fx 'target_pointer_width="32"' artifacts/target-cfg.txt
          cargo llvm-cov --version | tee artifacts/llvm-cov-version.txt
          id | tee artifacts/runner-identity.txt
          test "$(id -u)" -ne 0
      - name: Execute the existing public malformed-length witness on 32-bit
        timeout-minutes: 12
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 10m \
            cargo llvm-cov --target i686-unknown-linux-gnu --coverage-target-only \
            -p pos-core --all-features --locked --test key_registry_guarded_read_public \
            --json --output-path artifacts/coverage.json \
            -- owner_faults_and_impossible_cardinalities_do_not_allocate_declared_aggregates \
            --exact --include-ignored 2>&1 | tee artifacts/test.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/test.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/test.log
          python3 - <<'PY' | tee artifacts/target-region.json
          import json
          from pathlib import Path
          path = "crates/pos-core/src/key_registry/durable_cbor/cursor.rs"
          assert Path(path).read_text().splitlines()[81].strip() == ".map_err(|_| Error::InvalidSnapshot)?;"
          report = json.loads(Path("artifacts/coverage.json").read_text())
          files = [entry for data in report["data"] for entry in data["files"]
                   if entry["filename"].endswith("/" + path)]
          assert len(files) == 1, "expected exactly one native cursor coverage entry"
          segments = [segment for segment in files[0]["segments"] if segment[0] == 82]
          print(json.dumps({"path": path, "line": 82, "segments": segments}))
          assert any(segment[1] == 61 and segment[2] > 0 and segment[3]
                     and segment[4] and not segment[5] for segment in segments), "conversion refusal did not execute"
          PY
      - name: Preserve bounded component evidence even on failure
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-561-core-width-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 7
