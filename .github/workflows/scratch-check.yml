name: scratch-check
on:
  push:
    branches: [scratch/check448]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: redmine/578-airgapped-profile
            id: f578
            base: redmine/577-failure-surface
            pkg: "-p pos-plugin-supervisor"
          - ref: redmine/582-install-entry
            id: f582
            base: redmine/581-gate-and-world-builders
            pkg: "-p pos-runtime"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: lock, rustfmt (workspace and standalone) and publish patch
        run: |
          cargo metadata --format-version 1 >/dev/null
          (cd fuzz && cargo metadata --format-version 1 >/dev/null) || true
          cargo fmt --all
          for f in $(git diff --name-only origin/${{ matrix.base }}...HEAD -- '*.rs'); do [ -f "$f" ] && rustfmt --edition 2021 --config max_width=100 --config style_edition=2021 "$f"; done
          git --no-pager diff --stat
          git diff > /tmp/fmt.patch
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -B out-${{ matrix.id }}
          mkdir -p fmtout && cp /tmp/fmt.patch fmtout/${{ matrix.id }}.patch
          git add -f fmtout && git commit -q -m out && git push -q -f origin out-${{ matrix.id }}:refs/heads/scratch/out-${{ matrix.id }}
          git checkout -q -f ${{ matrix.ref }}
          git apply --allow-empty /tmp/fmt.patch
