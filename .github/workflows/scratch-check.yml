name: scratch-check
on:
  push:
    branches: [scratch/check448]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: redmine/583-driver-wiring
            id: p583
            base: redmine/582-install-entry
            pkg: "-p pos-runtime -p pos-plugin-host -p pos-plugin-supervisor -p pos-plugin-publisher -p pos-crypto -p pos-plugin-release -p pos-plugin-worker"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0
      - name: lock, rustfmt (workspace and standalone) and publish patch
        run: |
          cargo metadata --format-version 1 >/dev/null
          (cd fuzz && cargo metadata --format-version 1 >/dev/null) || true
          cargo fmt --all
          for f in $(git diff --name-only origin/${{ matrix.base }}...HEAD -- '*.rs'); do [ -f "$f" ] && rustfmt --edition 2021 --config max_width=100 --config style_edition=2021 "$f"; done
          git --no-pager diff --stat
          git diff > /tmp/fmt.patch
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -B out-${{ matrix.id }}
          mkdir -p fmtout && cp /tmp/fmt.patch fmtout/${{ matrix.id }}.patch
          git add -f fmtout && git commit -q -m out && git push -q -f origin out-${{ matrix.id }}:refs/heads/scratch/out-${{ matrix.id }}
          git checkout -q -f ${{ matrix.ref }}
          git apply --allow-empty /tmp/fmt.patch
      - name: clippy keep-going
        run: |
          CARGO_TERM_COLOR=never cargo clippy --keep-going --message-format=short --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic > /tmp/clippy.log 2>&1 || true
          grep -E 'error|warning' /tmp/clippy.log | grep -E '(crates|apps)/' | sort -u | head -80
      - name: tests
        run: |
          CARGO_TERM_COLOR=never cargo test --no-fail-fast ${{ matrix.pkg }} --all-features > /tmp/test.log 2>&1 || true
          grep -E '^error|^test .* FAILED|^---- |test result: FAILED|panicked' /tmp/test.log | head -80
          grep -c 'test result: ok' /tmp/test.log
      - name: reserved draft test with output
        run: |
          RUST_BACKTRACE=1 cargo test -p pos-runtime --all-features --test protected_consent a_driver_draft_of_the_reserved -- --nocapture --test-threads=1 2>&1 | tail -40
