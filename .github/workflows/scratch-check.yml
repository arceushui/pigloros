name: scratch-check
on:
  push:
    branches: [scratch/check448]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ref: redmine/568-plugin-trust-registry-port
            id: p568
            pkg: pos-store
            test: ""
          - ref: redmine/575-trust-authorization-accessors
            id: p575
            pkg: pos-crypto
            test: ""
          - ref: redmine/567-plugin-trust-bridge
            id: p567
            pkg: pos-conformance
            test: "--test plugin_trust_bridge_public"
          - ref: redmine/570-pmf1-encoder-signature
            id: p570
            pkg: pos-crypto
            test: ""
          - ref: redmine/571-release-publisher
            id: p571
            pkg: "pos-plugin-publisher -p pos-plugin-release"
            test: ""
          - ref: redmine/572-historical-verifier
            id: p572
            pkg: "pos-plugin-publisher"
            test: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - name: rustfmt and publish patch
        run: |
          cargo metadata --format-version 1 >/dev/null
          cargo fmt --all
          git --no-pager diff --stat
          git diff > /tmp/fmt.patch
          git config user.name ci && git config user.email ci@example.com
          git checkout -q -B out-${{ matrix.id }}
          mkdir -p fmtout && cp /tmp/fmt.patch fmtout/${{ matrix.id }}.patch
          git add -f fmtout && git commit -q -m out && git push -q -f origin out-${{ matrix.id }}:refs/heads/scratch/out-${{ matrix.id }}
          git checkout -q -f ${{ matrix.ref }} 2>/dev/null || git checkout -q -f HEAD~1
      - name: clippy keep-going
        run: |
          CARGO_TERM_COLOR=never cargo clippy --keep-going --message-format=short --locked --workspace --all-targets --all-features -- -D warnings -W clippy::pedantic 2>&1 | grep -E 'error|warning' | grep -E 'crates/pos-(conformance|crypto|plugin-publisher|plugin-release|store)' | sort -u | head -80
      - name: targeted tests
        run: |
          CARGO_TERM_COLOR=never cargo test --locked -p ${{ matrix.pkg }} ${{ matrix.test }} 2>&1 | grep -E -A14 '^---- |^error(\[|:)|test result' | head -200
