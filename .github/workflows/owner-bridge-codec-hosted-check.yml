name: owner-bridge-codec hosted check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - name: Generate the candidate lockfile
        run: cargo generate-lockfile
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Compile and test the codec
        run: cargo test -p pos-owner-bridge-codec --locked
      - name: Lint the codec
        run: cargo clippy -p pos-owner-bridge-codec --all-targets --locked -- -D warnings -W clippy::pedantic
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: owner-bridge-codec-generated-lockfile
          path: Cargo.lock
          if-no-files-found: error
