name: sandbox-provider-prototype

on:
  pull_request:
    paths:
      - prototypes/sandbox-provider-feasibility/**
      - .github/workflows/sandbox-provider-prototype.yml
      - docs/research/sandbox-provider-*.md
  workflow_dispatch:

concurrency:
  group: sandbox-provider-prototype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pinned-host-profile:
    name: pinned-host-profile (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            nix_system: x86_64-linux
            runner: ubuntu-26.04
          - architecture: aarch64
            nix_system: aarch64-linux
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Record exact Nix input identity
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          nix flake metadata --json --no-write-lock-file \
            | jq '{locks: .locks, path: .path}' \
            | tee pinned-flake-metadata.json
          test "$(jq -r '.locks.nodes.nixpkgs.locked.rev' pinned-flake-metadata.json)" \
            = 6713828a351efa628b025a1adf7f43cbf8597513
      - name: Prove the pinned disposable host profile
        working-directory: prototypes/sandbox-provider-feasibility
        env:
          NIX_SYSTEM: ${{ matrix.nix_system }}
        run: |
          set -o pipefail
          nix build --print-build-logs --no-write-lock-file \
            ".#checks.${NIX_SYSTEM}.sandbox-provider-host-profile" \
            2>&1 | tee pinned-host-profile.txt
          grep -q 'PINNED_HOST_IDENTITY;' pinned-host-profile.txt
          grep -q 'systemd=systemd 260 ' pinned-host-profile.txt
          grep -q 'kernel=6.12.' pinned-host-profile.txt
          grep -q 'cgroup_kill=present' pinned-host-profile.txt
          grep -q 'dm_verity=present' pinned-host-profile.txt
          grep -q 'vm_external_egress=blocked' pinned-host-profile.txt
          grep -q 'PINNED_NAMESPACE_PROBE;namespace_entry_lifecycle=retained-fd-full-set-entered-' \
            pinned-host-profile.txt
      - name: Record pinned VM closure
        working-directory: prototypes/sandbox-provider-feasibility
        run: nix path-info --json --recursive ./result >pinned-host-closure.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-provider-pinned-host-${{ matrix.architecture }}
          path: |
            prototypes/sandbox-provider-feasibility/pinned-flake-metadata.json
            prototypes/sandbox-provider-feasibility/pinned-host-closure.json
            prototypes/sandbox-provider-feasibility/pinned-host-profile.txt
          if-no-files-found: error
          retention-days: 14

  typed-control-plane:
    name: typed-control-plane (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-26.04
            youki_architecture: x86_64
            youki_archive_sha256: fb4013e16592b257038bfdeb4ddcddc0f05e258b324c1bac283c97ee39b8cd68
          - architecture: aarch64
            runner: ubuntu-26.04-arm
            youki_architecture: aarch64
            youki_archive_sha256: 38f4ec9b4e7df442a55513144282f27a07f5474c1cdb777cedda18ba0cf63e6d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: clippy,rustfmt
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-deny

      - name: Generate isolated prototype lockfile
        working-directory: prototypes/sandbox-provider-feasibility
        run: cargo generate-lockfile

      - name: Check exact dependency composition
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          cargo fmt --check
          cargo check --locked
          cargo clippy --locked -- -D warnings
          cargo deny --locked check 2>&1 | tee cargo-deny.txt

      - name: Verify effective MSRV
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          cargo +1.87.0 check --locked

      - name: Run unprivileged typed-interface probe
        working-directory: prototypes/sandbox-provider-feasibility
        run: cargo run --locked

      - name: Capture host capability identity
        working-directory: prototypes/sandbox-provider-feasibility
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          {
            printf 'expected_architecture=%s\n' "$EXPECTED_ARCHITECTURE"
            printf 'observed_architecture=%s\n' "$(uname -m)"
            printf 'kernel_release=%s\n' "$(uname -r)"
            printf 'systemd_version=%s\n' "$(systemctl --version | head -1)"
            printf 'runner_image_os=%s\n' "${ImageOS:-unknown}"
            printf 'runner_image_version=%s\n' "${ImageVersion:-unknown}"
            printf 'cgroup_filesystem=%s\n' "$(stat -fc %T /sys/fs/cgroup)"
            printf 'cgroup_controllers=%s\n' "$(tr '\n' ' ' </sys/fs/cgroup/cgroup.controllers)"
            printf 'cgroup_kill=%s\n' "$(test -e /sys/fs/cgroup/cgroup.kill && printf present || printf absent)"
          } | tee host-capabilities.txt

      - name: Run one privileged lifecycle probe
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          sudo ./target/debug/sandbox-provider-feasibility \
            --privileged --offline --attempt-id initial | tee privileged-initial.txt
          grep -q 'network_isolation=isolated-no-host-net' privileged-initial.txt
          grep -Eq 'namespace_descriptor=(retained-fd-full-set-child-exit-drop-ok|required-full-set-unsupported)' privileged-initial.txt

      - name: Prove applied cgroup resource limits
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          sudo ./target/debug/sandbox-provider-feasibility \
            --privileged --offline --cgroup-limits --attempt-id limits \
            | tee cgroup-limits.txt
          grep -q 'cgroup_limits=memory-cpu-pids-io-read-back-ok' cgroup-limits.txt
          grep -q 'stop_requested=true;worker_reaped=true;unit_absent=true' cgroup-limits.txt

      - name: Enter retained namespace descriptors and prove controlled teardown
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          sudo ./target/debug/sandbox-provider-feasibility \
            --namespace-entry-lifecycle | tee namespace-entry-lifecycle.txt
          if ! grep -q '^namespace_entry_lifecycle=retained-fd-full-set-entered-' \
            namespace-entry-lifecycle.txt; then
            grep -q '^namespace_entry_lifecycle=required-full-set-unsupported;' \
              namespace-entry-lifecycle.txt
            grep -q 'mnt:entered-post-exit-fd-ok-post-drop-process-absent' \
              namespace-entry-lifecycle.txt
            grep -q 'pid:entered-post-exit-fd-ok-post-drop-process-absent' \
              namespace-entry-lifecycle.txt
            grep -q 'ipc:entered-post-exit-fd-ok-post-drop-process-absent' \
              namespace-entry-lifecycle.txt
            grep -q 'uts:entered-post-exit-fd-ok-post-drop-process-absent' \
              namespace-entry-lifecycle.txt
            grep -q 'user:unsupported' namespace-entry-lifecycle.txt
            grep -q 'net:entered-post-exit-fd-ok-post-drop-process-absent' \
              namespace-entry-lifecycle.txt
          fi

      - name: Execute the youki lifecycle comparator
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          bash run-youki-comparator.sh \
            '${{ matrix.youki_architecture }}' \
            '${{ matrix.youki_archive_sha256 }}'
          grep -q '^youki_comparator=executed-cleanup-ok$' youki-comparator.txt
          grep -q '^network_policy=external-not-proved$' youki-comparator.txt
          grep -q '^signed_image_admission=external-not-proved$' youki-comparator.txt

      - name: Exercise eight concurrent attempts
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          pids=()
          for attempt in $(seq 1 8); do
            sudo ./target/debug/sandbox-provider-feasibility --privileged \
              --offline --attempt-id "concurrent${attempt}" >"concurrent-${attempt}.txt" &
            pids+=("$!")
          done
          for pid in "${pids[@]}"; do
            wait "$pid"
          done
          grep -h '^attempt=' concurrent-*.txt | sort | tee concurrent-summary.txt
          test "$(wc -l <concurrent-summary.txt)" -eq 8
          test "$(grep -c 'network_isolation=isolated-no-host-net' concurrent-summary.txt)" -eq 8
          test "$(grep -Ec 'typed-create-(stop|auto-cleanup)-ok' concurrent-summary.txt)" -eq 8
          test "$(grep -c 'typed-create-read-delete-ok' concurrent-summary.txt)" -eq 8
          test "$(grep -c 'typed-read-ok' concurrent-summary.txt)" -eq 8
          test "$(grep -c 'typed-default-drop-allow-read-back-delete-ok' concurrent-summary.txt)" -eq 8
          test "$(grep -Ec 'namespace_descriptor=(retained-fd-full-set-child-exit-drop-ok|required-full-set-unsupported)' concurrent-summary.txt)" -eq 8

      - name: Prove broker-death descendant cleanup
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          : >broker-death.txt
          sudo ./target/debug/sandbox-provider-feasibility \
            --privileged --offline --broker-death --attempt-id death \
            >broker-death.txt &
          launcher_pid=$!
          for _ in $(seq 1 100); do
            grep -q '^broker-ready;' broker-death.txt && break
            sleep 0.1
          done
          grep -q '^broker-ready;network_isolation=isolated-no-host-net;' broker-death.txt
          broker_pid=$(sed -n 's/.*;broker_pid=\([0-9]*\);.*/\1/p' broker-death.txt)
          worker_pid=$(sed -n 's/.*;worker_pid=\([0-9]*\);.*/\1/p' broker-death.txt)
          leaf_pid=$(sed -n 's/.*;leaf_pid=\([0-9]*\)$/\1/p' broker-death.txt)
          test -n "$broker_pid" && test -n "$worker_pid" && test -n "$leaf_pid"
          recovery_started=$(date +%s%N)
          sudo kill -KILL "$broker_pid"
          wait "$launcher_pid" || true
          process_state() {
            if test -r "/proc/$1/stat"; then
              awk '{ print $3 }' "/proc/$1/stat"
            else
              printf 'absent\n'
            fi
          }
          process_live() {
            state=$(process_state "$1")
            test "$state" != absent && test "$state" != Z
          }
          termination_poll_count=0
          for termination_poll_count in $(seq 1 100); do
            if ! process_live "$worker_pid" && ! process_live "$leaf_pid"; then
              break
            fi
            sleep 0.1
          done
          printf 'termination_poll_count=%s;worker_state=%s;leaf_state=%s\n' \
            "$termination_poll_count" "$(process_state "$worker_pid")" \
            "$(process_state "$leaf_pid")" | tee -a broker-death.txt
          ! process_live "$worker_pid"
          ! process_live "$leaf_pid"
          for _ in $(seq 1 100); do
            cleanup=$(sudo ./target/debug/sandbox-provider-feasibility \
              --privileged --offline --check-broker-clean --attempt-id death)
            if grep -q '^broker-clean;' <<<"$cleanup"; then
              printf '%s\n' "$cleanup" | tee -a broker-death.txt
              break
            fi
            sleep 0.1
          done
          grep -q '^broker-clean;' broker-death.txt
          recovery_us=$(( ($(date +%s%N) - recovery_started) / 1000 ))
          printf 'broker_death_recovery_us=%s\n' "$recovery_us" | tee -a broker-death.txt
          test "$recovery_us" -le 10000000

      - name: Prove restart reconciliation of an orphaned attempt
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          sudo ./target/debug/sandbox-provider-feasibility \
            --privileged --offline --inject-orphan --attempt-id restart \
            | tee restart-reconciliation.txt
          grep -q '^orphan-ready;network_isolation=isolated-no-host-net;' \
            restart-reconciliation.txt
          worker_pid=$(sed -n 's/.*;worker_pid=\([0-9]*\);.*/\1/p' \
            restart-reconciliation.txt)
          leaf_pid=$(sed -n 's/.*;leaf_pid=\([0-9]*\)$/\1/p' \
            restart-reconciliation.txt)
          test -n "$worker_pid" && test -n "$leaf_pid"
          process_state() {
            if test -r "/proc/$1/stat"; then
              awk '{ print $3 }' "/proc/$1/stat"
            else
              printf 'absent\n'
            fi
          }
          process_live() {
            state=$(process_state "$1")
            test "$state" != absent && test "$state" != Z
          }
          process_live "$worker_pid"
          process_live "$leaf_pid"
          recovery_started=$(date +%s%N)
          sudo ./target/debug/sandbox-provider-feasibility \
            --privileged --offline --reconcile-orphan --attempt-id restart \
            | tee -a restart-reconciliation.txt
          grep -Eq '^orphan-reconcile-(requested|complete);' \
            restart-reconciliation.txt
          termination_poll_count=0
          for termination_poll_count in $(seq 1 100); do
            if ! process_live "$worker_pid" && ! process_live "$leaf_pid"; then
              break
            fi
            sleep 0.1
          done
          printf 'termination_poll_count=%s;worker_state=%s;leaf_state=%s\n' \
            "$termination_poll_count" "$(process_state "$worker_pid")" \
            "$(process_state "$leaf_pid")" | tee -a restart-reconciliation.txt
          ! process_live "$worker_pid"
          ! process_live "$leaf_pid"
          for _ in $(seq 1 100); do
            cleanup=$(sudo ./target/debug/sandbox-provider-feasibility \
              --privileged --offline --check-orphan-clean --attempt-id restart)
            if grep -q '^orphan-clean;' <<<"$cleanup"; then
              printf '%s\n' "$cleanup" | tee -a restart-reconciliation.txt
              break
            fi
            sleep 0.1
          done
          grep -q '^orphan-clean;' restart-reconciliation.txt
          recovery_us=$(( ($(date +%s%N) - recovery_started) / 1000 ))
          printf 'restart_reconciliation_us=%s\n' "$recovery_us" \
            | tee -a restart-reconciliation.txt
          test "$recovery_us" -le 10000000

      - name: Record normal cancellation and forced cleanup distributions
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          percentile_95() {
            file="$1"
            field="$2"
            tr ';' '\n' <"$file" |
              awk -F= -v field="$field" '$1 == field { print $2 }' |
              sort -n | sed -n '29p'
          }
          : >cleanup-p95.txt
          for mode in normal cancel forced; do
            samples="cleanup-${mode}-samples.txt"
            : >"$samples"
            for attempt in $(seq 1 30); do
              sudo ./target/debug/sandbox-provider-feasibility \
                --privileged --offline --cleanup-sample \
                --cleanup-mode "$mode" --attempt-id "${mode}${attempt}" \
                >>"$samples"
            done
            test "$(wc -l <"$samples")" -eq 30
            test "$(grep -c "cleanup_sample=${mode}" "$samples")" -eq 30
            test "$(grep -c 'network_isolation=isolated-no-host-net' "$samples")" -eq 30
            test "$(grep -c 'unit_absent=true' "$samples")" -eq 30
            launch_p95=$(percentile_95 "$samples" launch_us)
            cleanup_p95=$(percentile_95 "$samples" cleanup_us)
            printf '%s_launch_us_p95=%s\n%s_cleanup_us_p95=%s\n' \
              "$mode" "$launch_p95" "$mode" "$cleanup_p95" \
              | tee -a cleanup-p95.txt
            test "$launch_p95" -le 2000000
            if test "$mode" = forced; then
              test "$cleanup_p95" -le 5000000
            else
              test "$cleanup_p95" -le 2000000
            fi
          done

      - name: Record thirty sequential lifecycle samples
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          : >lifecycle-samples.txt
          for attempt in $(seq 1 30); do
            sudo ./target/debug/sandbox-provider-feasibility --privileged \
              --offline --attempt-id "sample${attempt}" | grep '^attempt=' >>lifecycle-samples.txt
          done
          test "$(wc -l <lifecycle-samples.txt)" -eq 30
          test "$(grep -c 'network_isolation=isolated-no-host-net' lifecycle-samples.txt)" -eq 30
          test "$(grep -Ec 'typed-create-(stop|auto-cleanup)-ok' lifecycle-samples.txt)" -eq 30
          test "$(grep -c 'typed-create-read-delete-ok' lifecycle-samples.txt)" -eq 30
          test "$(grep -c 'typed-default-drop-allow-read-back-delete-ok' lifecycle-samples.txt)" -eq 30
          test "$(grep -Ec 'namespace_descriptor=(retained-fd-full-set-child-exit-drop-ok|required-full-set-unsupported)' lifecycle-samples.txt)" -eq 30
          percentile_95() {
            field="$1"
            tr ';' '\n' <lifecycle-samples.txt |
              awk -F= -v field="$field" '$1 == field { print $2 }' |
              sort -n | sed -n '29p'
          }
          {
            for field in transient_slice_us dummy_link_us nftables_atomic_us namespace_us total_us; do
              printf '%s_p95=%s\n' "$field" "$(percentile_95 "$field")"
            done
          } | tee lifecycle-p95.txt
          test "$(percentile_95 total_us)" -le 2000000

      - name: Record dependency and source evidence inputs
        working-directory: prototypes/sandbox-provider-feasibility
        run: |
          set -euo pipefail
          cargo tree --locked --color never | tee dependency-tree.txt
          cargo metadata --locked --format-version 1 >dependency-metadata.json
          jq '[.packages[] | {name, version, source, license, rust_version}]' \
            dependency-metadata.json >dependency-packages.json
          sha256sum Cargo.lock >lockfile-digest.txt
          find src -type f -print0 | sort -z | xargs -0 sha256sum >source-digests.txt
          rustc --version --verbose >rust-toolchain-evidence.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sandbox-provider-prototype-evidence-${{ matrix.architecture }}
          path: |
            prototypes/sandbox-provider-feasibility/Cargo.lock
            prototypes/sandbox-provider-feasibility/cargo-deny.txt
            prototypes/sandbox-provider-feasibility/broker-death.txt
            prototypes/sandbox-provider-feasibility/cgroup-limits.txt
            prototypes/sandbox-provider-feasibility/cleanup-*-samples.txt
            prototypes/sandbox-provider-feasibility/cleanup-p95.txt
            prototypes/sandbox-provider-feasibility/concurrent-*.txt
            prototypes/sandbox-provider-feasibility/dependency-metadata.json
            prototypes/sandbox-provider-feasibility/dependency-packages.json
            prototypes/sandbox-provider-feasibility/dependency-tree.txt
            prototypes/sandbox-provider-feasibility/host-capabilities.txt
            prototypes/sandbox-provider-feasibility/lifecycle-samples.txt
            prototypes/sandbox-provider-feasibility/lockfile-digest.txt
            prototypes/sandbox-provider-feasibility/lifecycle-p95.txt
            prototypes/sandbox-provider-feasibility/namespace-entry-lifecycle.txt
            prototypes/sandbox-provider-feasibility/youki-comparator.txt
            prototypes/sandbox-provider-feasibility/youki-comparator-evidence
            prototypes/sandbox-provider-feasibility/privileged-initial.txt
            prototypes/sandbox-provider-feasibility/restart-reconciliation.txt
            prototypes/sandbox-provider-feasibility/rust-toolchain-evidence.txt
            prototypes/sandbox-provider-feasibility/source-digests.txt
          if-no-files-found: error
          retention-days: 14
