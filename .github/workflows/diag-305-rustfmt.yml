name: diag-305-rustfmt

# Diagnostic for #305: format the ref named in target-ref.txt with the pinned toolchain and
# publish the resulting patch as an artifact. It pushes nothing and touches no pull request.
on:
  push:
    branches: [diag/305-rustfmt]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check out the target ref
        run: |
          set -euo pipefail
          ref="$(tr -d '[:space:]' < target-ref.txt)"
          git fetch --no-tags --depth=1 origin "${ref}"
          git checkout --detach FETCH_HEAD
          git log --oneline -1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --stat
          git diff > "${RUNNER_TEMP}/fmt.patch"
          wc -c "${RUNNER_TEMP}/fmt.patch"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fmt-patch
          path: ${{ runner.temp }}/fmt.patch
          if-no-files-found: error
