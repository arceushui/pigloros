# CodeQL's Rust extractor provides a separate semantic security analysis from
# cargo-audit, cargo-deny, and the sanitizer jobs in the repository CI. The
# analysis is skipped successfully for pull requests with no Rust-affecting
# change; scheduled and main-branch runs always analyze the full repository.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 43 4 * * 1
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql_change_scope:
    name: codeql change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.scope.outputs.rust || steps.full.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
      - name: Detect Rust-affecting changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: scope
        if: github.event_name == 'pull_request' && hashFiles('.github/rust-scope.yml') != ''
        with:
          filters: .github/rust-scope.yml
          predicate-quantifier: some-with-excludes
      - name: Use full scope for non-pull-request events
        id: full
        if: github.event_name != 'pull_request' || hashFiles('.github/rust-scope.yml') == ''
        run: printf 'rust=true\n' >> "$GITHUB_OUTPUT"

  analyze:
    name: CodeQL (Rust)
    needs: codeql_change_scope
    if: ${{ needs.codeql_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:rust
