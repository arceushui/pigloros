# CodeQL's Rust extractor provides a separate semantic security analysis from
# cargo-audit, cargo-deny, and the sanitizer jobs in the repository CI. The
# analysis is skipped successfully for pull requests with no Rust-affecting
# change; scheduled and main-branch runs always analyze the full repository.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 43 4 * * 1
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql_change_scope:
    name: codeql change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Classify Rust-affecting changes from base policy
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf 'rust=true\n' >> "$GITHUB_OUTPUT"
            printf 'Full-repository event; Rust-affecting scope: true\n'
            exit 0
          fi
          base_ref="$(jq -er '.pull_request.base.ref' "$GITHUB_EVENT_PATH")"
          git fetch --no-tags origin "$base_ref"
          trusted_scope="$RUNNER_TEMP/check-rust-change-scope.sh"
          if ! git cat-file -e "origin/${base_ref}:scripts/check-rust-change-scope.sh"; then
            printf 'rust=true\n' >> "$GITHUB_OUTPUT"
            printf 'Base policy has no scope classifier; Rust-affecting scope: true\n'
            exit 0
          fi
          git show "origin/${base_ref}:scripts/check-rust-change-scope.sh" > "$trusted_scope"
          chmod +x "$trusted_scope"
          "$trusted_scope"

  analyze:
    name: CodeQL (Rust)
    needs: codeql_change_scope
    if: ${{ needs.codeql_change_scope.outputs.rust == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:rust
