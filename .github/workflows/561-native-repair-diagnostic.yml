# Temporary #561 branch-only diagnostic; not a required gate or trusted baseline.
name: 561-native-repair-diagnostic

on:
  push:
    branches: [redmine/561-native-repair-diagnostic]

permissions:
  contents: read

jobs:
  native-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: never
      RUSTFLAGS: -D warnings
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: 64b80bce3dbae2cd59352ccc584277d9d72bf0a4
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: 1.97.1
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        timeout-minutes: 4
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Record exact candidate identity
        timeout-minutes: 1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = 64b80bce3dbae2cd59352ccc584277d9d72bf0a4
          rustc -Vv | tee artifacts/rustc.txt
          cargo llvm-cov --version | tee artifacts/llvm-cov-version.txt
          id | tee artifacts/runner-identity.txt
          test "$(id -u)" -ne 0
      - name: Exercise the real inter-statement SQLite writer
        timeout-minutes: 8
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked --lib \
            sqlite::fork_replay_operation::tests::inter_statement_writes_refuse_ordinary_reads_but_do_not_change_a_held_snapshot \
            -- --exact --include-ignored 2>&1 | tee artifacts/native-race.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/native-race.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/native-race.log
      - name: Exercise the distinct principal-lookup inter-statement writer
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked --lib \
            sqlite::fork_replay_operation::tests::principal_probe_keeps_its_snapshot_until_the_raw_fetch_finishes \
            -- --exact --include-ignored 2>&1 | tee artifacts/principal-race.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/principal-race.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/principal-race.log
      - name: Exercise real principal column refusal and exact native debits
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked --lib \
            sqlite::fork_replay_operation::tests::principal_raw_column_refusal_preserves_native_errors_and_exact_debits \
            -- --exact --include-ignored 2>&1 | tee artifacts/principal-column-refusal.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/principal-column-refusal.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/principal-column-refusal.log
      - name: Exercise real suffix length refusal and exact funded retry
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked --lib \
            sqlite::fork_replay_suffix::tests::native_event_id_redaction_refuses_suffix_length_before_materialization \
            -- --exact --include-ignored 2>&1 | tee artifacts/suffix-length-refusal.log
          grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' artifacts/suffix-length-refusal.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/suffix-length-refusal.log
      - name: Exercise exact native function and READ refusals with funded retries
        timeout-minutes: 2
        run: |
          set -euo pipefail
          tests=(
            sqlite::fork_replay_operation::tests::native_principal_function_refusals_preserve_probe_accounting
            sqlite::fork_replay_operation::tests::native_operation_function_refusals_preserve_probe_accounting
            sqlite::fork_replay_suffix::tests::native_suffix_function_refusals_preserve_joined_probe_accounting
            sqlite::fork_replay_lineage::tests::metadata_where_redaction_refuses_only_the_raw_fetch_and_preserves_debits
            sqlite::fork_replay_lineage::tests::geographic_where_redaction_refuses_only_the_raw_kind_and_preserves_debits
            sqlite::fork_replay_lineage::tests::native_lineage_decoder_refuses_short_projections_without_refunding_work
            sqlite::fork_replay_read::tests::projected_sequence_redaction_preserves_the_real_row_and_funded_event_retry
          )
          for test_name in "${tests[@]}"; do
            log="artifacts/${test_name##*::}.log"
            cargo test -p pos-store --all-features --locked --lib "$test_name" \
              -- --exact --include-ignored 2>&1 | tee "$log"
            grep -F 'test result: ok. 1 passed; 0 failed; 0 ignored;' "$log"
            bash scripts/assert-no-ignored-in-test-summary.sh "$log"
          done
      - name: Exercise all native interval-acquisition regressions
        timeout-minutes: 2
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked --lib \
            sqlite::fork_replay::interval_tests:: \
            -- --include-ignored 2>&1 | tee artifacts/native-interval.log
          grep -F 'test result: ok. 6 passed; 0 failed; 0 ignored;' artifacts/native-interval.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/native-interval.log
      - name: Exercise the repaired public receipt and chain-hash contracts
        timeout-minutes: 3
        run: |
          set -euo pipefail
          cargo test -p pos-store --all-features --locked \
            --test fork_chain_hash_public --test fork_code_two_read_public \
            -- --include-ignored 2>&1 | tee artifacts/public-contracts.log
          grep -F 'test result: ok. 2 passed; 0 failed; 0 ignored;' artifacts/public-contracts.log
          grep -F 'test result: ok. 9 passed; 0 failed; 0 ignored;' artifacts/public-contracts.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/public-contracts.log
      - name: Measure Store library coverage and assert native refusal regions
        timeout-minutes: 18
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 16m \
            cargo llvm-cov -p pos-store --all-features --locked --lib \
            --json --output-path artifacts/coverage.json \
            -- --include-ignored 2>&1 | tee artifacts/coverage-test.log
          # Exact standalone source inventory, not the PR synthetic merge tree.
          grep -F 'test result: ok. 1104 passed; 0 failed; 0 ignored;' artifacts/coverage-test.log
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/coverage-test.log
          python3 - <<'PY' | tee artifacts/target-regions.json
          import json
          from pathlib import Path
          expected = [
              ("fork_replay.rs", 114, 51, ".ok_or(INTERVAL_STORAGE_ERROR)?;"),
              ("fork_replay_lineage.rs", 29, 74, "context.step(|_| match row.get_ref(column).map_err(|_| STORAGE_ERROR)? {"),
              ("fork_replay_lineage.rs", 52, 78, "context.step(|_| match row.get_ref(column).map_err(|_| STORAGE_ERROR)? {"),
              ("fork_replay_lineage.rs", 201, 65, ".ok_or(Error::Read(ReadError::CorruptAuthority))?;"),
              ("fork_replay_lineage.rs", 241, 90, "context.step(|_| match row.get_ref(column).map_err(|_| STORAGE_ERROR)? {"),
              ("fork_replay_lineage.rs", 310, 73, ".ok_or(Error::Read(ReadError::CorruptAuthority))?;"),
              ("fork_replay_read.rs", 104, 69, ".ok_or(Error::Read(ReadError::CorruptAuthority))?;"),
              ("fork_replay_operation.rs", 65, 58, ".map_err(|_| Error::StorageIndeterminate)?"),
              ("fork_replay_operation.rs", 71, 58, ".map_err(|_| Error::StorageIndeterminate)?"),
              ("fork_replay_operation.rs", 83, 65, "let row = row.ok_or(Error::CorruptAuthority)?;"),
              ("fork_replay_operation.rs", 89, 66, ".map_err(|_| Error::StorageIndeterminate)?;"),
              ("fork_replay_operation.rs", 129, 62, ".map_err(|_| Error::StorageIndeterminate)?"),
              ("fork_replay_operation.rs", 135, 81, "let text: bool = row.get(7).map_err(|_| Error::StorageIndeterminate)?;"),
              ("fork_replay_operation.rs", 144, 62, ".map_err(|_| Error::StorageIndeterminate)?;"),
              ("fork_replay_operation.rs", 153, 62, ".map_err(|_| Error::StorageIndeterminate)?;"),
              ("fork_replay_suffix.rs", 67, 97, "let integer: bool = row.get(1).map_err(|_| CorruptAuthority)?;"),
              ("fork_replay_suffix.rs", 68, 94, "let text: bool = row.get(3).map_err(|_| CorruptAuthority)?;"),
              ("fork_replay_suffix.rs", 70, 81, "row.get(4).map_err(|_| CorruptAuthority)?;"),
              ("fork_replay_suffix.rs", 72, 81, "row.get(6).map_err(|_| CorruptAuthority)?;"),
          ]
          report = json.loads(Path("artifacts/coverage.json").read_text())
          results = []
          for name, line, column, source in expected:
              path = "crates/pos-store/src/sqlite/" + name
              assert Path(path).read_text().splitlines()[line - 1].strip() == source
              files = [entry for data in report["data"] for entry in data["files"]
                       if entry["filename"].endswith("/" + path)]
              assert len(files) == 1, "missing or ambiguous Store coverage entry"
              segments = [segment for segment in files[0]["segments"]
                          if segment[0] == line and segment[1] == column
                          and segment[3] and segment[4] and not segment[5]]
              assert len(segments) == 1, "missing or ambiguous refusal segment"
              results.append({"path": path, "source": source, "segment": segments[0]})
          print(json.dumps(results))
          assert all(item["segment"][2] > 0 for item in results), "native refusal region not executed"
          PY
      - name: Check the affected crate with strict Clippy
        timeout-minutes: 8
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 7m \
            cargo clippy -p pos-store --all-features --all-targets --locked \
            -- -D warnings -W clippy::pedantic 2>&1 | tee artifacts/clippy.log
      - name: Preserve diagnostic evidence even on failure
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: untrusted-561-native-repair-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
