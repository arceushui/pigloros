# Temporary #1200 diagnostic; never merge or expose through workflow_call.
name: mutation
run-name: '#1200 exact execution-owner equality comparison'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"

jobs:
  execution-owner-eq-proof:
    name: execution owner equality proof (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: before
            ref: dce2d264ae0d7942a5327b718eeb0329692f0f0a
            expected: MissedMutant
            exit_status: 2
          - case: after
            ref: ea5292991540d080a893e68c2c1c91a0f9e93deb
            expected: CaughtMutant
            exit_status: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Record exact source and require the selected owner-equality mutation
        env:
          PROOF_SOURCE: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-evidence
          test "$(git rev-parse HEAD)" = "$PROOF_SOURCE"
          git rev-parse HEAD HEAD^{tree} > mutation-evidence/source-commit.txt
          git ls-files -z apps/pos-sandboxd Cargo.toml Cargo.lock rust-toolchain.toml .cargo/mutants.toml .cargo/config.toml \
            | xargs -0 sha256sum > mutation-evidence/source.sha256
          rustc --version
          cargo mutants --version
          cargo mutants --package pos-sandboxd --all-features --no-shuffle --list --json \
            --re '^apps/pos-sandboxd/src/lib\.rs:59:9: replace <impl PartialEq for ExecutionOwnership>::eq -> bool with true$' \
            > mutation-evidence/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("mutation-evidence/selection.json").read_text())
          expected = "apps/pos-sandboxd/src/lib.rs:59:9: replace <impl PartialEq for ExecutionOwnership>::eq -> bool with true"
          assert len(rows) == 1 and rows[0]["name"] == expected
          print("Exactly the requested owner-equality mutation selected")
          PY
      - name: Exercise the mutation after its own unmutated scratch baseline
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          set +e
          timeout --foreground 60m cargo mutants \
            --package pos-sandboxd --all-features --no-shuffle \
            --re '^apps/pos-sandboxd/src/lib\.rs:59:9: replace <impl PartialEq for ExecutionOwnership>::eq -> bool with true$' \
            --baseline run --jobs 1 --timeout 120 --build-timeout 600 \
            --cap-lints true --cargo-arg=--locked \
            -- -- -Zunstable-options --fail-fast --include-ignored --test-threads=4 \
            2>&1 | tee mutation-evidence/mutation.log
          mutation_pipe_status=("${PIPESTATUS[@]}")
          mutation_status=${mutation_pipe_status[0]}
          set -e
          test "${mutation_pipe_status[1]}" -eq 0
          printf '%s\n' "$mutation_status" > mutation-evidence/exit-status.txt
      - name: Verify the intended red or green test frontier
        env:
          EXPECTED_SUMMARY: ${{ matrix.expected }}
          EXPECTED_EXIT: ${{ matrix.exit_status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          evidence = Path("mutation-evidence")
          outcomes = json.loads(Path("mutants.out/outcomes.json").read_text())
          selected = json.loads((evidence / "selection.json").read_text())
          baselines = [row for row in outcomes["outcomes"] if row["scenario"] == "Baseline"]
          assert len(baselines) == 1 and baselines[0]["summary"] == "Success"
          baseline = baselines[0]
          assert [phase["process_status"] for phase in baseline["phase_results"]] == ["Success", "Success"]
          baseline_log = (Path("mutants.out") / baseline["log_path"]).read_text()
          name = "provider_barrier::tests::a_recheck_for_another_admitted_context_cannot_authorize_release"
          assert f"test {name} ... ok" in baseline_log
          assert re.search(r"running [1-9][0-9]* tests?", baseline_log) and "test result: ok" in baseline_log
          mutants = [row for row in outcomes["outcomes"] if row["scenario"] != "Baseline"]
          assert len(mutants) == outcomes["total_mutants"] == 1
          row = mutants[0]
          assert row["scenario"]["Mutant"]["name"] == selected[0]["name"]
          assert outcomes["timeout"] == outcomes["unviable"] == 0 and outcomes["end_time"]
          assert int((evidence / "exit-status.txt").read_text()) == int(os.environ["EXPECTED_EXIT"])
          assert row["summary"] == os.environ["EXPECTED_SUMMARY"], row
          assert row["phase_results"][0]["process_status"] == "Success"
          test = row["phase_results"][-1]
          assert test["phase"] == "Test"
          log = (Path("mutants.out") / row["log_path"]).read_text()
          assert re.search(r"running [1-9][0-9]* tests?", log)
          assert "the option `Z` is only accepted on the nightly compiler" not in log
          if os.environ["EXPECTED_SUMMARY"] == "CaughtMutant":
              assert name in baseline_log and name in log
              assert test["process_status"] == {"Failure": 101}
              assert f"test {name} ... FAILED" in log
              assert "test result: FAILED" in log
              assert re.search(r"assertion failed:\s*matches!\(\s*barrier\.release", log)
              assert re.search(r"ImageActivationError\s*::\s*EvidenceMismatch", log)
          else:
              assert test["process_status"] == "Success" and "test result: ok" in log
              assert f"test {name} ... ok" in log
          verdict = {"source": (evidence / "source-commit.txt").read_text().splitlines()[0],
                     "summary": os.environ["EXPECTED_SUMMARY"], "mutants": 1,
                     "own_scratch_baseline": "Build/TestSuccess", "public_frontier": name}
          (evidence / "verified-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict))
          PY
      - name: Upload bounded source and phase evidence without build products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: execution-owner-eq-proof-${{ matrix.case }}
          path: |
            mutation-evidence
            mutants.out
          if-no-files-found: error
