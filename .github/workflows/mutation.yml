name: mutation
'on':
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
concurrency:
  group: asan-consumer-capacity-${{ github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  asan-consumer-capacity:
    name: ASan consumer capacity diagnostic (remainder-1)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Preserve the diagnostic outside the tested checkout
      run: |
        cp -- scripts/ci_asan_consumer_capacity_probe.py "${RUNNER_TEMP}/asan-consumer-capacity-probe.py"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: fa5b199853290bc21187b48efce96ad030a0c86e
    - name: Verify exact failed checkout and record initial capacity
      run: |
        test "$(git rev-parse HEAD)" = "fa5b199853290bc21187b48efce96ad030a0c86e"
        test "$(git rev-parse HEAD^{tree})" = "cea76bff501e81e6079eaf290a09d4bde64b543e"
        python3 "${RUNNER_TEMP}/asan-consumer-capacity-probe.py" snapshot before-setup
    - name: Reclaim unused SDK headroom
      if: ${{ runner.environment == 'github-hosted' && runner.os == 'Linux' }}
      run: |
        set -euo pipefail
        printf 'CI SDK headroom before (bytes)\n'
        df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
        printf 'CI SDK headroom before (inodes)\n'
        df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
        ci_root_device="$(stat -c '%d' -- /)"
        for ci_sdk_path in /usr/local/lib/android/sdk /usr/share/dotnet/sdk; do
          if [[ ! -e "${ci_sdk_path}" && ! -L "${ci_sdk_path}" ]]; then
            printf 'CI SDK absent: %s\n' "${ci_sdk_path}"
            continue
          fi
          printf 'CI SDK candidate: %s\n' "${ci_sdk_path}"
          test -d "${ci_sdk_path}"
          test ! -L "${ci_sdk_path}"
          test "$(readlink -e -- "${ci_sdk_path}")" = "${ci_sdk_path}"
          ci_sdk_device="$(stat -c '%d' -- "${ci_sdk_path}")"
          printf 'CI SDK device: %s root=%s sdk=%s\n' "${ci_sdk_path}" "${ci_root_device}" "${ci_sdk_device}"
          test "${ci_sdk_device}" = "${ci_root_device}"
          sudo du -sx -B1 -- "${ci_sdk_path}"
          sudo rm -rf --one-file-system -- "${ci_sdk_path}"
          printf 'CI SDK removed: %s\n' "${ci_sdk_path}"
        done
        printf 'CI SDK headroom after (bytes)\n'
        df -B1 -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
        printf 'CI SDK headroom after (inodes)\n'
        df -i -- / "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}"
    - name: Measure after the unchanged SDK cleanup
      run: |
        python3 "${RUNNER_TEMP}/asan-consumer-capacity-probe.py" snapshot after-sdk
    - run: rm -f rust-toolchain.toml
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
      with:
        toolchain: nightly-2026-07-01
    - name: Install cargo-nextest for partitioned ASan tests
      uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
      with:
        tool: cargo-nextest@0.9.146
        fallback: none
    - name: Verify ASan symbolizer
      run: |
        symbolizer="/usr/bin/llvm-symbolizer-18"
        test -x "${symbolizer}"
        symbolizer_version="$("${symbolizer}" --version)"
        grep -Fqx "Ubuntu LLVM version 18.1.3" <<<"${symbolizer_version}"
    - name: Measure before archive download
      run: |
        python3 "${RUNNER_TEMP}/asan-consumer-capacity-probe.py" snapshot before-download
    - name: Download ASan test archive
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: asan-nextest-archive
        path: ${{ runner.temp }}/asan-archive
        github-token: ${{ github.token }}
        run-id: 41944696339
    - name: Measure after archive download
      run: |
        python3 "${RUNNER_TEMP}/asan-consumer-capacity-probe.py" snapshot after-download
    - name: Prove unrelated leaks still fail LSan
      env:
        ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
      run: |
        set -euo pipefail
        binary="${RUNNER_TEMP}/asan-intentional-leak"
        log="${RUNNER_TEMP}/asan-intentional-leak.log"
        trap 'rm -f "${binary}" "${log}"' EXIT
        rustc +nightly-2026-07-01 -Z sanitizer=address -C debuginfo=1 \
          --target x86_64-unknown-linux-gnu \
          scripts/asan/intentional-leak.rs -o "${binary}"
        set +e
        ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
          "${binary}" 2>&1 | tee "${log}"
        status=${PIPESTATUS[0]}
        set -e
        test "${status}" -ne 0
        grep -Fqx "SUMMARY: AddressSanitizer: 1234 byte(s) leaked in 1 allocation(s)." "${log}"
        ! grep -F "Suppressions used:" "${log}"
        ! grep -F "bevy_reflect::utility::GenericTypeCell" "${log}"
    - name: Run the unchanged remainder-1 commands with a capacity guard
      env:
        ASAN_SHARD: remainder-1
        ASAN_OPTIONS: detect_leaks=1:detect_odr_violation=0
        LSAN_OPTIONS: suppressions=${{ github.workspace }}/scripts/asan/bevy-reflect.lsan:print_suppressions=1
      run: |
        set -euo pipefail
        test -x "/usr/bin/llvm-symbolizer-18"
        nextest_args=(
          +nightly-2026-07-01 nextest run
          --archive-file "${RUNNER_TEMP}/asan-archive/asan-tests.tar.zst"
          --extract-to "${GITHUB_WORKSPACE}"
          --extract-overwrite
          --workspace-remap "${GITHUB_WORKSPACE}"
          --user-config-file none
          --ignore-default-filter
          --success-output final
          --no-output-indent
          --test-threads 2
        )
        run_asan_partition() {
          ASAN_SYMBOLIZER_PATH="/usr/bin/llvm-symbolizer-18" \
            python3 "${RUNNER_TEMP}/asan-consumer-capacity-probe.py" run \
              cargo "${nextest_args[@]}" "$@"
        }
        case "${ASAN_SHARD}" in
          bundle-coverage)
            run_asan_partition \
              -E 'binary_id(pos-conformance::bundle_contract_coverage_public)'
            ;;
          bundle-public-1)
            run_asan_partition \
              -E 'binary_id(pos-conformance::bundle_contract_public)' \
              --partition slice:1/2 --run-ignored all
            ;;
          bundle-public-2)
            run_asan_partition \
              -E 'binary_id(pos-conformance::bundle_contract_public)' \
              --partition slice:2/2 --run-ignored all
            ;;
          moat-proof)
            run_asan_partition \
              -E 'binary_id(pos-conformance::moat_proof_public)'
            ;;
          remainder-1)
            run_asan_partition -E 'not package(pos-conformance)' \
              --partition slice:1/2
            run_asan_partition \
              -E 'package(pos-conformance) & not (binary_id(pos-conformance::bundle_contract_coverage_public) | binary_id(pos-conformance::bundle_contract_public) | binary_id(pos-conformance::moat_proof_public))'
            ;;
          remainder-2)
            run_asan_partition -E 'not package(pos-conformance)' \
              --partition slice:2/2
            ;;
          *)
            printf 'unknown ASan shard: %s\n' "${ASAN_SHARD}" >&2
            exit 2
            ;;
        esac 2>&1 | tee "${RUNNER_TEMP}/asan.log"
        python scripts/check_lsan_suppression_report.py "${RUNNER_TEMP}/asan.log"
    - name: Upload bounded numeric consumer report only
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: asan-consumer-capacity-860
        path: ${{ runner.temp }}/asan-consumer-capacity/capacity.json
        if-no-files-found: error
        retention-days: 3
