# Temporary #1093 gateway-mode proof caller; no workflow_call and no PR.
name: notices-gateway-proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notices-gateway-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-notices:
    uses: ./.github/workflows/third-party-notices.yml
    with:
      scope: gateway
