# Temporary #438 diagnostic producer; never workflow_call or a shipping gate.
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-survivor-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"

jobs:
  gpt-survivor-proof:
    name: GPT survivor proof (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: before
            ref: 621fc7bfece354739556b22279c39cbe2e8e61d2
          - case: after
            ref: 93b9110adbef011f8cf08ac3361be46521121573
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Record exact source and require the 28 selected survivors
        env:
          PROOF_SOURCE: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-evidence
          test "$(git rev-parse HEAD)" = "$PROOF_SOURCE"
          git rev-parse HEAD HEAD^{tree} > mutation-evidence/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > mutation-evidence/producer-commit.txt
          sed 's/^ *//' > mutation-evidence/requested.txt <<'NAMES'
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:135:61: replace + with - in read_header
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:153:9: replace Header::validate_bounds -> Result<(), SandboxAdmissionError> with Ok(())
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:154:51: replace * with + in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:154:51: replace * with / in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:156:43: replace * with + in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:156:43: replace * with / in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:158:13: replace || with && in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:159:13: replace || with && in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:160:13: replace || with && in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:161:13: replace || with && in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:161:36: replace > with == in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:161:36: replace > with >= in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:162:13: replace || with && in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:162:36: replace < with > in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:164:25: replace > with < in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:164:36: replace - with + in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:164:57: replace - with + in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:164:57: replace - with / in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:171:33: replace + with * in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:171:33: replace + with - in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:173:25: replace < with > in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:173:49: replace > with >= in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:173:65: replace > with < in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:173:71: replace - with + in Header::validate_bounds
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:205:26: replace += with *= in verify_entries
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:239:9: replace || with && in verify_entry
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:240:9: replace || with && in verify_entry
          crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:241:9: replace || with && in verify_entry
          NAMES
          rustc --version
          cargo mutants --version
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = Path("mutation-evidence/requested.txt").read_text().splitlines()
          assert len(names) == len(set(names)) == 28
          # Escape only regex metacharacters; Rust rejects some Python escapes.
          escape = lambda name: re.sub(r"([\\.+*?()|\[\]{}^$])", r"\\\1", name)
          Path("mutation-evidence/re-args.txt").write_text(
              "".join(f"--re\n^{escape(name)}$\n" for name in names))
          PY
          mapfile -t args < mutation-evidence/re-args.txt
          cargo mutants --package pos-reference --all-features --no-shuffle --list --json \
            "${args[@]}" > mutation-evidence/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("mutation-evidence/selection.json").read_text())
          requested = set(Path("mutation-evidence/requested.txt").read_text().splitlines())
          selected = {row["name"] for row in rows}
          assert len(rows) == 28 and selected == requested, sorted(selected ^ requested)
          print("Exactly the 28 requested image_gpt.rs survivors selected")
          PY
      - name: Exercise the survivors after an own unmutated scratch baseline
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          mapfile -t args < mutation-evidence/re-args.txt
          set +e
          timeout --foreground 60m cargo mutants \
            --package pos-reference --all-features --no-shuffle \
            "${args[@]}" \
            --baseline run --jobs 1 --timeout 120 --build-timeout 600 \
            --cap-lints true --cargo-arg=--locked \
            -- -- -Zunstable-options --fail-fast --include-ignored --test-threads=4 \
            2>&1 | tee mutation-evidence/mutation.log
          mutation_pipe_status=("${PIPESTATUS[@]}")
          set -e
          test "${mutation_pipe_status[1]}" -eq 0
          printf '%s\n' "${mutation_pipe_status[0]}" > mutation-evidence/exit-status.txt
      - name: Verify each outcome without forgiving harness failures
        env:
          PROOF_CASE: ${{ matrix.case }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          evidence = Path("mutation-evidence")
          out = Path("mutants.out")
          outcomes = json.loads((out / "outcomes.json").read_text())
          requested = set((evidence / "requested.txt").read_text().splitlines())
          baselines = [row for row in outcomes["outcomes"] if row["scenario"] == "Baseline"]
          assert len(baselines) == 1 and baselines[0]["summary"] == "Success"
          assert [p["process_status"] for p in baselines[0]["phase_results"]] == ["Success", "Success"]
          baseline_log = (out / baselines[0]["log_path"]).read_text()
          assert re.search(r"running [1-9][0-9]* tests?", baseline_log)
          if os.environ["PROOF_CASE"] == "after":
              for test in ["sandbox_provider_protocol::admission::image_gpt::tests::usable_range_rejects_inversion_but_admits_a_single_lba",
                           "sandbox_provider_protocol::admission::image_gpt::tests::gpt_header_bounds_follow_both_systemd_repart_layouts",
                           "sandbox_provider_protocol::admission::image_gpt::tests::gpt_entry_bounds_follow_both_systemd_repart_layouts",
                           "root_selector::tests::admission_bounds::snapshot_open_enforces_gpt_bounds_on_both_architectures"]:
                  assert re.search(r"test " + re.escape(test) + r" \.\.\. ok", baseline_log), test
          mutants = [row for row in outcomes["outcomes"] if row["scenario"] != "Baseline"]
          assert len(mutants) == outcomes["total_mutants"] == 28
          assert {row["scenario"]["Mutant"]["name"] for row in mutants} == requested
          assert outcomes["timeout"] == outcomes["unviable"] == 0 and outcomes["end_time"]
          # The one documented equivalent survives; every other mutant must fail.
          source = "crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:"
          equivalent = {source + "173:49: replace > with >= in Header::validate_bounds"}
          verdict = []
          for row in sorted(mutants, key=lambda r: r["scenario"]["Mutant"]["name"]):
              name = row["scenario"]["Mutant"]["name"]
              assert row["phase_results"][0]["phase"] == "Build"
              assert row["phase_results"][0]["process_status"] == "Success"
              test = row["phase_results"][-1]
              assert test["phase"] == "Test"
              log = (out / row["log_path"]).read_text()
              assert "the option `Z` is only accepted on the nightly compiler" not in log
              failed = sorted(set(re.findall(r"^test (\S+) \.\.\. FAILED$", log, re.M)))
              mismatches = sorted(set(re.findall(r"(?:x86-64|arm64): [^\"\\\n]+", log)))
              if row["summary"] == "CaughtMutant":
                  assert test["process_status"] == {"Failure": 101}, row
                  assert failed, name
              else:
                  assert row["summary"] == "MissedMutant", row
                  assert test["process_status"] == "Success" and "test result: ok" in log
              if os.environ["PROOF_CASE"] == "after":
                  expected = "MissedMutant" if name in equivalent else "CaughtMutant"
                  assert row["summary"] == expected, row
              verdict.append({"mutant": name, "summary": row["summary"],
                              "failed_tests": failed, "mismatches": mismatches})
              print(name[len(source):], row["summary"], failed)
              for line in mismatches:
                  print("    ", line)
          summary = {"source": (evidence / "source-commit.txt").read_text().splitlines()[0],
                     "producer": (evidence / "producer-commit.txt").read_text().strip(),
                     "case": os.environ["PROOF_CASE"], "mutants": verdict,
                     "own_scratch_baseline": "Build/TestSuccess"}
          (evidence / "verified-verdict.json").write_text(json.dumps(summary, indent=2) + "\n")
          PY
      - name: Upload source and phase reports without build products
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpt-survivor-proof-${{ matrix.case }}
          path: |
            mutation-evidence
            mutants.out
          if-no-files-found: error
