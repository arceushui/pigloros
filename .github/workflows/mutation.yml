# Temporary #438 diagnostic producer; never workflow_call or a shipping gate.
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpt-usable-proof-${{ github.ref }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"

jobs:
  gpt-usable-proof:
    name: GPT usable-range proof (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: before
            ref: 27fa7cf05fcc2a469e8c09723b70d99d1bec62f1
            expected: MissedMutant
            exit_status: 2
          - case: after
            ref: 8813613dd98132eb9461a10a9133adf45a7a5494
            expected: CaughtMutant
            exit_status: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29
        with:
          tool: cargo-mutants@27.1.0
      - name: Record exact source and require four selected comparisons
        env:
          PROOF_SOURCE: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-evidence
          test "$(git rev-parse HEAD)" = "$PROOF_SOURCE"
          git rev-parse HEAD HEAD^{tree} > mutation-evidence/source-commit.txt
          printf '%s\n' "$GITHUB_SHA" > mutation-evidence/producer-commit.txt
          git ls-files -z crates/pos-reference Cargo.toml Cargo.lock rust-toolchain.toml .cargo scripts/run-isolated-test.sh \
            | xargs -0 sha256sum > mutation-evidence/source.sha256
          rustc --version
          cargo mutants --version
          cargo mutants --package pos-reference --all-features --no-shuffle --list --json \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:238:18: replace < with <= in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:238:18: replace < with == in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:240:17: replace > with >= in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:240:17: replace > with == in verify_entry$' \
            > mutation-evidence/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("mutation-evidence/selection.json").read_text())
          prefix = "crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt.rs:"
          expected = {prefix + location + ": replace " + change + " in verify_entry"
                      for location, change in [("238:18", "< with <="), ("238:18", "< with =="),
                                               ("240:17", "> with >="), ("240:17", "> with ==")]}
          assert len(rows) == 4 and {row["name"] for row in rows} == expected
          assert all(row["function"]["function_name"] == "verify_entry" for row in rows)
          print("Exactly four requested GPT usable-bound comparisons selected")
          PY
      - name: Exercise four comparisons after an own unmutated scratch baseline
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          set +e
          timeout --foreground 60m cargo mutants \
            --package pos-reference --all-features --no-shuffle \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:238:18: replace < with <= in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:238:18: replace < with == in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:240:17: replace > with >= in verify_entry$' \
            --re '^crates/pos-reference/src/sandbox_provider_protocol/admission/image_gpt\.rs:240:17: replace > with == in verify_entry$' \
            --baseline run --jobs 1 --timeout 120 --build-timeout 600 \
            --cap-lints true --cargo-arg=--locked \
            -- -- -Zunstable-options --fail-fast --include-ignored --test-threads=4 \
            2>&1 | tee mutation-evidence/mutation.log
          mutation_pipe_status=("${PIPESTATUS[@]}")
          mutation_status=${mutation_pipe_status[0]}
          set -e
          test "${mutation_pipe_status[1]}" -eq 0
          printf '%s\n' "$mutation_status" > mutation-evidence/exit-status.txt
      - name: Verify exact old and new outcomes without forgiving harness failures
        env:
          EXPECTED_SUMMARY: ${{ matrix.expected }}
          EXPECTED_EXIT: ${{ matrix.exit_status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          evidence = Path("mutation-evidence")
          outcomes = json.loads(Path("mutants.out/outcomes.json").read_text())
          expected_names = {row["name"] for row in json.loads((evidence / "selection.json").read_text())}
          baselines = [row for row in outcomes["outcomes"] if row["scenario"] == "Baseline"]
          assert len(baselines) == 1 and baselines[0]["summary"] == "Success"
          assert [phase["process_status"] for phase in baselines[0]["phase_results"]] == ["Success", "Success"]
          baseline_log = (Path("mutants.out") / baselines[0]["log_path"]).read_text()
          assert re.search(r"running [1-9][0-9]* tests?", baseline_log)
          positive = "root_selector::tests::admission_bounds::held_image_admission_accepts_full_length_arguments"
          assert re.search(r"test " + re.escape(positive) + r" \.\.\. ok", baseline_log)
          test_name = "root_selector::tests::admission_bounds::held_image_admission_enforces_inclusive_gpt_usable_bounds"
          if os.environ["EXPECTED_SUMMARY"] == "CaughtMutant":
              assert re.search(r"test " + re.escape(test_name) + r" \.\.\. ok", baseline_log)
          mutants = [row for row in outcomes["outcomes"] if row["scenario"] != "Baseline"]
          assert len(mutants) == outcomes["total_mutants"] == 4
          assert {row["scenario"]["Mutant"]["name"] for row in mutants} == expected_names
          assert outcomes["timeout"] == outcomes["unviable"] == 0 and outcomes["end_time"]
          assert int((evidence / "exit-status.txt").read_text()) == int(os.environ["EXPECTED_EXIT"])
          for row in mutants:
              assert row["summary"] == os.environ["EXPECTED_SUMMARY"], row
              assert row["phase_results"][0]["phase"] == "Build"
              assert row["phase_results"][0]["process_status"] == "Success"
              test = row["phase_results"][-1]
              assert test["phase"] == "Test"
              log = (Path("mutants.out") / row["log_path"]).read_text()
              assert "the option `Z` is only accepted on the nightly compiler" not in log
              if os.environ["EXPECTED_SUMMARY"] == "CaughtMutant":
                  assert test["process_status"] == {"Failure": 101}
                  assert re.search(r"test " + re.escape(test_name) + r" \.\.\. FAILED", log)
                  assert "running 1 test" in log
                  assert "valid bounded image rejected by public snapshot admission: Some(ArtifactInvalid)" in log
                  assert "panicked at crates/pos-reference/src/root_selector/tests/admission_bounds.rs:" in log
                  assert "test result: FAILED" in log
              else:
                  assert test["process_status"] == "Success" and "test result: ok" in log
          verdict = {"source": (evidence / "source-commit.txt").read_text().splitlines()[0],
                     "producer": (evidence / "producer-commit.txt").read_text().strip(),
                     "summary": os.environ["EXPECTED_SUMMARY"], "mutants": 4,
                     "own_scratch_baseline": "Build/TestSuccess"}
          (evidence / "verified-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict))
          PY
      - name: Upload source and phase reports without build products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gpt-usable-proof-${{ matrix.case }}
          path: |
            mutation-evidence
            mutants.out
          if-no-files-found: error
