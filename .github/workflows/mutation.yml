# Diagnostic-only #426/#427 release evidence; intentionally no workflow_call.
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  CARGO_BUILD_JOBS: "1"
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTFLAGS: -D warnings
  PRODUCTION_BASE: 65977fa450c29825555aa45482c8acb09b65f1d9

jobs:
  remote-release-evidence:
    name: native resolver and remote transport release evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - name: Capture exact source, production prefix and host/tool identity
        env:
          EVIDENCE: ${{ runner.temp }}/remote-release-evidence
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          git rev-parse HEAD HEAD^{tree} > "$EVIDENCE/source.txt"
          git diff --binary "$PRODUCTION_BASE"...HEAD > "$EVIDENCE/diagnostic.patch"
          git ls-files -z crates/pos-plugin-release Cargo.toml Cargo.lock rust-toolchain.toml \
            | xargs -0 sha256sum > "$EVIDENCE/source.sha256"
          rustc --version --verbose > "$EVIDENCE/rustc-version.txt"
          cargo --version > "$EVIDENCE/cargo-version.txt"
          uname -a > "$EVIDENCE/host.txt"
          ldd --version >> "$EVIDENCE/host.txt"
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          records = []
          paths = ["challenge.rs", "config.rs", "engine.rs", "https.rs", "mod.rs", "oci.rs", "resolver.rs"]
          for name in paths:
              path = "crates/pos-plugin-release/src/remote/" + name
              before = subprocess.check_output(["git", "show", os.environ["PRODUCTION_BASE"] + ":" + path])
              after = Path(path).read_bytes()
              if name == "resolver.rs":
                  before = before.split(b"#[cfg(test)]", 1)[0]
                  after = after.split(b"#[cfg(test)]", 1)[0]
              assert before == after, path
              records.append({"path": path, "production_sha256": hashlib.sha256(before).hexdigest()})
          evidence = Path(os.environ["EVIDENCE"])
          (evidence / "unchanged-production.json").write_text(json.dumps(records, indent=2) + "\n")
          PY
      - name: Capture the pinned resolved production and test feature graphs
        env:
          EVIDENCE: ${{ runner.temp }}/remote-release-evidence
        run: |
          set -euo pipefail
          cargo tree --package pos-plugin-release --all-features --locked \
            --target x86_64-unknown-linux-gnu --edges normal,build,features \
            > "$EVIDENCE/production-feature-tree.txt"
          cargo tree --package pos-plugin-release --all-features --locked \
            --target x86_64-unknown-linux-gnu --edges features \
            > "$EVIDENCE/test-feature-tree.txt"
          cargo metadata --all-features --locked --format-version 1 \
            --filter-platform x86_64-unknown-linux-gnu > "$EVIDENCE/cargo-metadata.json"
      - name: Build only the three evidence test executables
        env:
          EVIDENCE: ${{ runner.temp }}/remote-release-evidence
        run: |
          set -euo pipefail
          cargo test --package pos-plugin-release --all-features --locked \
            --lib --test https_release_public --test oci_registry_public \
            --no-run --message-format=json > "$EVIDENCE/build.jsonl"
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE"])
          wanted = {"pos_plugin_release", "https_release_public", "oci_registry_public"}
          executables = {}
          for line in (evidence / "build.jsonl").read_text().splitlines():
              item = json.loads(line)
              if item.get("reason") != "compiler-artifact" or not item.get("executable"):
                  continue
              name = item["target"]["name"]
              if name in wanted and item["profile"]["test"]:
                  assert name not in executables
                  path = Path(item["executable"])
                  executables[name] = {"path": str(path), "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          assert set(executables) == wanted
          (evidence / "executables.json").write_text(json.dumps(executables, indent=2) + "\n")
          PY
      - name: Probe real glibc DNS under a private controlled namespace
        env:
          EVIDENCE: ${{ runner.temp }}/remote-release-evidence
        run: |
          set -euo pipefail
          binary="$(python3 -c 'import json,os; from pathlib import Path; print(json.loads((Path(os.environ["EVIDENCE"])/"executables.json").read_text())["pos_plugin_release"]["path"])')"
          sudo --non-interactive unshare --mount --net --propagation private \
            python3 .github/diagnostics/remote_source_probe.py \
            --executable "$binary" --user "$(id -un)" --output "$EVIDENCE/native"
      - name: Execute the existing public TLS, auth, redirect and disclosure cases
        env:
          EVIDENCE: ${{ runner.temp }}/remote-release-evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          evidence = Path(os.environ["EVIDENCE"])
          executables = json.loads((evidence / "executables.json").read_text())
          inventories = {}
          for name in ("https_release_public", "oci_registry_public"):
              path = evidence / (name + ".log")
              with path.open("wb") as output:
                  subprocess.run(["timeout", "--foreground", "120s", executables[name]["path"],
                      "--exact", "the_production_log_ceiling_hides_every_secret_and_names_every_target",
                      "--nocapture", "--include-ignored", "--test-threads=1"], stdout=output,
                      stderr=subprocess.STDOUT, check=True)
              text = path.read_text()
              assert "test result: ok. 1 passed; 0 failed" in text
              marker = "REMOTE_TARGET_INVENTORY="
              rows = [line.split(marker, 1)[1] for line in text.splitlines() if marker in line]
              assert len(rows) == 1
              inventories[name] = json.loads(rows[0])
              assert inventories[name]
              assert any(row.startswith("DEBUG ureq") or row.startswith("TRACE ureq") for row in inventories[name])
          (evidence / "log-target-inventory.json").write_text(json.dumps(inventories, indent=2) + "\n")
          PY
      - name: Upload bounded evidence without compiler or executable products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oci-remote-release-evidence
          path: ${{ runner.temp }}/remote-release-evidence
          if-no-files-found: error
