# Redmine #777 diagnostic branch only: crate-scoped mutation proofs for the
# retrospective audit. This file is not proposed for the normal pull-request
# gate. Omitting workflow_call makes an accidental PR from this branch fail closed.
name: mutation

on:
  workflow_dispatch:
    inputs:
      package:
        description: Owning Cargo package to mutate
        required: true
        type: string
      files:
        description: Optional space-separated source paths (each passed as --file)
        required: false
        default: ""
        type: string
      per_shard:
        description: Target mutants per shard (sharding only; limits unchanged)
        required: false
        default: "60"
        type: string

permissions:
  contents: read

concurrency:
  group: mutation-777-${{ inputs.package }}-${{ inputs.files }}
  cancel-in-progress: false

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # Each mutation runner uses one worker with one compiler job.
  CARGO_BUILD_JOBS: "1"
  AUDIT_PACKAGE: ${{ inputs.package }}
  AUDIT_FILES: ${{ inputs.files }}

jobs:
  mutation-baseline:
    name: crate-scoped baseline and inventory
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "3"
    timeout-minutes: 30
    outputs:
      shards: ${{ steps.inventory.outputs.shards }}
      shard_count: ${{ steps.inventory.outputs.shard_count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-mutants@27.1.0
      - id: inventory
        name: Record the scoped inventory and exact source
        env:
          PER_SHARD: ${{ inputs.per_shard }}
        run: |
          set -euo pipefail
          rustc --version
          cargo mutants --version
          git rev-parse HEAD
          [[ "$AUDIT_PACKAGE" =~ ^[a-z0-9-]+$ ]]
          [[ "$PER_SHARD" =~ ^[1-9][0-9]*$ ]]
          file_args=()
          for f in $AUDIT_FILES; do
            [[ "$f" =~ ^[A-Za-z0-9_./-]+$ ]]
            test -f "$f"
            file_args+=(--file "$f")
          done
          git ls-files -z Cargo.toml Cargo.lock rust-toolchain.toml .cargo apps crates \
            | xargs -0 sha256sum > "${RUNNER_TEMP}/mutation-source.sha256"
          cargo mutants --package "$AUDIT_PACKAGE" "${file_args[@]}" --all-features \
            --no-shuffle --list --json > "${RUNNER_TEMP}/mutation-inventory.json"
          python3 - "${RUNNER_TEMP}/mutation-inventory.json" "$PER_SHARD" <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, sys
          rows = json.load(open(sys.argv[1]))
          assert isinstance(rows, list) and rows
          count = min(256, max(1, math.ceil(len(rows) / int(sys.argv[2]))))
          print(f"Scoped inventory: {len(rows)} mutants in {count} shards", file=sys.stderr)
          print(f"shard_count={count}")
          print("shards=" + json.dumps(list(range(count))))
          PY
      - name: Prove the owning-package harness
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          cargo test --package "$AUDIT_PACKAGE" --all-features --locked -- \
            -Zunstable-options --fail-fast --include-ignored --test-threads=4 \
            2>&1 | tee "${RUNNER_TEMP}/mutation-baseline.log"
          bash scripts/assert-no-ignored-in-test-summary.sh "${RUNNER_TEMP}/mutation-baseline.log"
      - name: Upload baseline, inventory and source hashes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-audit-inventory
          path: |
            ${{ runner.temp }}/mutation-baseline.log
            ${{ runner.temp }}/mutation-inventory.json
            ${{ runner.temp }}/mutation-source.sha256
          if-no-files-found: error

  mutation:
    name: crate-scoped mutants (shard ${{ matrix.shard }})
    needs: mutation-baseline
    if: needs.mutation-baseline.result == 'success'
    runs-on: ubuntu-24.04
    # The shell watchdog below exits with diagnostics before this outer limit.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJSON(needs.mutation-baseline.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-mutants@27.1.0
      # Each scratch copy must independently prove its unmutated harness.
      # Limits are unchanged from the hosted diff gate.
      - name: Run crate-scoped mutants
        env:
          CARGO_INCREMENTAL: "1"
          SHARD_COUNT: ${{ needs.mutation-baseline.outputs.shard_count }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          rustc --version
          cargo mutants --version
          file_args=()
          for f in $AUDIT_FILES; do
            file_args+=(--file "$f")
          done
          set +e
          timeout --foreground 60m cargo mutants \
            --package "$AUDIT_PACKAGE" \
            "${file_args[@]}" \
            --all-features \
            --no-shuffle \
            --shard "${SHARD}/${SHARD_COUNT}" \
            --baseline run \
            --jobs 1 \
            --timeout 120 \
            --build-timeout 600 \
            --cap-lints true \
            --cargo-arg=--locked \
            -- \
            -- \
            -Zunstable-options \
            --fail-fast \
            --include-ignored \
            --test-threads=4
          mutation_status=$?
          set -e
          if [[ "$mutation_status" -eq 124 ]]; then
            echo "Mutation shard watchdog timed out after 60 minutes."
          fi
          exit "$mutation_status"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore
