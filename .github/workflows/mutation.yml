# Diff-scoped mutation testing keeps new or changed logic covered without
# turning the normal pull-request suite into a full-workspace mutation run.
name: mutation

on:
  pull_request:
    paths:
      - >-
        **/*.rs
      - >-
        **/Cargo.toml
      - Cargo.lock
      - .github/workflows/mutation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-baseline:
    name: mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation-baseline
      - name: Run baseline tests
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked -- --include-ignored 2>&1 \
            | tee "${RUNNER_TEMP}/cargo-test.log"
          bash scripts/assert-no-ignored-in-test-summary.sh "${RUNNER_TEMP}/cargo-test.log"

  mutation:
    name: diff mutation testing (shard ${{ matrix.shard }})
    needs: mutation-baseline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-mutants
      - name: Capture pull-request diff
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git diff --relative --unified=0 \
            "origin/${base_ref}...HEAD" \
            > "${RUNNER_TEMP}/changes.diff"
      # Four workers fit the hosted runner and shorten feedback without
      # changing the mutant set or weakening the gate.
      - name: Run mutants in changed lines
        run: >
          cargo mutants
          --workspace
          --all-features
          --in-diff "${{ runner.temp }}/changes.diff"
          --no-shuffle
          --shard "${{ matrix.shard }}/4"
          --baseline skip
          --jobs 4
          --timeout 1800
          --cap-lints true
          --cargo-arg=--locked
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutation-gate:
    name: diff mutation testing
    if: always()
    needs: [mutation-baseline, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Require baseline and every mutation shard to pass
        run: |
          test "${{ needs.mutation-baseline.result }}" = success
          test "${{ needs.mutation.result }}" = success
