# Temporary #1093 hosted graph inspection; never a shipping mutation gate.
name: notices-gateway-probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notices-gateway-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-graphs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 65977fa450c29825555aa45482c8acb09b65f1d9
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-about@0.9.2
      - name: Capture the package report and exact gateway build inputs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir gateway-graphs
          git rev-parse HEAD HEAD^{tree} > gateway-graphs/source.txt
          sha256sum Cargo.lock Cargo.toml apps/piglor-gateway/Cargo.toml about.toml \
            > gateway-graphs/source.sha256
          cargo about --version
          cargo about generate --locked --fail \
            --manifest-path apps/piglor-gateway/Cargo.toml --config about.toml \
            --format json --output-file gateway-graphs/about.json
          cargo metadata --locked --format-version 1 \
            --manifest-path apps/piglor-gateway/Cargo.toml \
            --filter-platform x86_64-unknown-linux-gnu > gateway-graphs/metadata.json
          RUSTC_BOOTSTRAP=1 cargo build --locked --release --bin piglor-gateway \
            --unit-graph -Z unstable-options > gateway-graphs/units.json
      - name: Upload graph metadata without build products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gateway-graph-probe
          path: gateway-graphs
          if-no-files-found: error
