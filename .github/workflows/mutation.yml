# Diff-scoped mutation testing keeps new or changed logic covered without
# turning the normal pull-request suite into a full-workspace mutation run.
name: mutation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-changes:
    name: detect mutation-relevant changes
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Classify changed paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FORCE_MUTATION: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          relevant=false
          if [[ "$FORCE_MUTATION" = true ]]; then
            relevant=true
          else
            while IFS= read -r path; do
              case "$path" in
                *.rs|Cargo.toml|*/Cargo.toml|Cargo.lock|fixtures/conformance/*|.github/workflows/mutation.yml)
                  relevant=true
                  break
                  ;;
              esac
            done < <(git diff --name-only --diff-filter=ACMRT "$BASE_SHA...$HEAD_SHA")
          fi
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

  mutation:
    name: diff mutation testing (shard ${{ matrix.shard }})
    needs: mutation-changes
    if: needs.mutation-changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # The shell watchdog below exits with diagnostics before this outer limit.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # A pinned nightly enables libtest's per-test fail-fast mode. The
          # caller's core stage has already proved the stable workspace suite.
          toolchain: nightly-2026-08-28
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2
        with:
          tool: cargo-mutants
      - name: Capture pull-request diff
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git diff --relative --unified=0 \
            "origin/${base_ref}...HEAD" \
            > "${RUNNER_TEMP}/changes.diff"
      # The caller's core test gate proves the whole workspace first. Each
      # mutant retains the owning-package test selection used on main, while
      # two harness threads limit four workers from multiplying concurrency.
      - name: Run mutants in changed lines
        run: |
          set -euo pipefail
          set +e
          # Each worker has an isolated target directory, so its first cold
          # build may exceed the stricter per-test timeout on hosted runners.
          timeout --foreground 60m cargo mutants \
            --workspace \
            --all-features \
            --in-diff "${{ runner.temp }}/changes.diff" \
            --no-shuffle \
            --shard "${{ matrix.shard }}/8" \
            --baseline skip \
            --jobs 4 \
            --timeout 120 \
            --build-timeout 300 \
            --cap-lints true \
            --cargo-arg=--locked \
            -- \
            -- \
            -Zunstable-options \
            --fail-fast \
            --include-ignored \
            --test-threads=2
          mutation_status=$?
          set -e
          if [[ "$mutation_status" -eq 124 ]]; then
            echo "Mutation shard watchdog timed out after 60 minutes."
            latest_log=""
            if [[ -d mutants.out ]]; then
              latest_log="$(find mutants.out -type f -name '*.log' -printf '%T@ %p\n' \
                | sort -nr | head -n 1 | cut -d' ' -f2-)"
            fi
            if [[ -n "$latest_log" ]]; then
              echo "Most recent mutant log: $latest_log"
              tail -n 120 "$latest_log"
            fi
          fi
          exit "$mutation_status"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutation-gate:
    # The caller waits on this fan-in before starting ASan. Individual shards
    # must never be configured as independent merge approvals.
    name: diff mutation testing
    if: always()
    needs: [mutation-changes, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every relevant mutation shard to pass
        run: |
          test "${{ needs.mutation-changes.result }}" = success
          if [[ "${{ needs.mutation-changes.outputs.relevant }}" = true ]]; then
            test "${{ needs.mutation.result }}" = success
          else
            test "${{ needs.mutation.result }}" = skipped
          fi
