# Temporary #1275 diagnostic only; deliberately unavailable to workflow_call.
name: mutation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTUP_TOOLCHAIN: nightly-2026-07-01
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: "1"

jobs:
  input-chunk-proof:
    name: input chunk proof (${{ matrix.case }})
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - case: before
            ref: 65977fa450c29825555aa45482c8acb09b65f1d9
            expected: MissedMutant
            exit_status: 2
          - case: after
            ref: e97f0ae758a4cafbaac05b8e488e4f1a6063d44d
            expected: CaughtMutant
            exit_status: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.ref }}
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-mutants@27.1.0
      - name: Record exact source and require both selected mutations
        env:
          PROOF_SOURCE: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          mkdir -p mutation-evidence
          test "$(git rev-parse HEAD)" = "$PROOF_SOURCE"
          git rev-parse HEAD HEAD^{tree} > mutation-evidence/source-commit.txt
          git ls-files -z crates/pos-reference Cargo.toml Cargo.lock rust-toolchain.toml .cargo/mutants.toml \
            | xargs -0 sha256sum > mutation-evidence/source.sha256
          rustc --version
          cargo mutants --version
          cargo mutants --package pos-reference --all-features --no-shuffle --list --json \
            --re '^crates/pos-reference/src/provider_transport\.rs:37:33: replace \* with \+$' \
            --re 'replace \+= with \*= in write_input$' \
            > mutation-evidence/selection.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = json.loads(Path("mutation-evidence/selection.json").read_text())
          expected = {
              "crates/pos-reference/src/provider_transport.rs:37:33: replace * with +",
              "crates/pos-reference/src/provider_transport.rs:1124:15: replace += with *= in write_input",
          }
          assert len(rows) == 2 and {row["name"] for row in rows} == expected
          print("Exactly two requested input chunk mutations selected")
          PY
      - name: Exercise each mutation after its own unmutated scratch baseline
        env:
          CARGO_INCREMENTAL: "1"
        run: |
          set -euo pipefail
          set +e
          timeout --foreground 60m cargo mutants \
            --package pos-reference --all-features --no-shuffle \
            --re '^crates/pos-reference/src/provider_transport\.rs:37:33: replace \* with \+$' \
            --re 'replace \+= with \*= in write_input$' \
            --baseline run --jobs 1 --timeout 120 --build-timeout 600 \
            --cap-lints true --cargo-arg=--locked \
            -- -- -Zunstable-options --fail-fast --include-ignored --test-threads=4 \
            2>&1 | tee mutation-evidence/mutation.log
          mutation_pipe_status=("${PIPESTATUS[@]}")
          mutation_status=${mutation_pipe_status[0]}
          set -e
          test "${mutation_pipe_status[1]}" -eq 0
          printf '%s\n' "$mutation_status" > mutation-evidence/exit-status.txt
      - name: Verify exact red or green outcomes without forgiving harness failures
        env:
          EXPECTED_SUMMARY: ${{ matrix.expected }}
          EXPECTED_EXIT: ${{ matrix.exit_status }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          evidence = Path("mutation-evidence")
          outcomes = json.loads(Path("mutants.out/outcomes.json").read_text())
          expected_names = {row["name"] for row in json.loads((evidence / "selection.json").read_text())}
          baselines = [row for row in outcomes["outcomes"] if row["scenario"] == "Baseline"]
          assert len(baselines) == 1 and baselines[0]["summary"] == "Success"
          assert [phase["process_status"] for phase in baselines[0]["phase_results"]] == ["Success", "Success"]
          mutants = [row for row in outcomes["outcomes"] if row["scenario"] != "Baseline"]
          assert len(mutants) == outcomes["total_mutants"] == 2
          assert {row["scenario"]["Mutant"]["name"] for row in mutants} == expected_names
          assert outcomes["timeout"] == outcomes["unviable"] == 0 and outcomes["end_time"]
          assert int((evidence / "exit-status.txt").read_text()) == int(os.environ["EXPECTED_EXIT"])
          for row in mutants:
              assert row["summary"] == os.environ["EXPECTED_SUMMARY"], row
              assert row["phase_results"][0]["process_status"] == "Success"
              test = row["phase_results"][-1]
              assert test["phase"] == "Test"
              log = (Path("mutants.out") / row["log_path"]).read_text()
              assert "the option `Z` is only accepted on the nightly compiler" not in log
              if os.environ["EXPECTED_SUMMARY"] == "CaughtMutant":
                  assert test["process_status"] == {"Failure": 101}
                  assert "input_writer_emits_the_exact_parent_bound_chunks" in log
                  assert "test result: FAILED" in log and "assertion `left == right` failed" in log
              else:
                  assert test["process_status"] == "Success"
                  assert "test result: ok" in log
          verdict = {"source": Path("mutation-evidence/source-commit.txt").read_text().splitlines()[0],
                     "summary": os.environ["EXPECTED_SUMMARY"], "mutants": 2,
                     "own_scratch_baseline": "Build/TestSuccess"}
          (evidence / "verified-verdict.json").write_text(json.dumps(verdict, indent=2) + "\n")
          print(json.dumps(verdict))
          PY
      - name: Upload bounded source and phase evidence without build products
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: input-chunk-proof-${{ matrix.case }}
          path: |
            mutation-evidence
            mutants.out
          if-no-files-found: error
