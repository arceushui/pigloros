# Diff-scoped mutation testing keeps new or changed logic covered without
# turning the normal pull-request suite into a full-workspace mutation run.
name: mutation

on:
  pull_request:
    paths:
      - >-
        **/*.rs
      - >-
        **/Cargo.toml
      - Cargo.lock
      - fixtures/conformance/**
      - .github/workflows/mutation.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  mutation-baseline:
    name: mutation baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation-baseline
      - name: Run baseline tests
        run: |
          set -euo pipefail
          cargo test --workspace --all-features --locked -- --include-ignored 2>&1 \
            | tee "${RUNNER_TEMP}/cargo-test.log"
          bash scripts/assert-no-ignored-in-test-summary.sh "${RUNNER_TEMP}/cargo-test.log"

  mutation:
    name: diff mutation testing (shard ${{ matrix.shard }})
    needs: mutation-baseline
    runs-on: ubuntu-latest
    # The shell watchdog below exits with diagnostics before this outer limit.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          # A pinned nightly enables libtest's per-test fail-fast mode. The
          # stable workspace baseline above remains the compatibility gate.
          toolchain: nightly-2026-08-28
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: mutation
      - uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: cargo-mutants
      - name: Capture pull-request diff
        run: |
          set -euo pipefail
          base_ref="${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}"
          git diff --relative --unified=0 \
            "origin/${base_ref}...HEAD" \
            > "${RUNNER_TEMP}/changes.diff"
      # The baseline proves the whole workspace first. Each mutant retains the
      # owning-package test selection used on main, while two harness threads
      # limit four workers from multiplying test-thread concurrency.
      - name: Run mutants in changed lines
        run: |
          set -euo pipefail
          set +e
          timeout --foreground 60m cargo mutants \
            --workspace \
            --all-features \
            --in-diff "${{ runner.temp }}/changes.diff" \
            --no-shuffle \
            --shard "${{ matrix.shard }}/8" \
            --baseline skip \
            --jobs 4 \
            --timeout 120 \
            --build-timeout 120 \
            --cap-lints true \
            --cargo-arg=--locked \
            -- \
            -- \
            -Zunstable-options \
            --fail-fast \
            --include-ignored \
            --test-threads=2
          mutation_status=$?
          set -e
          if [[ "$mutation_status" -eq 124 ]]; then
            echo "Mutation shard watchdog timed out after 60 minutes."
            latest_log=""
            if [[ -d mutants.out ]]; then
              latest_log="$(find mutants.out -type f -name '*.log' -printf '%T@ %p\n' \
                | sort -nr | head -n 1 | cut -d' ' -f2-)"
            fi
            if [[ -n "$latest_log" ]]; then
              echo "Most recent mutant log: $latest_log"
              tail -n 120 "$latest_log"
            fi
          fi
          exit "$mutation_status"
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-shard-${{ matrix.shard }}
          path: mutants.out
          if-no-files-found: ignore

  mutation-gate:
    name: diff mutation testing
    if: always()
    needs: [mutation-baseline, mutation]
    runs-on: ubuntu-latest
    steps:
      - name: Require baseline and every mutation shard to pass
        run: |
          test "${{ needs.mutation-baseline.result }}" = success
          test "${{ needs.mutation.result }}" = success
