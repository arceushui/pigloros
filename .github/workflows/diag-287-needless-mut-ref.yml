# Diagnostic for the needless_pass_by_ref_mut fix (#287). Throwaway: lives only
# on the diag/287-needless-mut-ref branch, never on the pull request branch.
name: diag-287-needless-mut-ref

on:
  push:
    branches:
      - diag/287-needless-mut-ref

permissions:
  contents: read

jobs:
  # Lint each pos-store dependent the way the local pre-commit hook does for a
  # branch that changes only that package. pos-store is then compiled without
  # test-support. --keep-going reports every failing member, not only the first.
  dependents:
    name: clippy -p ${{ matrix.package }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package:
          - piglor-ledger
          - pos-plugin-worker
          - pos-gateway-conformance-adapter
          - pos-cli
          - piglor-gateway
          - pos-experiment
          - pos-plugin-supervisor
          - pos-runtime
          - pos-query
          - pos-plugin-publisher
          - pos-time
          - pos-local-erasure-loader
          - pos-plugin-eval
          - pos-plugin-synthetic-obs
          - pos-plugin-agent
          - pos-plugin-ledger
          - pos-plugin-world
          - pos-plugin-rule-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: clippy -p ${{ matrix.package }}
        run: cargo clippy -p ${{ matrix.package }} --all-features --all-targets --locked --keep-going --message-format short -- -D warnings -W clippy::pedantic

  pos-store:
    name: pos-store lint and recipient export tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - name: clippy -p pos-store without test-support
        run: cargo clippy -p pos-store --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: recipient unit tests with test-support
        run: cargo test -p pos-store --features test-support --locked --lib recipient_ -- --include-ignored
      - name: recipient export fault tests
        run: cargo test -p pos-store --features test-support --locked --test recipient_export_publication_faults_public -- --include-ignored
