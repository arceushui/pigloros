name: diag-560-a4e2b

# Diagnostic run for #560 A4e-2 (owner decision 2026-11-20: custom Actions
# runs are allowed where local cargo is not). It compiles and tests the
# touched crates only and applies the same lint policy as the clippy job.
on:
  push:
    branches:
      - diag/560-a4e3b

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
          components: clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: diag-560-a4e2b
      - name: cargo clippy (pedantic; warnings reported, not denied)
        run: |
          cargo clippy -p pos-core -p pos-store --all-features --all-targets --locked -- \
            -W clippy::pedantic 2>&1 | tee /tmp/clippy.log
          grep -c '^warning\|^error' /tmp/clippy.log || true
      - name: cargo test pos-store community lib tests
        run: |
          cargo test -p pos-store --all-features --locked --lib community:: 2>&1 | tail -80
      - name: cargo test pos-core failure tests
        run: |
          cargo test -p pos-core --all-features --locked --test community_failure_public 2>&1 | tail -40
      - name: cargo test pos-store pass control batch public test
        run: |
          cargo test -p pos-store --all-features --locked --test community_pass_control_batch_public 2>&1 | tail -60
      - name: cargo test pos-store doctests of the community module
        run: |
          cargo test -p pos-store --all-features --locked --doc community 2>&1 | tail -40
