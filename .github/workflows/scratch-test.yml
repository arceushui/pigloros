name: scratch-test
on: push
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          save-if: false
      - run: |
          cargo test --workspace --all-features --locked --no-fail-fast -- --include-ignored > /tmp/t.log 2>&1 || true
          echo SUMMARY_BEGIN
          grep -E '^\s+Running |\.\.\. FAILED$|^test result: FAILED|^error: (test failed|could not compile)|panicked at' /tmp/t.log | grep -B1 -E 'FAILED|error:|panicked' | head -300
          echo SUMMARY_END
          for t in $(grep -E '\.\.\. FAILED$' /tmp/t.log | awk '{print $2}' | sort -u | head -40); do echo "#### $t"; awk -v t="---- $t stdout ----" 'index($0,t)==1{p=1;n=0} p{print; n++; if(n>25){p=0}}' /tmp/t.log; done
