# TEMPORARY (#1312, following the #1229 recording precedent): records one CI run of the G-PUB
# non-interference cases and uploads its NIA1 for check-in, because the NI-PUBLIC-006 denial
# probe now answers a Gateway v1 problem body. Removed before the pull request is ready.
name: tmp-ni-g-pub-export

on:
  push:
    branches:
      - redmine/1312-gateway-v1-envelopes

permissions:
  contents: read

jobs:
  export:
    name: export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: tmp-ni-g-pub-export
      - name: Record the G-PUB executions
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/ni-export"
          PIGLOROS_NI_G_PUB_EXPORT="${RUNNER_TEMP}/ni-export" \
            cargo test -p pos-experiment --features test-support --locked \
            --test non_interference_g_pub -- --test-threads=1 > "${RUNNER_TEMP}/ni-export/test.log" 2>&1 || true
          tail -n 60 "${RUNNER_TEMP}/ni-export/test.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ni-g-pub-export
          path: ${{ runner.temp }}/ni-export
          if-no-files-found: error
