# TEMPORARY (ADR-062 R8 slice N1, #1229; owner decision 2 of
# ADR-062_R8_NonInterference_Executions): records one CI run of the G-PUB
# non-interference cases and uploads its NIA1 for check-in. Removed before the
# pull request is ready.
name: tmp-ni-g-pub-export

on:
  push:
    branches:
      - redmine/1229-n1-gpub

permissions:
  contents: read

jobs:
  export:
    name: export
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: tmp-ni-g-pub-export
      - name: Record the G-PUB executions
        run: |
          set -uo pipefail
          mkdir -p "${RUNNER_TEMP}/ni-export"
          PIGLOROS_NI_G_PUB_EXPORT="${RUNNER_TEMP}/ni-export" \
            cargo test -p pos-experiment --features test-support --locked \
            --test non_interference_g_pub -- --test-threads=1 2>&1 | tee "${RUNNER_TEMP}/ni-export/test.log"
          exit 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ni-g-pub-export
          path: ${{ runner.temp }}/ni-export
          if-no-files-found: error
