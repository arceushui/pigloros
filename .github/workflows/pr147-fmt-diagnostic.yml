name: pr147-fmt-diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/pr147-fmt-diagnostic.yml

permissions:
  contents: read

jobs:
  rustfmt-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --all -- --check
