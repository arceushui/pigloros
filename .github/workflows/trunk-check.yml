# Trunk Code Quality — complements .github/workflows/ci.yml (fmt/test/clippy/coverage).
# Includes rust-test-policy (coverage(off) test-only; no ```ignore doctest fences).
# #[ignore] is enforced at runtime via cargo test -- --include-ignored (see ci.yml).
# Dependency and security gates run in `ci.yml`. Local: `trunk check` / scripts/ci.sh.

name: trunk-check

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: 17 2 * * *
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    # Full scheduled/main checks may inspect the whole repository; allow the
    # hosted job enough time to finish without changing the PR diff gate.
    timeout-minutes: 60
    permissions:
      checks: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Hosted formatter snapshot (temporary)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Format erasure files for diagnostic artifact
        run: >
          rustfmt --edition 2024
          crates/pos-core/src/erasure.rs
          crates/pos-core/src/erasure_codec.rs
          crates/pos-core/src/erasure_tests.rs
          crates/pos-core/src/lib.rs

      - name: Commit hosted formatter snapshot (temporary)
        if: github.event_name == 'push'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --quiet -- crates/pos-core/src/erasure.rs crates/pos-core/src/erasure_codec.rs crates/pos-core/src/erasure_tests.rs crates/pos-core/src/lib.rs; then
            exit 0
          fi
          git add crates/pos-core/src/erasure.rs crates/pos-core/src/erasure_codec.rs crates/pos-core/src/erasure_tests.rs crates/pos-core/src/lib.rs
          git commit -m "style(core): apply hosted rustfmt"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload formatter snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: erasure-rustfmt-snapshot
          path: |
            crates/pos-core/src/erasure.rs
            crates/pos-core/src/erasure_codec.rs
            crates/pos-core/src/erasure_tests.rs
            crates/pos-core/src/lib.rs

      - name: Publish formatter snapshot summary
        run: |
          for file in crates/pos-core/src/erasure.rs crates/pos-core/src/erasure_codec.rs crates/pos-core/src/erasure_tests.rs crates/pos-core/src/lib.rs; do
            {
              echo "### $file"
              echo '```rust'
              sed 's/```/` ` `/g' "$file"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          # Pull requests use Trunk's diff mode; pushes to main and the daily
          # scheduled run perform the full repository check.
          check-mode: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'all' || '' }}
