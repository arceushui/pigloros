# Trunk Code Quality — complements .github/workflows/ci.yml (fmt/test/clippy/coverage).
# Includes rust-test-policy (coverage(off) test-only; no ```ignore doctest fences).
# #[ignore] is enforced at runtime via cargo test -- --include-ignored (see ci.yml).
# Deps: cargo-deny.yml. Local: `trunk check` / scripts/ci.sh.

name: trunk-check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          check-mode: all
