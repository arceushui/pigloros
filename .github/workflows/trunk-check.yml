# Trunk Code Quality — complements .github/workflows/ci.yml (fmt/test/clippy/coverage).
# Includes rust-test-policy (coverage(off) test-only; no ```ignore doctest fences).
# #[ignore] is enforced at runtime via cargo test -- --include-ignored (see ci.yml).
# Dependency and security gates run in `ci.yml`. Local: `trunk check` / scripts/ci.sh.

name: trunk-check

on:
  push:
    branches: [main]
  schedule:
    - cron: 17 2 * * *
  workflow_dispatch:

concurrency:
  group: trunk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  trunk_check:
    name: Trunk Code Quality
    runs-on: ubuntu-latest
    # Full scheduled/main checks may inspect the whole repository; allow the
    # hosted job enough time to finish without changing the PR diff gate.
    timeout-minutes: 60
    permissions:
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned formatter for isolated diagnostics
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Report exact artifact-leaf formatting diff
        run: |
          rustfmt --edition 2021 --check \
            crates/pos-core/src/world_artifact.rs \
            crates/pos-core/tests/world_artifact_leaf.rs

      - name: Trunk Check
        uses: trunk-io/trunk-action@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
        with:
          # Pull-request diff checks run as the first stage of ci.yml. This
          # workflow keeps the full repository audit on main and its schedule.
          check-mode: all
