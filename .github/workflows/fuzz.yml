# Targeted libFuzzer coverage for the two untrusted parsing boundaries:
# canonical event bytes and Gateway JSON request bodies.
name: fuzz

on:
  pull_request:
    paths:
      - fuzz/**
      - crates/pos-core/**
      - apps/piglor-gateway/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/fuzz.yml
  schedule:
    - cron: 31 2 * * *
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: 0.13.2

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz-validation:
    name: fuzz-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-deny
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-shear
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: fuzz-validation-nightly-2026-07-01
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz
      - name: Validate isolated fuzz workspace
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo deny --manifest-path Cargo.toml --config deny.toml --locked check
          cargo shear --deny-warnings --locked .
          cargo +nightly-2026-07-01 check --locked --bins

  fuzz:
    needs: fuzz-validation
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target:
          - event_decode
          - gateway_requests
    env:
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && 60 || 300 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rm -f rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly-2026-07-01
          components: rust-src
      - name: Install pinned cargo-fuzz
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-fuzz@${{ env.CARGO_FUZZ_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: fuzz-nightly-2026-07-01-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          workspaces: fuzz
      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: |
          set -euo pipefail
          mkdir -p "artifacts/${{ matrix.target }}"
          cargo +nightly-2026-07-01 fuzz run --target x86_64-unknown-linux-gnu "${{ matrix.target }}" -- \
            -max_total_time="${FUZZ_SECONDS}" \
            -artifact_prefix="artifacts/${{ matrix.target }}/"
      - name: Upload fuzz artifacts and corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/artifacts
            fuzz/corpus
          if-no-files-found: ignore
