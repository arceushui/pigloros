name: ticket-381-format

on:
  push:
    branches: [codex/ticket-381-systemd-start]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: >-
          rustfmt --edition 2021
          apps/pos-sandboxd/src/system_bus.rs
          apps/pos-sandboxd/tests/system_bus_start_public.rs
      - run: git diff --binary > ticket-381-format.patch
      - uses: actions/upload-artifact@v7
        with:
          name: ticket-381-format-patch
          path: ticket-381-format.patch
