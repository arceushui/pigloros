name: erasure-record-export

# TEMPORARY (ADR-062 Revision 8 slice N5, #1233): exports the recorded erasure
# artifacts of one run so they can be checked in. Removed before the PR is ready.
on:
  push:
    branches: [redmine/1233-n5-erasure]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: erasure-record-export
          save-if: false
      - name: Run the erasure conformance cases
        run: |
          set -o pipefail
          cargo test -p pos-experiment --features test-support --locked \
            --test erasure_conformance -- --include-ignored 2>&1 | tee "${RUNNER_TEMP}/erasure.log" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: erasure-records
          path: |
            target/tmp/erasure-conformance
            ${{ runner.temp }}/erasure.log
          if-no-files-found: warn
