name: diag-216-lock

# Diagnostic for #216 (#1457): resolve a fresh Cargo.lock for main plus the evidence adapter's
# manifest edit, and publish it as an artifact. It pushes nothing and touches no pull request.
on:
  push:
    branches: [diag/216-lock]

permissions:
  contents: read

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.1
      - name: Edit the adapter manifest and resolve a fresh lock
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          path = "apps/pos-sandbox-evidence-adapter/Cargo.toml"
          text = open(path).read()
          old = "thiserror = { workspace = true }\n"
          new = (
              "thiserror = { workspace = true }\n\n"
              "# The probes use Linux-only system calls (mount, packet sockets); the library\n"
              "# is Linux-only (see src/lib.rs).\n"
              "[target.'cfg(target_os = \"linux\")'.dependencies]\n"
              "rustix = { workspace = true, features = [\"mount\", \"net\", \"process\"] }\n"
          )
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = "[lints]"
          new = "[dev-dependencies]\ntempfile = { workspace = true }\n\n[lints]"
          assert text.count(old) == 1 and "[dev-dependencies]" not in text
          open(path, "w").write(text.replace(old, new))
          PY
          cat apps/pos-sandbox-evidence-adapter/Cargo.toml
          cargo generate-lockfile
          cp Cargo.lock "${RUNNER_TEMP}/Cargo.lock"
          git diff --stat -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fresh-lock
          path: ${{ runner.temp }}/Cargo.lock
          if-no-files-found: error
