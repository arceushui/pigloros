name: diagnostic-574-red
on: workflow_dispatch
permissions:
  contents: read
jobs:
  public-bundle-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run all content package tests
        run: cargo test -p pos-plugin-content --all-features --locked -- --include-ignored
      - name: Check content package lint policy
        run: cargo clippy -p pos-plugin-content --all-features --all-targets --locked -- -D warnings -W clippy::pedantic
