# Isolated diagnostic only. This does not replace or weaken any PR quality gate.
name: 561-adr120-regression

on:
  push:
    branches: [redmine/561-adr120-regression-probe]

permissions:
  contents: read

jobs:
  regression:
    name: frozen child-local provenance regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: c687cb5e904f09e30de2efc2cdfffb254650b44c
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.97.1
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: test
          save-if: false
      - name: Run the exact frozen regression without converting its failure to success
        env:
          CARGO_BUILD_JOBS: "2"
          CARGO_PROFILE_TEST_DEBUG: line-tables-only
          CARGO_TERM_COLOR: never
          RUSTFLAGS: -D warnings
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c687cb5e904f09e30de2efc2cdfffb254650b44c
          git rev-parse HEAD 'HEAD^{tree}'
          cargo test --package pos-store --all-features --locked --lib \
            sqlite::fork_replay_orphans::tests::unrelated_provenance_preserves_the_requested_childs_exact_budget \
            -- --exact --include-ignored 2>&1 | tee "${RUNNER_TEMP}/adr120-regression.log"
      - name: Preserve the actual diagnostic result including expected red failure
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: untrusted-adr120-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/adr120-regression.log
          if-no-files-found: error
          retention-days: 14
