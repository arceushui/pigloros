# Dependency policy via cargo-deny (crates / licenses / advisories / sources).
# Source attrs (coverage(off), doctest fences) are Trunk rust-test-policy;
# #[ignore] is handled by cargo test -- --include-ignored.

name: cargo-deny

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: cargo-deny-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          # New RustSec advisories should not hard-break every PR overnight.
          - checks: advisories
            continue-on-error: true
          - checks: bans licenses sources
            continue-on-error: false
    continue-on-error: ${{ matrix.continue-on-error }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@b66acf5e9fe20f8aba065be86778a8a4c846f902 # v2
        with:
          command: check ${{ matrix.checks }}
          rust-version: 1.97.1
