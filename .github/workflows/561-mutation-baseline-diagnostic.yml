# Temporary cold-build resource diagnosis, not a required gate or trusted baseline.
# The failed PR merge source and full test command stay fixed.
name: 561-mutation-baseline-diagnostic

on:
  push:
    branches: [redmine/561-mutation-baseline-diagnostic]

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly-2026-08-28
  # Compare with 1633: keep debug metadata fixed and bound compiler concurrency.
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "1"

jobs:
  baseline:
    runs-on: ubuntu-latest
    # Bounded setup (9m), harness (30m), and upload (3m) leave teardown reserve.
    # This diagnostic outer bound does not extend the 28m test command.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 2
        with:
          ref: f5df2a4890d1f778aff7ff27fa4ba7c2378f5bde
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        timeout-minutes: 5
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      # Deliberately cold; retain the frozen source and complete test selection.
      - name: Record exact source, toolchain and runner
        timeout-minutes: 1
        env:
          EXPECTED_SOURCE: f5df2a4890d1f778aff7ff27fa4ba7c2378f5bde
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git rev-parse HEAD | tee artifacts/source-sha.txt
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain --untracked-files=no)"
          observer_tools="$(mktemp -d "${RUNNER_TEMP}/561-rustc-observer.XXXXXX")"
          compiler_wrapper="${observer_tools}/rustc-observer"
          # Bind sampled rustc PIDs to crate names without logging other
          # arguments or environment values. exec preserves the compiler PID.
          cat > "$compiler_wrapper" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$#" -eq 0 ]]; then
            echo 'ERROR: missing compiler executable' >&2
            exit 2
          fi
          compiler_program="$1"
          shift
          compiler_arguments=("$@")
          compiler_crate=probe
          compiler_test=false
          for ((compiler_index=0; compiler_index<${#compiler_arguments[@]}; compiler_index++)); do
            case "${compiler_arguments[compiler_index]}" in
              --crate-name)
                compiler_index=$((compiler_index + 1))
                if [[ "$compiler_index" -ge "${#compiler_arguments[@]}" ]]; then
                  echo 'ERROR: missing compiler crate name' >&2
                  exit 2
                fi
                compiler_crate="${compiler_arguments[compiler_index]}"
                ;;
              --crate-name=*) compiler_crate="${compiler_arguments[compiler_index]#--crate-name=}" ;;
              --test) compiler_test=true ;;
            esac
          done
          if [[ ! "$compiler_crate" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo 'ERROR: invalid compiler crate identity' >&2
            exit 2
          fi
          printf 'COMPILER_START pid=%s crate=%s test=%s\n' \
            "$$" "$compiler_crate" "$compiler_test" >&2
          exec "$compiler_program" "${compiler_arguments[@]}"
          WRAPPER
          chmod 700 "$compiler_wrapper"
          printf 'RUSTC_WRAPPER=%s\n' "$compiler_wrapper" >> "$GITHUB_ENV"
          sha256sum "$compiler_wrapper" | tee artifacts/rustc-observer-sha256.txt
          {
            rustc -Vv
            cargo --version
            uname -a
            nproc
            free -m
            df -h .
            printf 'image=%s version=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
            printf 'rustup_toolchain=%s test_debug=%s build_jobs=%s\n' \
              "$RUSTUP_TOOLCHAIN" "$CARGO_PROFILE_TEST_DEBUG" "$CARGO_BUILD_JOBS"
          } | tee artifacts/environment.txt
      - name: Validate resource-observer availability
        timeout-minutes: 1
        run: |
          set -euo pipefail
          # Fail before the expensive harness if the observer cannot operate.
          # Kernel memory-controller files belong to non-root cgroups, not
          # the hierarchy root. Resolve this runner's actual v2 membership.
          cat /proc/self/cgroup
          cgroup_path="$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)"
          case "$cgroup_path" in
            /*) ;;
            *) echo 'ERROR: no absolute cgroup-v2 membership' >&2; exit 1 ;;
          esac
          if [[ "$cgroup_path" == *$'\n'* || "$cgroup_path" == */../* || "$cgroup_path" == */.. ]]; then
            echo 'ERROR: ambiguous or out-of-namespace cgroup membership' >&2
            exit 1
          fi
          observer_cgroup="/sys/fs/cgroup${cgroup_path%/}"
          for resource in /proc/meminfo /proc/pressure/memory \
            "$observer_cgroup/memory.events" "$observer_cgroup/memory.current" \
            "$observer_cgroup/memory.max"; do
            printf 'REQUIRED_RESOURCE %s\n' "$resource"
            if [[ ! -r "$resource" ]]; then
              printf 'ERROR: unreadable resource %s\n' "$resource" >&2
              exit 1
            fi
          done
          printf '%s\n' "$observer_cgroup" > artifacts/observer-cgroup.txt
          command -v ps
          command -v free
          command -v df
          command -v timeout
          test -x /usr/bin/time
          test -x "$RUSTC_WRAPPER"
          sha256sum --check --strict artifacts/rustc-observer-sha256.txt
      - name: Run the complete unmutated nightly harness with a log-preserving deadline
        timeout-minutes: 30
        run: |
          set -euo pipefail
          date --utc --iso-8601=seconds | tee artifacts/command-start.txt
          IFS= read -r observer_cgroup < artifacts/observer-cgroup.txt
          current_cgroup="$(awk -F: '$1 == "0" && $2 == "" { print $3 }' /proc/self/cgroup)"
          test "$observer_cgroup" = "/sys/fs/cgroup${current_cgroup%/}"
          # Emit directly into the job log: runner death can skip artifact upload.
          # Only process names are sampled. The wrapper above separately emits
          # whitelisted crate identities, never other arguments or environments.
          (
            while true; do
              printf '\nRESOURCE_SAMPLE '
              date --utc --iso-8601=seconds
              free -m
              df -Pm .
              for metric in memory.current memory.max memory.events; do
                printf 'CGROUP %s\n' "$metric"
                cat "$observer_cgroup/$metric"
              done
              printf 'MEMORY_PRESSURE\n'
              cat /proc/pressure/memory
              ps -eo pid,ppid,rss,comm --sort=-rss | sed -n '1,9p'
              sleep 20
            done
          ) &
          observer_pid=$!
          stop_observer() {
            local status=0
            local stop_sent=false
            if kill -0 "$observer_pid" 2>/dev/null; then
              if kill "$observer_pid"; then
                stop_sent=true
              fi
            fi
            wait "$observer_pid" || status=$?
            # SIGTERM is our deliberate observer teardown, not a Cargo status.
            # An observer that died before our teardown must never be accepted.
            if [[ "$stop_sent" != true || "$status" -ne 143 ]]; then
              echo "ERROR: resource observer stopped unexpectedly: $status" >&2
              return 1
            fi
          }
          trap stop_observer EXIT
          set +e
          timeout --kill-after=30s 28m /usr/bin/time -v \
            cargo test --workspace --all-features --locked -- \
            -Zunstable-options --fail-fast --include-ignored --test-threads=2 \
            2>&1 | tee artifacts/mutation-baseline.log
          pipeline_status=("${PIPESTATUS[@]}")
          command_status=${pipeline_status[0]}
          log_status=${pipeline_status[1]}
          set -e
          printf '%s\n' "$command_status" | tee artifacts/command-status.txt
          date --utc --iso-8601=seconds | tee artifacts/command-end.txt
          stop_observer
          trap - EXIT
          # These observations are diagnostic only, never replacements for exit status.
          {
            grep -E 'Finished .*test.*profile|Running |Doc-tests|test result:' artifacts/mutation-baseline.log || true
            tail -n 100 artifacts/mutation-baseline.log
          } > artifacts/phase-frontier.txt
          if [[ "$command_status" -ne 0 ]]; then
            exit "$command_status"
          fi
          if [[ "$log_status" -ne 0 ]]; then
            exit "$log_status"
          fi
          # Require a positive suite and the repository's unchanged ignored-test rule.
          grep -Eq '^test result: ok\. [1-9][0-9]* passed;' artifacts/mutation-baseline.log
          if grep -E 'test result:.*; [1-9][0-9]* ignored;' artifacts/mutation-baseline.log; then
            echo 'ERROR: ignored tests reported.' >&2
            exit 1
          fi
          bash scripts/assert-no-ignored-in-test-summary.sh artifacts/mutation-baseline.log
      - name: Preserve the phase log even on failure
        if: ${{ always() }}
        timeout-minutes: 3
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: untrusted-561-mutation-resources-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
