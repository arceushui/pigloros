name: Temporary Cancel Obsolete Wave 8 Run
on:
  push:
    branches:
      - automation/format-wave8-targeted-20261002
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the superseded root CI run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(
            curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GITHUB_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/36907936731/cancel"
          )"
          case "${status}" in
            202|409) exit 0 ;;
            *) echo "unexpected cancellation status: ${status}" >&2; exit 1 ;;
          esac
