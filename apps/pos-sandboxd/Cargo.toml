[package]
name = "pos-sandboxd"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
futures-util = { version = "0.3", default-features = false }
pos-reference = { path = "../../crates/pos-reference" }
rustix = { version = "1.1.4", default-features = false, features = ["fs", "std", "time"] }
thiserror = { workspace = true }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "=0.26100.0", default-features = false, features = [
  "systemd1",
  "zbus-async-tokio",
] }
zvariant = "=5.15.0"

[dev-dependencies]
pos-conformance = { path = "../../crates/pos-conformance" }
tempfile = { workspace = true }
tokio = { workspace = true }
zbus = { version = "=5.19.0", default-features = false, features = [
  "p2p",
  "tokio",
] }

[lints]
workspace = true
