[package]
name = "pos-sandboxd"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { version = "0.3", default-features = false }
# Safe `execveat` for the launcher's final release step (Q9.12). Only the
# `process` feature, which gates `fcntl::AtFlags`, is enabled.
nix = { version = "=0.31.3", default-features = false, features = ["process"] }
pos-reference = { path = "../../crates/pos-reference" }
rustix = { version = "1.1.4", default-features = false, features = [
  "fs",
  "mount",
  "net",
  "process",
  "std",
  "time",
] }
# Adopts the descriptors systemd passes at fixed numbers as `OwnedFd` (Q9.14).
sd-listen-fds = "=0.2.0"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", default-features = false, features = [
  "net",
  "rt",
  "rt-multi-thread",
  "time",
] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "=0.26200.0", default-features = false, features = [
  "systemd1",
  "zbus-async-tokio",
] }
# ADR-087 MountImage transport. The facade needs its `tokio` runtime feature
# for descriptor support; production code supplies its own atomic
# close-on-exec socket instead of zlink's Tokio Unix stream.
zlink = { version = "=0.7.1", default-features = false, features = [
  "tokio",
  "tracing",
] }
zvariant = "=5.15.0"
zeroize = { workspace = true }

[dev-dependencies]
pos-conformance = { path = "../../crates/pos-conformance" }
# Staging fixture for the privileged held-image activation test only.
pos-reference = { path = "../../crates/pos-reference", features = [
  "test-support",
] }
tempfile = { workspace = true }
tokio = { workspace = true }
zlink = { version = "=0.7.1", default-features = false, features = [
  "proxy",
  "tokio",
  "tracing",
] }
zbus = { version = "=5.19.0", default-features = false, features = [
  "p2p",
  "tokio",
] }

[lints]
workspace = true
