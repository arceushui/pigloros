[package]
name = "pos-experiment"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Also compiles the replay-conformance subject adapter (`replay_conformance`, the
# binary's EAI1/EAO1 entry): it runs on the open fixture erasure gate and the
# generated Plugin registration of the Experiment host. It also compiles the
# G-PUB non-interference capture adapters (ADR-062 Revision 8 slice N1), whose
# public Gateway protocol seam needs the Gateway router and a Tokio runtime, and
# the Linux-only G-OPS capture adapters (slice N3), which run a WAT guest through
# the community Plugin supervisor and worker.
test-support = [
  "pos-core/test-support",
  "pos-runtime/test-support",
  "dep:pos-plugin-supervisor",
  "pos-plugin-supervisor/test-support",
  "dep:pos-plugin-worker",
  "dep:wat",
  "dep:axum",
  "dep:piglor-gateway",
  "dep:pos-plugin-ledger",
  "dep:pos-time",
  "dep:tokio",
  "dep:tower",
  "dep:zeroize",
]

# The replay-conformance subject adapter; it is compiled only with `test-support`.
[[bin]]
name = "pos-experiment"
path = "src/main.rs"
required-features = ["test-support"]

# The harness probe subject of the non-interference fresh-process Local
# runner (ADR-062 Revision 8 slice N0); it is compiled only with `test-support`.
[[bin]]
name = "pos-ni-local-probe"
path = "src/bin/pos-ni-local-probe.rs"
required-features = ["test-support"]

# The fresh-process Local subject of the G-PUB rows (ADR-062 Revision 8 slice
# N1); it is compiled only with `test-support`.
[[bin]]
name = "pos-ni-g-pub-subject"
path = "src/bin/pos-ni-g-pub-subject.rs"
required-features = ["test-support"]

# The fresh-process Local subject of the G-OPS rows (ADR-062 Revision 8 slice
# N3); it is compiled only with `test-support` and runs only on Linux.
[[bin]]
name = "pos-ni-g-ops-subject"
path = "src/bin/pos-ni-g-ops-subject.rs"
required-features = ["test-support"]

# The community Plugin Component worker the G-OPS subject's supervisor launches
# (the `pos-plugin-worker` library behind this crate's own binary, so tests can
# name it); it is compiled only with `test-support` and runs only on Linux.
[[bin]]
name = "pos-ni-g-ops-worker"
path = "src/bin/pos-ni-g-ops-worker.rs"
required-features = ["test-support"]

# The fresh-process Local subject of the G-FORK row (ADR-062 Revision 8 slice
# N4); it is compiled only with `test-support` and runs only on Linux.
[[bin]]
name = "pos-ni-g-fork-subject"
path = "src/bin/pos-ni-g-fork-subject.rs"
required-features = ["test-support"]

# The fresh-process Local subject of the G-PLUG rows (ADR-062 Revision 8 slice
# N2); it is compiled only with `test-support`.
[[bin]]
name = "pos-ni-g-plug-subject"
path = "src/bin/pos-ni-g-plug-subject.rs"
required-features = ["test-support"]

[dependencies]
zeroize = { workspace = true, optional = true }
pos-core = { path = "../../crates/pos-core" }
pos-crypto = { path = "../../crates/pos-crypto" }
pos-store = { path = "../../crates/pos-store" }
pos-state = { path = "../../crates/pos-state" }
pos-runtime = { path = "../../crates/pos-runtime", features = [
  "local-admission-host",
] }
pos-conformance = { path = "../../crates/pos-conformance" }
pos-reference = { path = "../../crates/pos-reference" }
pos-plugin-eval = { path = "../../plugins/eval" }
pos-plugin-society = { path = "../../plugins/society" }
pos-plugin-world = { path = "../../plugins/world" }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
ciborium = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
axum = { workspace = true, optional = true }
piglor-gateway = { path = "../piglor-gateway", optional = true }
pos-plugin-ledger = { path = "../../plugins/ledger", optional = true }
# The PWQ1/PWR1 public Plugin protocol codec of the G-PLUG capture adapters
# (ADR-062 Revision 8 slice N2, #1230).
pos-plugin-supervisor = { path = "../../crates/pos-plugin-supervisor", optional = true }
tokio = { workspace = true, optional = true }
tower = { workspace = true, optional = true }

[dev-dependencies]
pos-core = { path = "../../crates/pos-core", features = ["test-support"] }
pos-runtime = { path = "../../crates/pos-runtime", features = ["test-support"] }
# `test-support` gives the replay provider-dispatch vectors (ADR-062 Revision 8, #1296) the signed
# in-memory CFB1 corpus builder of `pos-reference`'s public tests.
pos-reference = { path = "../../crates/pos-reference", features = [
  "test-support",
] }
pos-plugin-agent = { path = "../../plugins/agent" }
pos-plugin-rule-agent = { path = "../../plugins/entities/rule-agent" }
pos-plugin-synthetic-obs = { path = "../../plugins/observations/synthetic" }
rusqlite = { workspace = true }
tempfile = "3"

# Linux-only: the `pos-time::counterfactual` module exists only on Linux. Only
# the `fork_artifacts` module (feature `test-support`) and the counterfactual
# tests use it and are cfg-gated the same way, so other targets and builds
# without `test-support` never see the dependency.
[target.'cfg(target_os = "linux")'.dependencies]
pos-time = { path = "../../crates/pos-time", optional = true }
# The G-OPS capture adapters (feature `test-support`, slice N3): the community
# Plugin supervisor, whose `test-support` release fixtures the feature forwards,
# the worker library and the WAT text compiler of the checked-in guest. The
# supervisor runs workers only on Linux.
pos-plugin-supervisor = { path = "../../crates/pos-plugin-supervisor", optional = true }
pos-plugin-worker = { path = "../pos-plugin-worker", optional = true }
wat = { workspace = true, optional = true }

