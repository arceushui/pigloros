[package]
name = "piglor-ledger"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Prediction Ledger CLI + static HTML renderer (ADR-017 / #110)"

[[bin]]
name = "piglor-ledger"
path = "src/main.rs"

[lib]
name = "piglor_ledger"
path = "src/lib.rs"

[dependencies]
pos-core = { path = "../../crates/pos-core" }
pos-crypto = { path = "../../crates/pos-crypto" }
pos-local-erasure-loader = { path = "../../crates/pos-local-erasure-loader" }
pos-store = { path = "../../crates/pos-store" }
pos-runtime = { path = "../../crates/pos-runtime" }
pos-plugin-ledger = { path = "../../plugins/ledger" }
blake3 = { workspace = true }
ed25519-dalek = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
rusqlite = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
pos-core = { path = "../../crates/pos-core", features = ["test-support"] }
tempfile = { workspace = true }

# ADR-136 acceptance test 11 (#1450): the key-less root store fixture
# provisions its store through the Gateway, which depends on this crate; the
# cycle is dev-only.
[target.'cfg(target_os = "linux")'.dev-dependencies]
piglor-gateway = { path = "../piglor-gateway" }
pos-conformance = { path = "../../crates/pos-conformance" }

# The ADR-136 acceptance test 11 tests include the shared signing and
# key-less store fixtures via #[path]; cargo-shear does not attribute the
# external fixtures' imports to this package. Keep these required
# dev-dependencies; restrict the false-positive exception to them.
[package.metadata.cargo-shear]
ignored = ["piglor-gateway", "pos-conformance"]

[lints]
workspace = true
