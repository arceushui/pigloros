[package]
name = "pos-mvp"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish.workspace = true

[[bin]]
name = "pos-mvp"
path = "src/main.rs"

[dependencies]
pos-core = { path = "../../crates/pos-core" }
pos-experiment = { path = "../pos-experiment" }
pos-store = { path = "../../crates/pos-store" }
pos-plugin-eval = { path = "../../plugins/eval" }
pos-plugin-persona = { path = "../../plugins/persona" }
pos-plugin-geo = { path = "../../plugins/geo" }
pos-runtime = { path = "../../crates/pos-runtime" }
pos-state = { path = "../../crates/pos-state" }
pos-time = { path = "../../crates/pos-time" }
serde_json = { workspace = true }
ciborium = { workspace = true }
ureq = { version = "2", default-features = false, features = ["json"] }

[lints]
workspace = true
