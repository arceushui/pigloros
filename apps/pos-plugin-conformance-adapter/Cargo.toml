[package]
name = "pos-plugin-conformance-adapter"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The community Plugin conformance subject adapter (ADR-061 revision 8 decision 2, #615): it
# reads one EAI1 attempt, runs the sub-cases of its payload on the in-memory evaluation world and
# the supervised worker, and writes one EAO1 observation. It is the only crate that enables the
# fixture evaluation instant (`scripts/check_fixture_instant_confinement.py`) and it links no
# Wasmtime (`scripts/check-adapter-graph.sh`).
[[bin]]
name = "pos-plugin-conformance-adapter"
path = "src/main.rs"

[dependencies]
blake3 = { workspace = true }
ciborium = { workspace = true }
pos-core = { path = "../../crates/pos-core", features = ["fixture-instant"] }
pos-crypto = { path = "../../crates/pos-crypto" }
pos-plugin-release = { path = "../../crates/pos-plugin-release" }
pos-plugin-supervisor = { path = "../../crates/pos-plugin-supervisor" }
pos-reference = { path = "../../crates/pos-reference" }
# The pass store needs the local scheduled-admission host behind this feature; the confinement
# guard bounds who may enable it (owner decision O-8).
pos-runtime = { path = "../../crates/pos-runtime", features = [
  "local-admission-host",
] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# The runner tests build their releases and trust material on the signed-release test world.
pos-plugin-publisher = { path = "../../crates/pos-plugin-publisher", features = [
  "test-support",
] }

[lints]
workspace = true
