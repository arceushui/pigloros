[package]
name = "piglor-gateway"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Wave 6 local-first HTTP gateway (ADR-014 / #69; WS follow-up)"

[features]
# Compiles the ADR-123 §3a store installation command (`store_installation`)
# for test fixtures. Never enabled in deployable builds
# (scripts/check_test_support_features.py): no deployable build may install a
# store that no ungated participant could open (ADR-123 G13).
test-support = ["pos-store/test-support"]

[[bin]]
name = "piglor-gateway"
path = "src/main.rs"

[[test]]
name = "store_installation_public"
required-features = ["test-support"]

[dependencies]
# The Local Principal authentication adapter builds its trust roots with the
# composition-root seal (ADR-129 A5.9, #1374;
# scripts/check_authority_trust_root_seal.py).
pos-core = { path = "../../crates/pos-core", features = [
  "authority-trust-root",
] }
pos-crypto = { path = "../../crates/pos-crypto" }
pos-local-erasure-loader = { path = "../../crates/pos-local-erasure-loader" }
pos-runtime = { path = "../../crates/pos-runtime" }
pos-store = { path = "../../crates/pos-store" }
pos-plugin-ledger = { path = "../../plugins/ledger" }
pos-plugin-society = { path = "../../plugins/society" }
pos-plugin-world = { path = "../../plugins/world" }
pos-plugin-geo = { path = "../../plugins/geo" }
piglor-ledger = { path = "../piglor-ledger" }
serde = { workspace = true }
serde_json = { workspace = true }
ciborium = { workspace = true }
thiserror = { workspace = true }
ulid = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
blake3 = { workspace = true }
rand = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }

[build-dependencies]
ciborium = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
ed25519-dalek = { workspace = true }
rustix = { version = "1.1.4", default-features = false, features = [
  "fs",
  "net",
  "process",
  "rand",
  "std",
] }

[dev-dependencies]
pos-conformance = { path = "../../crates/pos-conformance" }
pos-core = { path = "../../crates/pos-core", features = [
  "authority-trust-root",
  "test-support",
] }
pos-experiment = { path = "../pos-experiment", features = ["test-support"] }
pos-runtime = { path = "../../crates/pos-runtime", features = ["test-support"] }
pos-state = { path = "../../crates/pos-state" }
pos-store = { path = "../../crates/pos-store", features = ["test-support"] }
pos-plugin-agent = { path = "../../plugins/agent" }
pos-plugin-eval = { path = "../../plugins/eval" }
pos-plugin-persona = { path = "../../plugins/persona" }
tempfile = { workspace = true }
rusqlite = { workspace = true }
sha2 = { workspace = true }

[lints]
workspace = true
