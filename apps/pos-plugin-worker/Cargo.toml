[package]
name = "pos-plugin-worker"
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The community Plugin Component worker program (ADR-061 revision 4, #542).
# It is the only program that links the Wasmtime runtime; the supervisor
# launches one fresh instance per Component invocation.
[[bin]]
name = "pos-plugin-worker"
path = "src/main.rs"

[dependencies]
pos-plugin-host = { path = "../../crates/pos-plugin-host" }
pos-plugin-supervisor = { path = "../../crates/pos-plugin-supervisor" }
pos-runtime = { path = "../../crates/pos-runtime" }

[dev-dependencies]
# Worker tests share the supervisor's fixtures, which build negotiated releases
# without a release closure.
pos-crypto = { path = "../../crates/pos-crypto", features = ["test-support"] }
pos-plugin-supervisor = { path = "../../crates/pos-plugin-supervisor", features = [
  "test-support",
] }
# The handoff vectors gate real releases and run host passes over real Drivers.
pos-runtime = { path = "../../crates/pos-runtime", features = ["test-support"] }

# The handoff vectors run on the shared signed-release test world (ADR-061 revision 7, #579 and
# #585). The conformance fixture vectors (ADR-061 revision 8, #617) run the adapter library over
# the real worker and build their attempts with `pos-reference`'s EAI1 types; the adapter's
# fixture-instant type is reached only through the library (`check_fixture_instant_confinement.py`).
[target.'cfg(target_os = "linux")'.dev-dependencies]
# `blake3` (the EAI1 artifact digests) and `serde_json` (the provider manifest) widen the ADR's
# dependency statement for this slice: `pos-reference` and `pos-crypto` offer no plain hasher.
blake3 = { workspace = true }
pos-plugin-conformance-adapter = { path = "../pos-plugin-conformance-adapter" }
pos-plugin-publisher = { path = "../../crates/pos-plugin-publisher", features = [
  "test-support",
] }
pos-reference = { path = "../../crates/pos-reference" }
serde_json = { workspace = true }

[lints]
workspace = true
