[workspace]
members = [
  "crates/pos-core",
  "crates/pos-crypto",
  "crates/pos-store",
  "crates/pos-state",
  "crates/pos-time",
  "crates/pos-query",
  "crates/pos-runtime",
  "crates/pos-conformance",
  "crates/pos-reference",
  "crates/pos-plugin-release",
  "crates/pos-plugin-publisher",
  "crates/pos-owner-bridge",
  "crates/pos-owner-bridge-codec",
  "crates/pos-plugin-host",
  "crates/pos-plugin-supervisor",
  "crates/pos-owner-bridge-windows",
  "plugins/entities/rule-agent",
  "plugins/observations/synthetic",
  "plugins/eval",
  "plugins/agent",
  "plugins/bridges",
  "plugins/persona",
  "plugins/geo",
  "plugins/world",
  "plugins/society",
  "plugins/ledger",
  "apps/pos-experiment",
  "apps/pos-cli",
  "apps/pos-sandboxd",
  "apps/pos-plugin-worker",
  "apps/pos-plugin-conformance-adapter",
  "apps/piglor-gateway",
  "apps/piglor-ledger",
  "apps/piglor-world-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# IDs
ulid = { version = "3", features = ["serde"] }

# Zero-copy byte buffers
bytes = "1"
serde_bytes = "0.11"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "3", features = ["serde", "rand_core", "zeroize"] }
hpke = { version = "=0.14.1", default-features = false, features = [
  "alloc",
  "getrandom",
  "x25519",
  "chacha",
] }
x25519-dalek = "=3.0.0"
libc = "0.2"
rustix = { version = "1.1.4", default-features = false, features = [
  "fs",
  "std",
] }
sha2 = "0.11"
rand = "0.10"
zeroize = "1.9"
httparse = { version = "=1.10.1", default-features = false }
base64 = { version = "=0.23.1", default-features = false }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa"] }
getrandom = "=0.4.3"
# ADR-091/097 subject key wrap and subject ciphertext (ADR-110 §3 pins).
aes-gcm = { version = "=0.11.1", default-features = false, features = [
  "aes",
  "zeroize",
] }
hkdf = "=0.13.0"

# Error handling
thiserror = "2"

# Ordered maps (insertion-order guaranteed)
indexmap = "2"
num-traits = "0.2"

# SQLite
rusqlite = { version = "0.40", features = ["bundled", "hooks", "functions"] }

# Community Plugin Component host (ADR-061 revision 4, decision 2): an exact
# pin with default features off. `runtime` is the feature that lets the
# Component Model instantiate and call a Component; `scripts/
# check_wasmtime_feature_pin.py` fails if any further feature is resolved.
wasmtime = { version = "=49.0.5", default-features = false, features = [
  "component-model",
  "cranelift",
  "runtime",
] }

# Testing
proptest = "1"
tempfile = "3"
# Component text fixtures for the community Plugin host tests; the same
# wasm-tools release (wasmparser 0.258) that builds the guest fixtures.
wat = "=1.262.0"

# Data files
toml = "1.1"
url = "2"

# Gateway (Wave 6 / ADR-014)
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "time",
  "signal",
] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1

# Signature and digest verification dominates test CPU time: at opt-level 0
# every curve25519-dalek SIMD intrinsic is an out-of-line call. Optimizing
# only these dependencies cut workspace test time substantially for a small
# cold-build cost (measurements in #649). Workspace crates stay unoptimized
# for coverage and debugging; the test profile inherits these overrides.
# Cargo only warns if a listed crate leaves the dependency graph.

# Ed25519 signatures.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

# Digests. A name-only spec covers both locked sha2 versions (0.10 and 0.11).
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.blake3]
opt-level = 3

# Bundled SQLite repeatedly prepares and validates the full store schema in
# public adapter tests. Keep its C engine optimized as well: unoptimized
# pos-store worker baselines approach the 120-second mutation test limit (#399).
# Workspace crates retain their default coverage and debugging profile.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

# P-256 (WebAuthn) and its arithmetic stack.
[profile.dev.package.p256]
opt-level = 3

[profile.dev.package.ecdsa]
opt-level = 3

[profile.dev.package.elliptic-curve]
opt-level = 3

[profile.dev.package.primeorder]
opt-level = 3

[profile.dev.package.crypto-bigint]
opt-level = 3

# Community Plugin guests. Every real-worker launch validates the guest and
# compiles it with Cranelift at OptLevel::Speed (pos-plugin-host engine.rs),
# so the real-worker tests run an opt-level 0 compiler on every launch.
# A name-only spec covers both locked wasmparser versions (0.258 and 0.261).
[profile.dev.package.wasmtime]
opt-level = 3

[profile.dev.package.wasmtime-environ]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

# ELF emission for each compiled guest.
[profile.dev.package.object]
opt-level = 3

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  "cfg(coverage)",
] }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"

dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

exit = "deny"
mem_forget = "deny"
let_underscore_must_use = "deny"
