[workspace]
members = [
  "crates/pos-core",
  "crates/pos-crypto",
  "crates/pos-store",
  "crates/pos-state",
  "crates/pos-time",
  "crates/pos-query",
  "crates/pos-runtime",
  "crates/pos-conformance",
  "crates/pos-reference",
  "plugins/entities/rule-agent",
  "plugins/observations/synthetic",
  "plugins/eval",
  "plugins/agent",
  "plugins/bridges",
  "plugins/persona",
  "plugins/geo",
  "plugins/world",
  "plugins/society",
  "plugins/ledger",
  "apps/pos-experiment",
  "apps/pos-cli",
  "apps/piglor-gateway",
  "apps/piglor-ledger",
  "apps/piglor-world-client",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.97"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"

# IDs
ulid = { version = "2", features = ["serde"] }

# Zero-copy byte buffers
bytes = "1"
serde_bytes = "0.11"

# Crypto
blake3 = "1"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.9"
dryoc = "0.9"

# Error handling
thiserror = "2"

# Ordered maps (insertion-order guaranteed)
indexmap = "2"

# SQLite
rusqlite = { version = "0.36", features = ["bundled", "hooks", "functions"] }

# Testing
proptest = "1"
tempfile = "3"

# Data files
toml = "0.8"
url = "2"

# Gateway (Wave 6 / ADR-014)
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "net",
  "time",
  "signal",
] }
axum = { version = "0.8" }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  "cfg(coverage_nightly)",
  "cfg(coverage)",
] }
unreachable_pub = "warn"
