[package]
name = "sandbox-provider-feasibility"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
futures-util = "=0.3.34"
netlink-packet-core = "=0.9.0"
netlink-packet-netfilter = "=0.4.0"
rtnetlink = "=0.23.0"
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = "deny"

