[package]
name = "sandbox-provider-feasibility"
version = "0.0.0"
edition = "2021"
rust-version = "1.87"
license = "MIT"
publish = false

[workspace]

[dependencies]
blake3 = "=1.8.2"
ciborium = "=0.2.2"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.34"
hex = "=0.4.3"
netlink-packet-core = "=0.9.0"
netlink-packet-netfilter = "=0.4.0"
netlink-sys = "=0.9.0"
nix = { version = "=0.31.3", default-features = false, features = [
  "fs",
  "process",
  "resource",
  "sched",
  "socket",
  "time",
  "uio",
] }
rtnetlink = "=0.23.0"
tokio = { version = "=1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "time",
] }
zbus = { version = "=5.19.0", default-features = false, features = ["tokio"] }
zbus_systemd = { version = "=0.26100.0", default-features = false, features = [
  "systemd1",
  "zbus-async-tokio",
] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = "deny"
